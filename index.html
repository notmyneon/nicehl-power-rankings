<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NiceHL Power Rankings</title>
  <style>
    :root {
      --burgundy: #5b0f1a;
      --burgundy-dark: #360810;
      --burgundy-light: #7a1827;
      --silver: #c0c0c0;
      --silver-light: #eeeeee;
      --white: #ffffff;
      --black: #050505;
      --black-soft: #151515;
      --line: rgba(192, 192, 192, 0.45);
      --shadow: 0 18px 42px rgba(0, 0, 0, 0.36);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Aptos, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(91, 15, 26, 0.72), transparent 34%),
        radial-gradient(circle at bottom right, rgba(192, 192, 192, 0.26), transparent 32%),
        var(--black);
      color: var(--white);
      line-height: 1.25;
    }

    .app {
      width: min(1240px, calc(100% - 28px));
      margin: 18px auto 34px;
    }

    .editor {
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(5, 5, 5, 0.94);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .editor-header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(135deg, var(--burgundy), var(--black));
    }

    .hint {
      color: var(--silver-light);
      font-size: 12px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
    }

    button, select, input { font: inherit; }

    button, .file-label {
      border: 1px solid var(--silver);
      color: var(--white);
      background: var(--burgundy);
      font-weight: 800;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
    }

    button.secondary, .file-label.secondary {
      color: var(--white);
      background: var(--black-soft);
      border-color: var(--silver);
    }

    button.danger {
      background: var(--black);
      color: var(--silver-light);
      border-color: var(--silver);
    }

    select, input[type="text"], input[type="number"] {
      color: var(--white);
      background: var(--black-soft);
      border: 1px solid var(--silver);
      border-radius: 9px;
      padding: 8px 9px;
      outline: none;
    }

    select:focus, input:focus {
      border-color: var(--white);
      box-shadow: 0 0 0 2px rgba(192, 192, 192, 0.24);
    }

    input[type="number"] { width: 82px; }
    input.team-name { min-width: 185px; }
    input.manager { min-width: 132px; }
    input.record { width: 76px; }

    .data-wrap {
      padding: 12px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th {
      text-align: left;
      color: var(--white);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 9px 8px;
      border-bottom: 1px solid var(--line);
      background: var(--burgundy-dark);
      position: sticky;
      top: 0;
      z-index: 1;
    }

    td {
      padding: 7px 8px;
      border-bottom: 1px solid rgba(192, 192, 192, 0.2);
      vertical-align: middle;
    }

    .hidden { display: none !important; }

    .awards-editor {
      padding: 0 12px 12px;
    }

    .awards-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .award-input-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 9px;
      background: rgba(21, 21, 21, 0.92);
    }

    .award-input-card label {
      display: block;
      margin-bottom: 4px;
      color: var(--silver-light);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.09em;
    }

    .award-input-card input {
      width: 100%;
      margin-bottom: 6px;
    }

    .board-shell {
      border: 2px solid var(--silver);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      background: var(--black);
    }

    .board {
      width: 100%;
      min-height: 790px;
      padding: 18px;
      background:
        linear-gradient(135deg, rgba(91, 15, 26, 0.98), rgba(5, 5, 5, 0.98) 48%, rgba(21, 21, 21, 0.98)),
        repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 13px);
      color: var(--white);
    }

    .board-top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: end;
      padding: 4px 6px 10px;
      border-bottom: 2px solid var(--silver);
    }


    .title-lockup {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .league-logo {
      width: 116px;
      height: 116px;
      object-fit: contain;
      border: none;
      background: transparent;
      padding: 0;
      flex: 0 0 auto;
      display: none;
    }

    .league-logo.has-logo {
      display: block;
    }

    .title-text {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 6vw, 72px);
      line-height: 0.88;
      letter-spacing: -0.065em;
      text-transform: uppercase;
    }

    .week-badge {
      min-width: 172px;
      padding: 11px 14px;
      border-radius: 17px;
      text-align: center;
      color: var(--black);
      background: linear-gradient(135deg, var(--white), var(--silver));
      border: 2px solid var(--white);
    }

    .week-badge span {
      display: block;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.13em;
      color: var(--black);
    }

    .week-badge strong {
      display: block;
      margin-top: 3px;
      font-size: 31px;
      line-height: 1;
      color: var(--burgundy);
      letter-spacing: -0.05em;
    }

    .summary-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
      margin: 12px 6px;
    }

    .summary-card {
      min-height: 58px;
      border-radius: 14px;
      padding: 9px 11px;
      background: var(--white);
      border: 1px solid var(--silver);
      color: var(--black);
      overflow: hidden;
    }

    .summary-card span {
      display: block;
      font-size: 9px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      color: var(--burgundy);
    }

    .summary-card strong {
      display: block;
      margin-top: 3px;
      font-size: 16px;
      line-height: 1.04;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .summary-card small {
      display: block;
      margin-top: 2px;
      font-size: 10px;
      color: var(--black-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rankings-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px 9px;
      padding: 0 6px 6px;
    }

    .rank-card {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 82px 70px;
      gap: 7px;
      align-items: center;
      min-height: 61px;
      padding: 8px;
      border-radius: 15px;
      background: linear-gradient(135deg, var(--white), var(--silver-light));
      border: 1px solid var(--silver);
      color: var(--black);
      overflow: hidden;
      box-shadow: inset 5px 0 0 var(--burgundy);
    }

    .rank-card.top {
      background: linear-gradient(135deg, var(--silver-light), var(--white));
      border: 2px solid var(--white);
      box-shadow: inset 7px 0 0 var(--burgundy), 0 0 0 1px var(--silver);
    }

    .rank-num {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: var(--white);
      background: linear-gradient(135deg, var(--burgundy), var(--black));
      font-size: 20px;
      font-weight: 950;
      line-height: 1;
    }

    .team-block { min-width: 0; }

    .team-block h3 {
      margin: 0;
      font-size: 17px;
      line-height: 1.02;
      letter-spacing: -0.035em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .team-meta {
      display: flex;
      gap: 5px;
      margin-top: 4px;
      min-width: 0;
      align-items: center;
      color: var(--black);
      font-size: 10px;
      font-weight: 850;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      border-radius: 999px;
      padding: 2px 6px;
      background: var(--silver-light);
      border: 1px solid var(--silver);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric {
      text-align: right;
      border-left: 1px solid var(--silver);
      padding-left: 7px;
    }

    .metric span {
      display: block;
      font-size: 9px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--burgundy);
    }

    .metric strong {
      display: block;
      font-size: 23px;
      line-height: 1;
      letter-spacing: -0.045em;
      margin-top: 2px;
    }

    .movement {
      text-align: center;
      padding: 7px 5px;
      border-radius: 12px;
      border: 1px solid var(--silver);
      background: var(--silver-light);
      color: var(--black);
      font-size: 12px;
      font-weight: 950;
      line-height: 1.05;
      min-height: 39px;
      display: grid;
      place-items: center;
    }

    .movement.up {
      background: var(--burgundy);
      color: var(--white);
      border-color: var(--burgundy-dark);
    }

    .movement.down {
      background: var(--black);
      color: var(--silver-light);
      border-color: var(--black);
    }

    .movement.same {
      background: var(--silver-light);
      color: var(--black);
    }

    .footer-line {
      display: none;
    }

    .screenshot-mode .editor { display: none; }
    .screenshot-mode .app { width: min(1180px, calc(100% - 10px)); margin: 5px auto; }
    .screenshot-mode .board-shell { border-radius: 18px; }
    .screenshot-mode .board { min-height: 760px; padding: 14px; }
    .screenshot-mode h1 { font-size: clamp(42px, 5.4vw, 64px); }
    .screenshot-mode .league-logo { width: 106px; height: 106px; }
    .screenshot-mode .rank-card { min-height: 58px; }

    @media (max-width: 860px) {
      .editor-header, .board-top, .summary-strip, .rankings-grid, .awards-grid { grid-template-columns: 1fr; }
      .controls { justify-content: flex-start; }
      .title-lockup { align-items: flex-start; }
      .league-logo { width: 92px; height: 92px; }
      .rank-card { grid-template-columns: 44px 1fr 74px; }
      .movement { grid-column: 1 / -1; }
      h1 { font-size: 44px; }
    }

    @media print {
      @page { size: letter landscape; margin: 0.2in; }
      body {
        background: white !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .editor, .no-print { display: none !important; }
      .app { width: 100%; margin: 0; }
      .board-shell { border-radius: 0; box-shadow: none; }
      .board { min-height: auto; padding: 12px; }
      h1 { font-size: 52px; }
      .summary-strip { margin: 9px 6px; }
      .rank-card { min-height: 56px; padding: 7px; }
      .team-block h3 { font-size: 15px; }
      .metric strong { font-size: 20px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="editor">
      <div class="editor-header">
        <div class="controls no-print">
          <label for="weekSelect" class="hint">Rank by:</label>
          <select id="weekSelect"></select>
          <button type="button" onclick="addTeam()">Add Team</button>
          <button type="button" onclick="addWeek()">Add Week</button>
          <button type="button" onclick="updateFromTable()">Update</button>
          <label class="file-label secondary" for="logoFile">Choose Logo</label>
          <input id="logoFile" class="hidden" type="file" accept="image/*" onchange="importLogo(event)" />
          <button type="button" class="secondary" onclick="removeLogo()">Remove Logo</button>
          <button type="button" class="secondary" onclick="toggleScreenshotMode()">Screenshot Mode</button>
          <button type="button" class="secondary" onclick="downloadData()">Export</button>
          <label class="file-label secondary" for="importFile">Import</label>
          <input id="importFile" class="hidden" type="file" accept="application/json" onchange="importData(event)" />
          <button type="button" class="secondary" onclick="window.print()">Print/PDF</button>
          <button type="button" class="danger" onclick="resetSample()">Reset</button>
        </div>
      </div>
      <div class="data-wrap">
        <table id="inputTable" aria-label="Team ELO input table"></table>
      </div>
      <div class="awards-editor no-print" id="awardsEditor"></div>
    </section>

    <section class="board-shell" id="captureArea">
      <div class="board">
        <div class="board-top">
          <div class="title-lockup">
            <img id="leagueLogo" class="league-logo" alt="NiceHL logo" />
            <div class="title-text">
              <h1 id="leagueTitle" contenteditable="true">NiceHL Power Rankings</h1>
            </div>
          </div>
          <div class="week-badge">
            <span>Current Week</span>
            <strong id="heroWeek">Week 0</strong>
          </div>
        </div>

        <div class="summary-strip" id="summaryStrip"></div>
        <div class="rankings-grid" id="rankings"></div>

        <div class="footer-line">
          <span id="rankSubhead"></span>
        </div>
      </div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "niceHLEloPowerRankings_v6_week0_1000elo_custom_awards_logo_upload_column_layout";

    const defaultState = {
      currentWeek: 0,
      weeks: ["Week 0"],
      teams: [
        { name: "Touchdown Philosophers", manager: "Manager 1", record: "0-0", elo: [1000] },
        { name: "Waiver Wizards", manager: "Manager 2", record: "0-0", elo: [1000] },
        { name: "Fourth and Forever", manager: "Manager 3", record: "0-0", elo: [1000] },
        { name: "Gridiron Gremlins", manager: "Manager 4", record: "0-0", elo: [1000] },
        { name: "Burgundy Zone Royalty", manager: "Manager 5", record: "0-0", elo: [1000] },
        { name: "Bench Mob", manager: "Manager 6", record: "0-0", elo: [1000] },
        { name: "Bye Week Bandits", manager: "Manager 7", record: "0-0", elo: [1000] },
        { name: "The Injury Report", manager: "Manager 8", record: "0-0", elo: [1000] },
        { name: "End Zone Accountants", manager: "Manager 9", record: "0-0", elo: [1000] },
        { name: "Pylon Pirates", manager: "Manager 10", record: "0-0", elo: [1000] },
        { name: "Snap Count Sickos", manager: "Manager 11", record: "0-0", elo: [1000] },
        { name: "Goal Line Goblins", manager: "Manager 12", record: "0-0", elo: [1000] },
        { name: "Flex Appeal", manager: "Manager 13", record: "0-0", elo: [1000] },
        { name: "Sunday Scaries", manager: "Manager 14", record: "0-0", elo: [1000] },
        { name: "Turf Monsters", manager: "Manager 15", record: "0-0", elo: [1000] },
        { name: "Last Place Energy", manager: "Manager 16", record: "0-0", elo: [1000] }
      ],
      awards: [
        { title: "Most Points in a Loss", winner: "", detail: "" },
        { title: "Least Points in a Win", winner: "", detail: "" },
        { title: "Narrowest Win", winner: "", detail: "" },
        { title: "Biggest Underdog Win", winner: "", detail: "" }
      ],
      logoDataUrl: ""
    };

    let state = structuredCloneSafe(defaultState);

    function structuredCloneSafe(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function fullWeekLabel(label) {
      const match = String(label || "").match(/^W(\d+)$/i);
      if (match) return `Week ${match[1]}`;
      return label || "Week 0";
    }

    function cleanState(input) {
      const weeksRaw = Array.isArray(input?.weeks) && input.weeks.length ? input.weeks.map(String) : structuredCloneSafe(defaultState.weeks);
      const weeks = weeksRaw.map(fullWeekLabel);
      const teams = Array.isArray(input?.teams) ? input.teams.map((team, index) => ({
        name: String(team?.name || `Team ${index + 1}`),
        manager: String(team?.manager || ""),
        record: String(team?.record || ""),
        elo: weeks.map((_, weekIndex) => {
          const value = Number(team?.elo?.[weekIndex]);
          return Number.isFinite(value) ? value : null;
        })
      })) : structuredCloneSafe(defaultState.teams);

      const defaultAwards = structuredCloneSafe(defaultState.awards);
      const sourceAwards = Array.isArray(input?.awards) && input.awards.length ? input.awards : defaultAwards;
      const awards = defaultAwards.map((defaultAward, index) => {
        const award = sourceAwards[index] || defaultAward;
        return {
          title: String(award?.title || defaultAward.title),
          winner: String(award?.winner || ""),
          detail: String(award?.detail || "")
        };
      });

      return {
        currentWeek: Math.max(0, Math.min(Number(input?.currentWeek || 0), weeks.length - 1)),
        weeks,
        teams,
        awards,
        logoDataUrl: String(input?.logoDataUrl || "")
      };
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          state = cleanState(JSON.parse(saved));
          return;
        }
      } catch (error) {
        console.warn("Could not load saved rankings.", error);
        state = cleanState(defaultState);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(cleanState(state)));
      } catch (error) {
        console.warn("Could not save rankings.", error);
      }
    }

    function renderWeekSelect() {
      const select = document.getElementById("weekSelect");
      select.innerHTML = "";
      state.weeks.forEach((week, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = fullWeekLabel(week);
        if (index === state.currentWeek) option.selected = true;
        select.appendChild(option);
      });
      select.onchange = () => {
        state.currentWeek = Number(select.value);
        saveState();
        renderRankings();
      };
    }

    function renderLogo() {
      const logo = document.getElementById("leagueLogo");
      if (!logo) return;

      if (state.logoDataUrl) {
        logo.src = state.logoDataUrl;
        logo.classList.add("has-logo");
      } else {
        logo.removeAttribute("src");
        logo.classList.remove("has-logo");
      }
    }

    function importLogo(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = e => {
        state.logoDataUrl = String(e.target.result || "");
        saveState();
        renderLogo();
      };
      reader.readAsDataURL(file);
      event.target.value = "";
    }

    function removeLogo() {
      state.logoDataUrl = "";
      saveState();
      renderLogo();
    }

    function renderAwardsEditor() {
      const editor = document.getElementById("awardsEditor");
      if (!editor) return;
      const awards = Array.isArray(state.awards) ? state.awards : structuredCloneSafe(defaultState.awards);
      editor.innerHTML = `
        <div class="awards-grid">
          ${awards.map((award, index) => `
            <div class="award-input-card">
              <label>Award ${index + 1}</label>
              <input type="text" value="${escapeAttribute(award.title)}" data-award="${index}" data-award-field="title" placeholder="Award title" />
              <input type="text" value="${escapeAttribute(award.winner)}" data-award="${index}" data-award-field="winner" placeholder="Winner / team" />
              <input type="text" value="${escapeAttribute(award.detail)}" data-award="${index}" data-award-field="detail" placeholder="Details" />
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderInputTable() {
      const table = document.getElementById("inputTable");
      const weekHeaders = state.weeks.map(week => `<th>${escapeHtml(fullWeekLabel(week))}</th>`).join("");
      table.innerHTML = `
        <thead>
          <tr>
            <th>Team</th>
            <th>Manager</th>
            <th>Record</th>
            ${weekHeaders}
            <th class="no-print">Remove</th>
          </tr>
        </thead>
        <tbody>
          ${state.teams.map((team, rowIndex) => `
            <tr>
              <td><input class="team-name" type="text" value="${escapeAttribute(team.name)}" data-row="${rowIndex}" data-field="name" /></td>
              <td><input class="manager" type="text" value="${escapeAttribute(team.manager || "")}" data-row="${rowIndex}" data-field="manager" /></td>
              <td><input class="record" type="text" value="${escapeAttribute(team.record || "")}" data-row="${rowIndex}" data-field="record" /></td>
              ${state.weeks.map((_, weekIndex) => `<td><input type="number" value="${Number.isFinite(Number(team.elo?.[weekIndex])) ? team.elo[weekIndex] : ""}" data-row="${rowIndex}" data-week="${weekIndex}" /></td>`).join("")}
              <td class="no-print"><button type="button" class="secondary" onclick="removeTeam(${rowIndex})">Remove</button></td>
            </tr>
          `).join("")}
        </tbody>
      `;
    }

    function updateFromTable() {
      updateFromTableSilently();
      state.currentWeek = Number(document.getElementById("weekSelect").value);
      saveState();
      renderAll();
    }

    function updateFromTableSilently() {
      const table = document.getElementById("inputTable");
      if (!table || !table.querySelector("input")) return;
      const inputs = document.querySelectorAll("#inputTable input");
      inputs.forEach(input => {
        const row = Number(input.dataset.row);
        if (!state.teams[row]) return;
        if (input.dataset.field) {
          state.teams[row][input.dataset.field] = input.value.trim();
        }
        if (input.dataset.week !== undefined) {
          const week = Number(input.dataset.week);
          const value = input.value === "" ? null : Number(input.value);
          state.teams[row].elo[week] = Number.isFinite(value) ? value : null;
        }
      });

      const awardInputs = document.querySelectorAll("#awardsEditor input");
      awardInputs.forEach(input => {
        const index = Number(input.dataset.award);
        const field = input.dataset.awardField;
        if (!state.awards[index] || !field) return;
        state.awards[index][field] = input.value.trim();
      });
    }

    function addTeam() {
      updateFromTableSilently();
      state.teams.push({
        name: "New Team",
        manager: "",
        record: "0-0",
        elo: state.weeks.map((_, index) => index === 0 ? 1000 : null)
      });
      saveState();
      renderAll();
    }

    function removeTeam(index) {
      updateFromTableSilently();
      state.teams.splice(index, 1);
      saveState();
      renderAll();
    }

    function addWeek() {
      updateFromTableSilently();
      const nextNumber = state.weeks.length;
      state.weeks.push(`Week ${nextNumber}`);
      state.teams.forEach(team => team.elo.push(null));
      state.currentWeek = state.weeks.length - 1;
      saveState();
      renderAll();
    }

    function getValueForWeek(team, weekIndex) {
      const exact = Number(team.elo?.[weekIndex]);
      if (Number.isFinite(exact)) return exact;
      for (let i = weekIndex - 1; i >= 0; i--) {
        const previous = Number(team.elo?.[i]);
        if (Number.isFinite(previous)) return previous;
      }
      return 0;
    }

    function buildRankData(weekIndex) {
      const current = state.teams.map((team, index) => ({
        ...team,
        originalIndex: index,
        currentElo: getValueForWeek(team, weekIndex),
        previousElo: weekIndex > 0 ? getValueForWeek(team, weekIndex - 1) : getValueForWeek(team, weekIndex)
      })).sort((a, b) => b.currentElo - a.currentElo || a.name.localeCompare(b.name));

      const previous = state.teams.map((team, index) => ({
        originalIndex: index,
        value: weekIndex > 0 ? getValueForWeek(team, weekIndex - 1) : getValueForWeek(team, weekIndex)
      })).sort((a, b) => b.value - a.value || a.originalIndex - b.originalIndex);

      const prevRanks = new Map();
      previous.forEach((team, index) => prevRanks.set(team.originalIndex, index + 1));

      return current.map((team, index) => {
        const rank = index + 1;
        const prevRank = prevRanks.get(team.originalIndex) || rank;
        const rankMovement = prevRank - rank;
        const eloChange = team.currentElo - team.previousElo;
        return { ...team, rank, prevRank, rankMovement, eloChange };
      });
    }

    function movementText(rankMovement) {
      if (rankMovement > 0) return `▲ ${rankMovement}`;
      if (rankMovement < 0) return `▼ ${Math.abs(rankMovement)}`;
      return "—";
    }

    function movementClass(rankMovement) {
      if (rankMovement > 0) return "up";
      if (rankMovement < 0) return "down";
      return "same";
    }

    function formatChange(value) {
      if (value > 0) return `+${Math.round(value)}`;
      return `${Math.round(value)}`;
    }

    function orderForTwoColumnDisplay(data) {
      const left = data.slice(0, 8);
      const right = data.slice(8, 16);
      const ordered = [];
      const maxRows = Math.max(left.length, right.length);

      for (let i = 0; i < maxRows; i++) {
        if (left[i]) ordered.push(left[i]);
        if (right[i]) ordered.push(right[i]);
      }

      return ordered;
    }

    function renderRankings() {
      const data = buildRankData(state.currentWeek).slice(0, 16);
      const displayData = orderForTwoColumnDisplay(data);
      const weekLabel = fullWeekLabel(state.weeks[state.currentWeek] || "Week 0");
      document.getElementById("heroWeek").textContent = weekLabel;

      renderSummary();

      const rankings = document.getElementById("rankings");
      rankings.innerHTML = displayData.map(team => `
        <article class="rank-card ${team.rank === 1 ? "top" : ""}">
          <div class="rank-num">${team.rank}</div>
          <div class="team-block">
            <h3 title="${escapeAttribute(team.name || "Unnamed Team")}">${escapeHtml(team.name || "Unnamed Team")}</h3>
            <div class="team-meta">
              <span class="pill" title="${escapeAttribute(team.manager || "No manager")}">${escapeHtml(team.manager || "No manager")}</span>
              <span class="pill">${escapeHtml(team.record || "-")}</span>
              <span class="pill">ELO ${formatChange(team.eloChange)}</span>
            </div>
          </div>
          <div class="metric">
            <span>ELO</span>
            <strong>${Math.round(team.currentElo)}</strong>
          </div>
          <div class="movement ${movementClass(team.rankMovement)}">${movementText(team.rankMovement)}</div>
        </article>
      `).join("");
    }

    function renderSummary() {
      const strip = document.getElementById("summaryStrip");
      const awards = Array.isArray(state.awards) ? state.awards : structuredCloneSafe(defaultState.awards);

      strip.innerHTML = awards.slice(0, 4).map(award => `
        <div class="summary-card">
          <span>${escapeHtml(award.title || "Award")}</span>
          <strong>${escapeHtml(award.winner || "—")}</strong>
          <small>${escapeHtml(award.detail || "Enter details above")}</small>
        </div>
      `).join("");
    }

    function toggleScreenshotMode() {
      updateFromTable();
      document.body.classList.toggle("screenshot-mode");
      document.getElementById("captureArea").scrollIntoView({ block: "start", behavior: "smooth" });
    }

    function downloadData() {
      updateFromTableSilently();
      const clean = cleanState(state);
      const blob = new Blob([JSON.stringify(clean, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "nicehl-power-rankings-data.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const imported = JSON.parse(e.target.result);
          if (!Array.isArray(imported.weeks) || !Array.isArray(imported.teams)) throw new Error("Invalid data file");
          state = cleanState(imported);
          saveState();
          renderAll();
        } catch (error) {
          alert("That file does not match the fantasy power rankings format.");
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    }

    function resetSample() {
      localStorage.removeItem(STORAGE_KEY);
      state = structuredCloneSafe(defaultState);
      saveState();
      renderAll();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g, "&#096;");
    }

    function renderAll() {
      state = cleanState(state);
      renderWeekSelect();
      renderInputTable();
      renderAwardsEditor();
      renderLogo();
      renderRankings();
    }

    loadState();
    renderAll();
  </script>
</body>
</html>
