    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Aptos, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(91, 15, 26, 0.72), transparent 34%),
        radial-gradient(circle at bottom right, rgba(192, 192, 192, 0.26), transparent 32%),
        var(--black);
      color: var(--white);
      line-height: 1.25;
    }

    .app {
      width: min(1240px, calc(100% - 28px));
      margin: 18px auto 34px;
    }

    .editor {
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(5, 5, 5, 0.94);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .editor-header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(135deg, var(--burgundy), var(--black));
    }

    .hint {
      color: var(--silver-light);
      font-size: 12px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
    }

    button, select, input { font: inherit; }

    button, .file-label {
      border: 1px solid var(--silver);
      color: var(--white);
      background: var(--burgundy);
      font-weight: 800;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
    }

    button.secondary, .file-label.secondary {
      color: var(--white);
      background: var(--black-soft);
      border-color: var(--silver);
    }

    button.danger {
      background: var(--black);
      color: var(--silver-light);
      border-color: var(--silver);
    }

    select, input[type="text"], input[type="number"] {
      color: var(--white);
      background: var(--black-soft);
      border: 1px solid var(--silver);
      border-radius: 9px;
      padding: 8px 9px;
      outline: none;
    }

    select:focus, input:focus {
      border-color: var(--white);
      box-shadow: 0 0 0 2px rgba(192, 192, 192, 0.24);
    }

    input[type="number"] { width: 82px; }
    input.team-name { min-width: 185px; }
    input.record { width: 76px; }

    .fantrax-status {
      max-width: 250px;
      min-height: 1em;
    }

    .fantrax-status.success { color: #79e49b; }
    .fantrax-status.error { color: #ff8b8b; }

    .data-wrap {
      padding: 12px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th {
      text-align: left;
      color: var(--white);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 9px 8px;
      border-bottom: 1px solid var(--line);
      background: var(--burgundy-dark);
      position: sticky;
      top: 0;
      z-index: 1;
    }

    td {
      padding: 7px 8px;
      border-bottom: 1px solid rgba(192, 192, 192, 0.2);
      vertical-align: middle;
    }

    .hidden { display: none !important; }

    .awards-editor {
      padding: 0 12px 12px;
    }

    .awards-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .award-input-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 9px;
      background: rgba(21, 21, 21, 0.92);
    }

    .award-input-card label {
      display: block;
      margin-bottom: 4px;
      color: var(--silver-light);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.09em;
    }

    .award-input-card input {
      width: 100%;
      margin-bottom: 6px;
    }

    .board-shell {
      border: 2px solid var(--silver);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      background: var(--black);
    }

    .board {
      width: 100%;
      min-height: 790px;
      padding: 18px;
      background:
        linear-gradient(135deg, rgba(91, 15, 26, 0.98), rgba(5, 5, 5, 0.98) 48%, rgba(21, 21, 21, 0.98)),
        repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 13px);
      color: var(--white);
    }

    .board-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 4px 6px 10px;
      border-bottom: 2px solid var(--silver);
    }

    .board-top-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
    }

    .title-lockup {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .league-logo {
      width: 104px;
      height: 104px;
      object-fit: contain;
      border: none;
      background: transparent;
      padding: 0;
      flex: 0 0 auto;
      display: none;
    }

    .league-logo.has-logo {
      display: block;
    }

    .title-text {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 6vw, 72px);
      line-height: 0.88;
      letter-spacing: -0.065em;
      text-transform: uppercase;
    }

    .week-badge {
      min-width: 172px;
      padding: 11px 14px;
      border-radius: 17px;
      text-align: center;
      color: var(--black);
      background: linear-gradient(135deg, var(--white), var(--silver));
      border: 2px solid var(--white);
    }

    .week-badge span {
      display: block;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.13em;
      color: var(--black);
    }

    .week-badge strong {
      display: block;
      margin-top: 3px;
      font-size: 31px;
      line-height: 1;
      color: var(--burgundy);
      letter-spacing: -0.05em;
    }

    .summary-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
      margin: 12px 6px;
    }

    .summary-card {
      min-height: 58px;
      border-radius: 14px;
      padding: 9px 11px;
      background: var(--white);
      border: 1px solid var(--silver);
      color: var(--black);
      overflow: hidden;
    }

    .summary-card span {
      display: block;
      font-size: 9px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      color: var(--burgundy);
    }

    .summary-card strong {
      display: block;
      margin-top: 3px;
      font-size: 16px;
      line-height: 1.04;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .summary-card small {
      display: block;
      margin-top: 2px;
      font-size: 10px;
      color: var(--black-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    /* Permanent NiceHL identity on every primary display card. */
    .week-badge,
    .summary-card,
    .rank-card,
    .analysis-card {
      position: relative;
      isolation: isolate;
    }

    .week-badge::after,
    .summary-card::after,
    .rank-card::after,
    .analysis-card::after {
      content: "";
      position: absolute;
      z-index: 0;
      pointer-events: none;
      background-image: var(--league-logo-image);
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
    }

    .week-badge::after {
      width: 58px;
      height: 58px;
      right: 4px;
      bottom: 2px;
      opacity: 0.09;
    }

    .summary-card::after {
      width: 54px;
      height: 54px;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.09;
    }

    .rank-card::after {
      width: 62px;
      height: 62px;
      right: 145px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.085;
    }

    .analysis-card::after {
      width: 116px;
      height: 116px;
      right: 13px;
      top: 7px;
      opacity: 0.075;
    }

    .week-badge > *,
    .summary-card > *,
    .rank-card > *,
    .analysis-card > * {
      position: relative;
      z-index: 1;
    }

    .rankings-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px 9px;
      padding: 0 6px 6px;
    }

    .analysis-stack {
      display: grid;
      gap: 12px;
      margin: 14px 6px 4px;
    }

    .analysis-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px;
      background: rgba(5, 5, 5, 0.72);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .analysis-card-header {
      display: flex;
      align-items: center;
      margin-bottom: 9px;
      padding: 0 2px;
    }

    .analysis-card-header h2 {
      margin: 1px 0 2px;
      font-size: 23px;
      line-height: 1;
      letter-spacing: -0.035em;
      text-transform: uppercase;
    }

    .analysis-card-header p {
      margin: 0;
      color: var(--silver-light);
      font-size: 11px;
    }

    .analysis-eyebrow {
      display: block;
      color: var(--silver);
      font-size: 9px;
      font-weight: 950;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .analysis-chip {
      flex: 0 0 auto;
      border: 1px solid var(--silver);
      border-radius: 999px;
      padding: 5px 8px;
      color: var(--black);
      background: var(--silver-light);
      font-size: 9px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .analysis-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px 8px;
    }

    .matchup-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px 9px;
    }

    .matchup-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 34px minmax(0, 1fr);
      gap: 7px;
      align-items: stretch;
      min-height: 64px;
      padding: 7px;
      border-radius: 13px;
      border: 1px solid rgba(192, 192, 192, 0.48);
      background: linear-gradient(135deg, var(--white), var(--silver-light));
      color: var(--black);
      box-shadow: inset 4px 0 0 var(--burgundy);
    }

    .matchup-side {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto auto;
      gap: 2px 7px;
      align-content: center;
      padding: 2px 3px;
    }

    .matchup-side-right {
      text-align: right;
    }

    .matchup-team {
      min-width: 0;
      font-size: 13px;
      font-weight: 950;
      line-height: 1.04;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .matchup-elo {
      font-size: 9px;
      font-weight: 850;
      color: var(--burgundy);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .matchup-probability {
      grid-row: 1 / 3;
      align-self: center;
      font-size: 20px;
      font-weight: 950;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .matchup-vs {
      display: grid;
      place-items: center;
      color: var(--white);
      background: linear-gradient(135deg, var(--burgundy), var(--black));
      border-radius: 10px;
      font-size: 10px;
      font-weight: 950;
      letter-spacing: 0.08em;
    }

    .analysis-row {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) auto;
      gap: 7px;
      align-items: center;
      min-height: 48px;
      padding: 6px 8px;
      border-radius: 12px;
      border: 1px solid rgba(192, 192, 192, 0.48);
      background: linear-gradient(135deg, var(--white), var(--silver-light));
      color: var(--black);
      overflow: hidden;
      box-shadow: inset 4px 0 0 var(--burgundy);
    }

    .analysis-row.playoff-position {
      box-shadow: inset 4px 0 0 var(--burgundy), 0 0 0 1px rgba(122, 24, 39, 0.28);
    }

    .analysis-position {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: var(--white);
      background: linear-gradient(135deg, var(--burgundy), var(--black));
      font-size: 13px;
      font-weight: 950;
    }

    .analysis-team {
      min-width: 0;
    }

    .analysis-team strong {
      display: block;
      overflow: hidden;
      color: var(--black);
      font-size: 13px;
      line-height: 1.05;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .analysis-team small {
      display: block;
      margin-top: 3px;
      overflow: hidden;
      color: #333;
      font-size: 9px;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .analysis-value {
      min-width: 86px;
      padding-left: 7px;
      border-left: 1px solid var(--silver);
      text-align: right;
    }

    .analysis-value span {
      display: block;
      color: var(--burgundy);
      font-size: 8px;
      font-weight: 950;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .analysis-value strong {
      display: block;
      margin-top: 1px;
      color: var(--black);
      font-size: 18px;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .analysis-empty {
      grid-column: 1 / -1;
      padding: 18px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      color: var(--silver-light);
      background: rgba(21, 21, 21, 0.8);
      text-align: center;
      font-size: 12px;
    }

    .rank-card {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 82px 70px;
      gap: 7px;
      align-items: center;
      min-height: 61px;
      padding: 8px;
      border-radius: 15px;
      background: linear-gradient(135deg, var(--white), var(--silver-light));
      border: 1px solid var(--silver);
      color: var(--black);
      overflow: hidden;
      box-shadow: inset 5px 0 0 var(--burgundy);
    }

    .rank-card.top {
      background: linear-gradient(135deg, var(--silver-light), var(--white));
      border: 2px solid var(--white);
      box-shadow: inset 7px 0 0 var(--burgundy), 0 0 0 1px var(--silver);
    }

    .rank-num {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: var(--white);
      background: linear-gradient(135deg, var(--burgundy), var(--black));
      font-size: 20px;
      font-weight: 950;
      line-height: 1;
    }

    .team-block { min-width: 0; }

    .team-block h3 {
      margin: 0;
      font-size: 17px;
      line-height: 1.02;
      letter-spacing: -0.035em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .team-meta {
      display: flex;
      gap: 5px;
      margin-top: 4px;
      min-width: 0;
      align-items: center;
      color: var(--black);
      font-size: 10px;
      font-weight: 850;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      border-radius: 999px;
      padding: 2px 6px;
      background: var(--silver-light);
      border: 1px solid var(--silver);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric {
      text-align: right;
      border-left: 1px solid var(--silver);
      padding-left: 7px;
    }

    .metric span {
      display: block;
      font-size: 9px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--burgundy);
    }

    .metric strong {
      display: block;
      font-size: 23px;
      line-height: 1;
      letter-spacing: -0.045em;
      margin-top: 2px;
    }

    .movement {
      text-align: center;
      padding: 7px 5px;
      border-radius: 12px;
      border: 1px solid var(--silver);
      background: var(--silver-light);
      color: var(--black);
      font-size: 12px;
      font-weight: 950;
      line-height: 1.05;
      min-height: 39px;
      display: grid;
      place-items: center;
    }

    .movement.up {
      background: var(--burgundy);
      color: var(--white);
      border-color: var(--burgundy-dark);
    }

    .movement.down {
      background: var(--black);
      color: var(--silver-light);
      border-color: var(--black);
    }

    .movement.same {
      background: var(--silver-light);
      color: var(--black);
    }

    .footer-line {
      display: none;
    }

    .screenshot-mode .editor { display: none; }
    .screenshot-mode .app { width: min(1180px, calc(100% - 10px)); margin: 5px auto; }
    .screenshot-mode .board-shell { border-radius: 18px; }
    .screenshot-mode .board { min-height: 760px; padding: 14px; }
    .screenshot-mode h1 { font-size: clamp(42px, 5.4vw, 64px); }
    .screenshot-mode .league-logo { width: 106px; height: 106px; }
    .screenshot-mode .rank-card { min-height: 58px; }

    @media (max-width: 860px) {
      .editor-header, .board-top, .summary-strip, .rankings-grid, .awards-grid, .analysis-list, .matchup-list { grid-template-columns: 1fr; }
      .controls { justify-content: flex-start; }
      .title-lockup { align-items: flex-start; }
      .board-top-right { justify-content: space-between; }
      .league-logo { width: 82px; height: 82px; }
      .analysis-chip { align-self: flex-start; }
      .rank-card { grid-template-columns: 44px 1fr 74px; }
      .rank-card::after { right: 82px; }
      .movement { grid-column: 1 / -1; }
      h1 { font-size: 44px; }
    }

    @media print {
      @page { size: letter landscape; margin: 0.2in; }
      body {
        background: white !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .editor, .no-print { display: none !important; }
      .app { width: 100%; margin: 0; }
      .board-shell { border-radius: 0; box-shadow: none; }
      .board { min-height: auto; padding: 12px; }
      h1 { font-size: 52px; }
      .summary-strip { margin: 9px 6px; }
      .rank-card { min-height: 56px; padding: 7px; }
      .team-block h3 { font-size: 15px; }
      .metric strong { font-size: 20px; }
      .analysis-stack { gap: 8px; margin-top: 9px; }
      .analysis-card { padding: 9px; }
      .analysis-row { min-height: 43px; }
    }
  </style>
</head>
<body>

    <section class="editor">

    const SEASON_MANIFEST_URL = "./data/seasons.json";

    const FALLBACK_SEASON_MANIFEST = {
      defaultSeason: "2026-27",
      seasons: [
        { id: "2026-27", label: "2026–27", file: "nicehl-2026-27-regular-season.json", complete: false },
        { id: "2025-26", label: "2025–26", file: "nicehl-2025-26-regular-season.json", complete: true },
        { id: "2024-25", label: "2024–25", file: "nicehl-2024-25-regular-season.json", complete: true },
        { id: "2023-24", label: "2023–24", file: "nicehl-2023-24-regular-season.json", complete: true },
        { id: "2022-23", label: "2022–23", file: "nicehl-2022-23-regular-season.json", complete: true },
        { id: "2021-22", label: "2021–22", file: "nicehl-2021-22-regular-season.json", complete: true },
        { id: "2020-21", label: "2020–21", file: "nicehl-2020-21-regular-season.json", complete: true },
        { id: "2019-20", label: "2019–20", file: "nicehl-2019-20-regular-season.json", complete: true }
      ]
    };

    const DEFAULT_AWARDS = [
      { title: "Most Points in a Loss", winner: "", detail: "" },
      { title: "Least Points in a Win", winner: "", detail: "" },
      { title: "Narrowest Win", winner: "", detail: "" },
      { title: "Biggest Underdog Win", winner: "", detail: "" }
    ];

    const NICEHL_TEAMS = [
      "Alberta Cobra Chickens",
      "Bowness Ice Beavers",
      "Cantuar Slough Sharks",
      "Driftless Hockey Club",
      "Les Rois de Lyon",
      "Maplewood HC",
      "Mt. Pearl Vikings",
      "Pennant Pumpjacks",
      "Potomac Poutine",
      "Rockaway Brattwursts",
      "Rotterdam Red Foxes",
      "Scotty",
      "Southside Hellbats",
      "Steel Valley Fishercats",
      "Synth City Sphynx",
      "Woodland Whistle Pigs"
    ];

    const defaultState = {
      currentWeek: 0,
      weeks: ["Week 0"],
      teams: NICEHL_TEAMS.map(name => ({
        name,
        record: "0-0",
        recordHistory: ["0-0"],
        elo: [1000]
      })),
      awards: structuredCloneSafe(DEFAULT_AWARDS),
      awardsByWeek: [structuredCloneSafe(DEFAULT_AWARDS)],
      logoDataUrl: PERMANENT_LEAGUE_LOGO,
      fantraxMeta: null
    };

    let state = structuredCloneSafe(defaultState);
    let fantraxSeasonData = null;
    let seasonManifest = structuredCloneSafe(FALLBACK_SEASON_MANIFEST);
    let selectedSeasonId = FALLBACK_SEASON_MANIFEST.defaultSeason;
    let stateLoadedFromStorage = false;

    function structuredCloneSafe(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function getSeasonConfig(seasonId = selectedSeasonId) {
      return seasonManifest.seasons.find(season => season.id === seasonId) || null;
    }

    function getSeasonStorageKey(seasonId = selectedSeasonId) {
      return `${SEASON_STORAGE_PREFIX}${seasonId}`;
    }

    function getSeasonDataUrl(season = getSeasonConfig()) {
      if (!season?.file) return "";
      if (/^(?:https?:)?\/\//i.test(season.file) || season.file.startsWith("./")) {
        return season.file;
      }
      return `./data/${season.file}`;
    }

    function getGlobalLeagueLogo() {
      return PERMANENT_LEAGUE_LOGO;
    }

    function fullWeekLabel(label) {
      const match = String(label || "").match(/^W(\d+)$/i);
      if (match) return `Week ${match[1]}`;
      return label || "Week 0";
    }

    function normalizeAwards(source) {
      const input = Array.isArray(source) ? source : [];
      return DEFAULT_AWARDS.map((defaultAward, index) => {
        const award = input[index] || defaultAward;
        return {
          title: String(award?.title || defaultAward.title),
          winner: String(award?.winner || ""),
          detail: String(award?.detail || "")
        };
      });
    }

    function cleanState(input) {
      const weeksRaw =
        Array.isArray(input?.weeks) && input.weeks.length
          ? input.weeks.map(String)
          : structuredCloneSafe(defaultState.weeks);

      const weeks = weeksRaw.map(fullWeekLabel);
      const currentWeek = Math.max(
        0,
        Math.min(Number(input?.currentWeek || 0), weeks.length - 1)
      );

      const sourceTeams =
        Array.isArray(input?.teams) && input.teams.length
          ? input.teams
          : structuredCloneSafe(defaultState.teams);

      const teams = sourceTeams.map((team, index) => {
        const legacyRecord = String(team?.record || "0-0");
        const recordHistory = weeks.map((_, weekIndex) => {
          const savedRecord = team?.recordHistory?.[weekIndex];
          if (savedRecord !== undefined && savedRecord !== null) {
            return String(savedRecord);
          }
          if (weekIndex === 0) return "0-0";
          return legacyRecord;
        });

        return {
          name: String(team?.name || `Team ${index + 1}`),
          record: String(recordHistory[currentWeek] || legacyRecord),
          recordHistory,
          elo: weeks.map((_, weekIndex) => {
            const value = Number(team?.elo?.[weekIndex]);
            return Number.isFinite(value) ? value : null;
          }),
          fantraxTeamId: String(team?.fantraxTeamId || ""),
          teamLogoUrl: String(team?.teamLogoUrl || "")
        };
      });

      let awardsByWeek;
      if (Array.isArray(input?.awardsByWeek) && input.awardsByWeek.length) {
        awardsByWeek = weeks.map((_, weekIndex) =>
          normalizeAwards(input.awardsByWeek[weekIndex])
        );
      } else {
        const legacyAwards = normalizeAwards(input?.awards);
        awardsByWeek = weeks.map((_, weekIndex) =>
          weekIndex === currentWeek
            ? structuredCloneSafe(legacyAwards)
            : structuredCloneSafe(DEFAULT_AWARDS)
        );
      }

      return {
        currentWeek,
        weeks,
        teams,
        awards: normalizeAwards(awardsByWeek[currentWeek]),
        awardsByWeek,
        logoDataUrl: PERMANENT_LEAGUE_LOGO,
        fantraxMeta:
          input?.fantraxMeta && typeof input.fantraxMeta === "object"
            ? structuredCloneSafe(input.fantraxMeta)
            : null
      };
    }

    function loadState() {
      stateLoadedFromStorage = false;
      let loadedState = null;

      try {
        const saved = localStorage.getItem(getSeasonStorageKey());
        if (saved) {
          loadedState = JSON.parse(saved);
          stateLoadedFromStorage = true;
        } else if (selectedSeasonId === FALLBACK_SEASON_MANIFEST.defaultSeason) {
          const legacySaved = localStorage.getItem(LEGACY_STORAGE_KEY);
          if (legacySaved) {
            loadedState = JSON.parse(legacySaved);
            stateLoadedFromStorage = true;
            localStorage.setItem(getSeasonStorageKey(), legacySaved);
          }
        }
      } catch (error) {
        console.warn("Could not load saved rankings.", error);
      }

      state = cleanState(loadedState || defaultState);

      state.logoDataUrl = PERMANENT_LEAGUE_LOGO;

      return stateLoadedFromStorage;
    }

    function saveState() {
      try {
        state.awards = normalizeAwards(state.awardsByWeek[state.currentWeek]);
        const cleaned = cleanState(state);
        localStorage.setItem(getSeasonStorageKey(), JSON.stringify(cleaned));
        localStorage.setItem(LEAGUE_LOGO_STORAGE_KEY, cleaned.logoDataUrl || "");
        stateLoadedFromStorage = true;
      } catch (error) {
        console.warn("Could not save rankings.", error);
      }
    }

    function getRecordForWeek(team, weekIndex) {
      const exact = team?.recordHistory?.[weekIndex];
      if (exact !== undefined && exact !== null && String(exact).trim()) {
        return String(exact);
      }

      for (let i = weekIndex - 1; i >= 0; i--) {
        const previous = team?.recordHistory?.[i];
        if (previous !== undefined && previous !== null && String(previous).trim()) {
          return String(previous);
        }
      }

      return String(team?.record || "0-0");
    }

    function getAwardsForWeek(weekIndex = state.currentWeek) {
      if (!Array.isArray(state.awardsByWeek)) state.awardsByWeek = [];
      if (!state.awardsByWeek[weekIndex]) {
        state.awardsByWeek[weekIndex] = structuredCloneSafe(DEFAULT_AWARDS);
      }
      return state.awardsByWeek[weekIndex];
    }

    function renderWeekSelect() {
      const select = document.getElementById("weekSelect");
      select.innerHTML = "";

      state.weeks.forEach((week, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = fullWeekLabel(week);
        if (index === state.currentWeek) option.selected = true;
        select.appendChild(option);
      });

      select.onchange = () => {
        updateFromTableSilently();
        state.currentWeek = Number(select.value);
        state.awards = normalizeAwards(getAwardsForWeek(state.currentWeek));
        saveState();
        renderInputTable();
        renderAwardsEditor();
        renderRankings();
      };
    }

    function renderLogo() {
      const logo = document.getElementById("leagueLogo");
      if (!logo) return;

      state.logoDataUrl = PERMANENT_LEAGUE_LOGO;
      logo.src = PERMANENT_LEAGUE_LOGO;
      logo.classList.add("has-logo");
    }

    function importLogo(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = e => {
        state.logoDataUrl = String(e.target.result || "");
        saveState();
        renderLogo();
      };
      reader.readAsDataURL(file);
      event.target.value = "";
    }

    function removeLogo() {
      state.logoDataUrl = "";
      saveState();
      renderLogo();
    }

        <div class="awards-grid">

              <input type="text" value="${escapeAttribute(award.winner)}" data-award="${index}" data-award-field="winner" placeholder="Winner / team" />
              <input type="text" value="${escapeAttribute(award.detail)}" data-award="${index}" data-award-field="detail" placeholder="Details" />
            </div>
          `).join("")}

    function renderInputTable() {

        .join("");

                <td>
                  <input
                    type="number"

    function updateFromTable() {
      updateFromTableSilently();
      state.currentWeek = Number(document.getElementById("weekSelect").value);
      state.awards = normalizeAwards(getAwardsForWeek(state.currentWeek));
      saveState();
      renderAll();
    }

    function updateFromTableSilently() {
      const table = document.getElementById("inputTable");
      if (!table || !table.querySelector("input")) return;

      const inputs = document.querySelectorAll("#inputTable input");
      inputs.forEach(input => {
        const row = Number(input.dataset.row);
        if (!state.teams[row]) return;

        if (input.dataset.field === "name") {
          state.teams[row].name = input.value.trim();
        }

        if (input.dataset.field === "record-current") {
          if (!Array.isArray(state.teams[row].recordHistory)) {
            state.teams[row].recordHistory = state.weeks.map(() => "0-0");
          }
          state.teams[row].recordHistory[state.currentWeek] =
            input.value.trim() || "0-0";
          state.teams[row].record =
            state.teams[row].recordHistory[state.currentWeek];
        }

        if (input.dataset.week !== undefined) {
          const week = Number(input.dataset.week);
          const value = input.value === "" ? null : Number(input.value);
          state.teams[row].elo[week] = Number.isFinite(value) ? value : null;
        }
      });

      const awards = getAwardsForWeek(state.currentWeek);
      const awardInputs = document.querySelectorAll("#awardsEditor input");
      awardInputs.forEach(input => {
        const index = Number(input.dataset.award);
        const field = input.dataset.awardField;
        if (!awards[index] || !field) return;
        awards[index][field] = input.value.trim();
      });
      state.awards = normalizeAwards(awards);
    }

    function addTeam() {
      updateFromTableSilently();
      state.teams.push({
        name: "New Team",
        record: "0-0",
        recordHistory: state.weeks.map(() => "0-0"),
        elo: state.weeks.map((_, index) => (index === 0 ? 1000 : null)),
        fantraxTeamId: "",
        teamLogoUrl: ""
      });
      saveState();
      renderAll();
    }

    function removeTeam(index) {
      updateFromTableSilently();
      state.teams.splice(index, 1);
      saveState();
      renderAll();
    }

    function addWeek() {
      updateFromTableSilently();
      const nextNumber = state.weeks.length;
      state.weeks.push(`Week ${nextNumber}`);

      state.teams.forEach(team => {
        team.elo.push(null);
        if (!Array.isArray(team.recordHistory)) team.recordHistory = ["0-0"];
        const previousRecord =
          team.recordHistory[team.recordHistory.length - 1] || team.record || "0-0";
        team.recordHistory.push(previousRecord);
      });

      state.awardsByWeek.push(structuredCloneSafe(DEFAULT_AWARDS));
      state.currentWeek = state.weeks.length - 1;
      saveState();
      renderAll();
    }

    function getValueForWeek(team, weekIndex) {
      const exact = Number(team.elo?.[weekIndex]);
      if (Number.isFinite(exact)) return exact;

      for (let i = weekIndex - 1; i >= 0; i--) {
        const previous = Number(team.elo?.[i]);
        if (Number.isFinite(previous)) return previous;
      }

      return 0;
    }

    function buildRankData(weekIndex) {
      const current = state.teams
        .map((team, index) => ({
          ...team,
          originalIndex: index,
          displayRecord: getRecordForWeek(team, weekIndex),
          currentElo: getValueForWeek(team, weekIndex),
          previousElo:
            weekIndex > 0
              ? getValueForWeek(team, weekIndex - 1)
              : getValueForWeek(team, weekIndex)
        }))
        .sort(
          (a, b) =>
            b.currentElo - a.currentElo || a.name.localeCompare(b.name)
        );

      const previous = state.teams
        .map((team, index) => ({
          originalIndex: index,
          value:
            weekIndex > 0
              ? getValueForWeek(team, weekIndex - 1)
              : getValueForWeek(team, weekIndex)
        }))
        .sort(
          (a, b) =>
            b.value - a.value || a.originalIndex - b.originalIndex
        );

      const prevRanks = new Map();
      previous.forEach((team, index) =>
        prevRanks.set(team.originalIndex, index + 1)
      );

      return current.map((team, index) => {
        const rank = index + 1;
        const prevRank = prevRanks.get(team.originalIndex) || rank;
        const rankMovement = prevRank - rank;
        const eloChange = team.currentElo - team.previousElo;
        return {
          ...team,
          rank,
          prevRank,
          rankMovement,
          eloChange
        };
      });
    }

    function movementText(rankMovement) {
      if (rankMovement > 0) return `▲ ${rankMovement}`;
      if (rankMovement < 0) return `▼ ${Math.abs(rankMovement)}`;
      return "—";
    }

    function movementClass(rankMovement) {
      if (rankMovement > 0) return "up";
      if (rankMovement < 0) return "down";
      return "same";
    }

    function formatChange(value) {
      const rounded = Math.round(value * 10) / 10;
      if (rounded > 0) return `+${rounded}`;
      return `${rounded}`;
    }

    function formatRating(value) {
      const rounded = Math.round(value * 10) / 10;
      return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
    }

    function orderForTwoColumnDisplay(data) {
      const splitPoint = Math.ceil(data.length / 2);
      const left = data.slice(0, splitPoint);
      const right = data.slice(splitPoint);
      const ordered = [];
      const maxRows = Math.max(left.length, right.length);

      for (let i = 0; i < maxRows; i++) {
        if (left[i]) ordered.push(left[i]);
        if (right[i]) ordered.push(right[i]);
      }

      return ordered;
    }

    function getCurrentScoringPeriod() {
      const label = String(state.weeks[state.currentWeek] || "Week 0");
      const match = label.match(/(\d+)/);
      return match ? Number(match[1]) : 0;
    }

    function getSortedSeasonWeeks() {
      if (!fantraxSeasonData?.weeks) return [];
      return fantraxSeasonData.weeks
        .slice()
        .sort((a, b) => Number(a.scoringPeriod) - Number(b.scoringPeriod));
    }

    function eloWinProbability(teamElo, opponentElo) {
      const own = Number(teamElo);
      const opponent = Number(opponentElo);
      if (!Number.isFinite(own) || !Number.isFinite(opponent)) return 0.5;
      return 1 / (1 + Math.pow(10, (opponent - own) / 400));
    }

    function formatPercent(value) {
      if (!Number.isFinite(Number(value))) return "—";
      return `${(Number(value) * 100).toFixed(1)}%`;
    }

    function formatProjectedNumber(value) {
      const rounded = Math.round(Number(value) * 10) / 10;
      return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
    }

    function formatProjectedRecord(wins, losses, ties = 0) {
      const base = `${formatProjectedNumber(wins)}–${formatProjectedNumber(losses)}`;
      return ties ? `${base}–${ties}` : base;
    }

    function formatAllPlayRecord(wins, losses) {
      return `${formatProjectedNumber(wins)}–${formatProjectedNumber(losses)}`;
    }

    function formatExpectedRecord(wins, losses) {
      return `${Number(wins).toFixed(2)}–${Number(losses).toFixed(2)}`;
    }

    function formatExpectedDifference(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return "—";
      const sign = number > 0 ? "+" : "";
      return `${sign}${number.toFixed(2)}`;
    }

    const PLAYOFF_SPOTS = 8;
    const PLAYOFF_SIMULATIONS = 20000;

    function hashString(value) {
      let hash = 2166136261;
      const text = String(value);

      for (let index = 0; index < text.length; index++) {
        hash ^= text.charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }

      return hash >>> 0;
    }

    function createSeededRandom(seed) {
      let value = seed >>> 0;

      return function random() {
        value += 0x6D2B79F5;
        let result = value;
        result = Math.imul(result ^ (result >>> 15), result | 1);
        result ^= result + Math.imul(result ^ (result >>> 7), result | 61);
        return ((result ^ (result >>> 14)) >>> 0) / 4294967296;
      };
    }

    function calculatePlayoffProbabilities(
      stats,
      remainingWeeks,
      ratings,
      currentPeriod
    ) {
      const teams = Array.from(stats.values())
        .map(team => ({
          name: team.name,
          wins: team.wins,
          losses: team.losses,
          ties: team.ties,
          elo: Number(ratings.get(team.name) || 1000)
        }))
        .sort((a, b) => a.name.localeCompare(b.name));

      const teamIndexes = new Map(
        teams.map((team, index) => [team.name, index])
      );

      const futureGames = [];

      remainingWeeks.forEach(week => {
        week.matchups.forEach(matchup => {
          const awayName = String(matchup?.away?.name || "");
          const homeName = String(matchup?.home?.name || "");
          const awayIndex = teamIndexes.get(awayName);
          const homeIndex = teamIndexes.get(homeName);

          if (awayIndex === undefined || homeIndex === undefined) return;

          futureGames.push({
            awayIndex,
            homeIndex,
            awayProbability: eloWinProbability(
              teams[awayIndex].elo,
              teams[homeIndex].elo
            )
          });
        });
      });

      const seedText = [
        currentPeriod,
        ...teams.map(team =>
          `${team.name}:${team.wins}:${team.losses}:${team.ties}:${team.elo}`
        ),
        ...futureGames.map(game =>
          `${game.awayIndex}:${game.homeIndex}:${game.awayProbability.toFixed(6)}`
        )
      ].join("|");

      const random = createSeededRandom(hashString(seedText));
      const playoffCounts = teams.map(() => 0);
      const finishTotals = teams.map(() => 0);
      const simulatedWinTotals = teams.map(() => 0);

      for (let simulation = 0; simulation < PLAYOFF_SIMULATIONS; simulation++) {
        const winValues = teams.map(team => team.wins + 0.5 * team.ties);

        futureGames.forEach(game => {
          if (random() < game.awayProbability) {
            winValues[game.awayIndex] += 1;
          } else {
            winValues[game.homeIndex] += 1;
          }
        });

        const order = teams
          .map((team, index) => index)
          .sort(
            (first, second) =>
              winValues[second] - winValues[first] ||
              teams[second].elo - teams[first].elo ||
              teams[first].name.localeCompare(teams[second].name)
          );

        order.forEach((teamIndex, finishIndex) => {
          finishTotals[teamIndex] += finishIndex + 1;
          simulatedWinTotals[teamIndex] += winValues[teamIndex];

          if (finishIndex < PLAYOFF_SPOTS) {
            playoffCounts[teamIndex]++;
          }
        });
      }

      return teams
        .map((team, index) => ({
          ...team,
          playoffProbability:
            playoffCounts[index] / PLAYOFF_SIMULATIONS,
          averageFinish:
            finishTotals[index] / PLAYOFF_SIMULATIONS,
          averageFinalWins:
            simulatedWinTotals[index] / PLAYOFF_SIMULATIONS
        }))
        .sort(
          (a, b) =>
            b.playoffProbability - a.playoffProbability ||
            a.averageFinish - b.averageFinish ||
            b.elo - a.elo ||
            a.name.localeCompare(b.name)
        );
    }

    function buildSeasonAnalysis() {
      if (!fantraxSeasonData) return null;

      const currentPeriod = getCurrentScoringPeriod();
      const seasonWeeks = getSortedSeasonWeeks();
      const completedWeeks = seasonWeeks.filter(
        week => Number(week.scoringPeriod) <= currentPeriod
      );
      const remainingWeeks = seasonWeeks.filter(
        week => Number(week.scoringPeriod) > currentPeriod
      );
      const nextWeek = remainingWeeks.length ? remainingWeeks[0] : null;

      const teamNames = fantraxSeasonData.teams.map(team => String(team.name));
      const stateTeamMap = new Map(state.teams.map(team => [team.name, team]));
      const ratings = new Map(
        teamNames.map(name => [
          name,
          getValueForWeek(stateTeamMap.get(name) || { elo: [1000] }, state.currentWeek)
        ])
      );

      const nextWeekMatchups = nextWeek
        ? nextWeek.matchups
            .map(matchup => {
              const awayName = String(matchup?.away?.name || "");
              const homeName = String(matchup?.home?.name || "");
              if (!awayName || !homeName) return null;

              const awayElo = Number(ratings.get(awayName) || 1000);
              const homeElo = Number(ratings.get(homeName) || 1000);
              const awayProbability = eloWinProbability(awayElo, homeElo);

              return {
                awayName,
                homeName,
                awayElo,
                homeElo,
                awayProbability,
                homeProbability: 1 - awayProbability
              };
            })
            .filter(Boolean)
        : [];

      const stats = new Map(
        teamNames.map(name => [
          name,
          {
            name,
            wins: 0,
            losses: 0,
            ties: 0,
            pointsFor: 0,
            pointsAgainst: 0,
            allPlayFor: 0,
            allPlayAgainst: 0,
            scheduleFor: 0,
            scheduleAgainst: 0,
            expectedRemainingWins: 0,
            remainingGames: 0,
            opponentEloTotal: 0,
            expectedRecordWins: 0,
            expectedRecordGames: 0,
            offensiveExpectedWins: 0,
            defensiveExpectedWins: 0
          }
        ])
      );

      completedWeeks.forEach(week => {
        const entries = getWeeklyScoreEntries(week);
        const scoreMap = new Map(entries.map(entry => [entry.name, entry.score]));
        const teamCount = entries.length;
        const maxRankPoints = Math.max(0, teamCount - 1);
        const weeklyRankPoints = new Map();

        entries.forEach(entry => {
          // Match the workbook's rank-points method: highest score earns 15,
          // lowest earns 0, and equal scores share the same RANK.EQ position.
          const rankPoints = entries.reduce(
            (total, other) => total + (other.score <= entry.score ? 1 : 0),
            -1
          );
          weeklyRankPoints.set(entry.name, rankPoints);

          const team = stats.get(entry.name);
          if (team) {
            team.allPlayFor += rankPoints;
            team.allPlayAgainst += maxRankPoints - rankPoints;
          }
        });

        week.matchups.forEach(matchup => {
          const awayName = String(matchup?.away?.name || "");
          const homeName = String(matchup?.home?.name || "");
          const awayScore = Number(scoreMap.get(awayName));
          const homeScore = Number(scoreMap.get(homeName));
          const awayStats = stats.get(awayName);
          const homeStats = stats.get(homeName);

          if (!awayStats || !homeStats) return;

          if (awayScore > homeScore) {
            awayStats.wins++;
            homeStats.losses++;
          } else if (homeScore > awayScore) {
            homeStats.wins++;
            awayStats.losses++;
          } else if (Number.isFinite(awayScore) && Number.isFinite(homeScore)) {
            awayStats.ties++;
            homeStats.ties++;
          }

          if (Number.isFinite(awayScore) && Number.isFinite(homeScore)) {
            awayStats.pointsFor += awayScore;
            awayStats.pointsAgainst += homeScore;
            homeStats.pointsFor += homeScore;
            homeStats.pointsAgainst += awayScore;
          }

          const awayOpponentRank = Number(weeklyRankPoints.get(homeName) || 0);
          const homeOpponentRank = Number(weeklyRankPoints.get(awayName) || 0);

          awayStats.scheduleFor += awayOpponentRank;
          awayStats.scheduleAgainst += maxRankPoints - awayOpponentRank;
          homeStats.scheduleFor += homeOpponentRank;
          homeStats.scheduleAgainst += maxRankPoints - homeOpponentRank;

          /*
           * Expected Record
           *
           * Offensive component:
           *   the team's own weekly all-play wins divided by 15.
           *
           * Defensive component:
           *   the inverse of its opponent's weekly all-play wins.
           *   Facing the week's highest scorer produces 0.00 defensive wins;
           *   facing the lowest scorer produces 1.00 defensive wins.
           *
           * Weekly expected wins are the average of those two components.
           */
          if (maxRankPoints > 0) {
            const awayOwnRank = Number(weeklyRankPoints.get(awayName) || 0);
            const homeOwnRank = Number(weeklyRankPoints.get(homeName) || 0);

            const awayOffensiveWins = awayOwnRank / maxRankPoints;
            const awayDefensiveWins =
              (maxRankPoints - homeOwnRank) / maxRankPoints;
            const homeOffensiveWins = homeOwnRank / maxRankPoints;
            const homeDefensiveWins =
              (maxRankPoints - awayOwnRank) / maxRankPoints;

            awayStats.offensiveExpectedWins += awayOffensiveWins;
            awayStats.defensiveExpectedWins += awayDefensiveWins;
            awayStats.expectedRecordWins +=
              (awayOffensiveWins + awayDefensiveWins) / 2;
            awayStats.expectedRecordGames++;

            homeStats.offensiveExpectedWins += homeOffensiveWins;
            homeStats.defensiveExpectedWins += homeDefensiveWins;
            homeStats.expectedRecordWins +=
              (homeOffensiveWins + homeDefensiveWins) / 2;
            homeStats.expectedRecordGames++;
          }
        });
      });

      remainingWeeks.forEach(week => {
        week.matchups.forEach(matchup => {
          const awayName = String(matchup?.away?.name || "");
          const homeName = String(matchup?.home?.name || "");
          const awayStats = stats.get(awayName);
          const homeStats = stats.get(homeName);
          if (!awayStats || !homeStats) return;

          const awayElo = Number(ratings.get(awayName) || 1000);
          const homeElo = Number(ratings.get(homeName) || 1000);
          const awayProbability = eloWinProbability(awayElo, homeElo);
          const homeProbability = eloWinProbability(homeElo, awayElo);

          awayStats.expectedRemainingWins += awayProbability;
          awayStats.remainingGames++;
          awayStats.opponentEloTotal += homeElo;

          homeStats.expectedRemainingWins += homeProbability;
          homeStats.remainingGames++;
          homeStats.opponentEloTotal += awayElo;
        });
      });

      /*
       * Tankathon Rankings
       *
       * 1. Select the bottom eight teams from the full standings:
       *    fewest wins, then fewest total points scored.
       * 2. Recalculate a mini table using only completed games in which
       *    both teams belong to that bottom-eight group.
       * 3. Rank the mini table by fewest mini-table wins, then fewest
       *    mini-table points scored.
       */
      const tankathonPool = Array.from(stats.values())
        .slice()
        .sort(
          (a, b) =>
            a.wins - b.wins ||
            a.pointsFor - b.pointsFor ||
            a.name.localeCompare(b.name)
        )
        .slice(0, 8);

      const tankathonNames = new Set(
        tankathonPool.map(team => team.name)
      );

      const tankathonStats = new Map(
        tankathonPool.map(team => [
          team.name,
          {
            name: team.name,
            overallWins: team.wins,
            overallLosses: team.losses,
            overallTies: team.ties,
            overallPointsFor: team.pointsFor,
            wins: 0,
            losses: 0,
            ties: 0,
            pointsFor: 0,
            pointsAgainst: 0,
            games: 0
          }
        ])
      );

      completedWeeks.forEach(week => {
        week.matchups.forEach(matchup => {
          const awayName = String(matchup?.away?.name || "");
          const homeName = String(matchup?.home?.name || "");

          if (
            !tankathonNames.has(awayName) ||
            !tankathonNames.has(homeName)
          ) {
            return;
          }

          const awayScore = Number(matchup?.away?.score);
          const homeScore = Number(matchup?.home?.score);
          if (!Number.isFinite(awayScore) || !Number.isFinite(homeScore)) {
            return;
          }

          const awayTeam = tankathonStats.get(awayName);
          const homeTeam = tankathonStats.get(homeName);
          if (!awayTeam || !homeTeam) return;

          awayTeam.games++;
          homeTeam.games++;
          awayTeam.pointsFor += awayScore;
          awayTeam.pointsAgainst += homeScore;
          homeTeam.pointsFor += homeScore;
          homeTeam.pointsAgainst += awayScore;

          if (awayScore > homeScore) {
            awayTeam.wins++;
            homeTeam.losses++;
          } else if (homeScore > awayScore) {
            homeTeam.wins++;
            awayTeam.losses++;
          } else {
            awayTeam.ties++;
            homeTeam.ties++;
          }
        });
      });

      const tankathonRankings = Array.from(tankathonStats.values())
        .sort((a, b) => {
          const aWinRate = a.games
            ? (a.wins + 0.5 * a.ties) / a.games
            : 0;
          const bWinRate = b.games
            ? (b.wins + 0.5 * b.ties) / b.games
            : 0;

          return (
            bWinRate - aWinRate ||
            b.wins - a.wins ||
            b.pointsFor - a.pointsFor ||
            a.name.localeCompare(b.name)
          );
        });

      const projections = Array.from(stats.values())
        .map(team => {
          const expectedLosses = team.remainingGames - team.expectedRemainingWins;
          const projectedWins = team.wins + team.expectedRemainingWins;
          const projectedLosses = team.losses + expectedLosses;
          const avgWinProbability = team.remainingGames
            ? team.expectedRemainingWins / team.remainingGames
            : null;

          return {
            ...team,
            elo: Number(ratings.get(team.name) || 1000),
            projectedWins,
            projectedLosses,
            avgWinProbability,
            projectionScore: projectedWins + 0.5 * team.ties
          };
        })
        .sort(
          (a, b) =>
            b.projectionScore - a.projectionScore ||
            b.elo - a.elo ||
            a.name.localeCompare(b.name)
        );

      const scheduleStrength = Array.from(stats.values())
        .map(team => {
          const scheduleGames = team.scheduleFor + team.scheduleAgainst;
          return {
            ...team,
            difficulty: scheduleGames ? team.scheduleFor / scheduleGames : null
          };
        })
        .sort(
          (a, b) =>
            Number(b.difficulty ?? -1) - Number(a.difficulty ?? -1) ||
            b.scheduleFor - a.scheduleFor ||
            a.name.localeCompare(b.name)
        );

      const expectedRecords = Array.from(stats.values())
        .map(team => {
          const expectedWins = team.expectedRecordWins;
          const expectedLosses = Math.max(
            0,
            team.expectedRecordGames - expectedWins
          );
          const actualWinValue = team.wins + 0.5 * team.ties;

          return {
            ...team,
            expectedWins,
            expectedLosses,
            actualWinValue,
            difference: actualWinValue - expectedWins
          };
        })
        .sort(
          (a, b) =>
            b.expectedWins - a.expectedWins ||
            b.actualWinValue - a.actualWinValue ||
            a.name.localeCompare(b.name)
        );

      const playoffProbabilities = calculatePlayoffProbabilities(
        stats,
        remainingWeeks,
        ratings,
        currentPeriod
      );

      const remainingSos = Array.from(stats.values())
        .map(team => ({
          ...team,
          elo: Number(ratings.get(team.name) || 1000),
          avgWinProbability: team.remainingGames
            ? team.expectedRemainingWins / team.remainingGames
            : null,
          avgOpponentElo: team.remainingGames
            ? team.opponentEloTotal / team.remainingGames
            : null
        }))
        .sort((a, b) => {
          if (a.avgWinProbability === null && b.avgWinProbability !== null) return 1;
          if (a.avgWinProbability !== null && b.avgWinProbability === null) return -1;
          return (
            Number(a.avgWinProbability ?? 1) - Number(b.avgWinProbability ?? 1) ||
            Number(b.avgOpponentElo ?? 0) - Number(a.avgOpponentElo ?? 0) ||
            a.name.localeCompare(b.name)
          );
        });

      return {
        currentPeriod,
        completedWeekCount: completedWeeks.length,
        remainingWeekCount: remainingWeeks.length,
        nextWeekPeriod: nextWeek ? Number(nextWeek.scoringPeriod) : null,
        nextWeekDateRange: nextWeek ? String(nextWeek.dateRange || "") : "",
        nextWeekMatchups,
        projections,
        playoffProbabilities,
        tankathonRankings,
        expectedRecords,
        scheduleStrength,
        remainingSos
      };
    }

    function renderAnalysisRows(items, rowBuilder) {
      return orderForTwoColumnDisplay(items)
        .map((item, displayIndex) => rowBuilder(item, displayIndex))
        .join("");
    }

    function validateSeasonManifest(manifest) {
      if (!manifest || !Array.isArray(manifest.seasons) || !manifest.seasons.length) {
        throw new Error("No seasons were found in the manifest.");
      }

      const seasons = manifest.seasons
        .map(season => ({
          id: String(season?.id || "").trim(),
          label: String(season?.label || season?.id || "").trim(),
          file: String(season?.file || "").trim(),
          complete: Boolean(season?.complete)
        }))
        .filter(season => season.id && season.file);

      if (!seasons.length) {
        throw new Error("The season manifest contains no valid entries.");
      }

      const requestedDefault = String(manifest.defaultSeason || "").trim();
      return {
        defaultSeason: seasons.some(season => season.id === requestedDefault)
          ? requestedDefault
          : seasons[0].id,
        seasons
      };
    }

    function populateSeasonSelect() {
      const select = document.getElementById("seasonSelect");
      if (!select) return;

      select.innerHTML = "";
      seasonManifest.seasons.forEach(season => {
        const option = document.createElement("option");
        option.value = season.id;
        option.textContent = season.label;
        option.selected = season.id === selectedSeasonId;
        select.appendChild(option);
      });

      select.disabled = false;
      select.onchange = () => switchSeason(select.value);
    }

    async function loadSeasonManifest() {
      try {
        const response = await fetch(SEASON_MANIFEST_URL, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        seasonManifest = validateSeasonManifest(await response.json());
      } catch (error) {
        console.warn("Could not load seasons.json; using the built-in season list.", error);
        seasonManifest = validateSeasonManifest(FALLBACK_SEASON_MANIFEST);
      }

      let savedSeason = "";
      try {
        savedSeason = String(localStorage.getItem(SELECTED_SEASON_STORAGE_KEY) || "");
      } catch (error) {
        console.warn("Could not load the selected season.", error);
      }

      selectedSeasonId = seasonManifest.seasons.some(season => season.id === savedSeason)
        ? savedSeason
        : seasonManifest.defaultSeason;

      populateSeasonSelect();
      await switchSeason(selectedSeasonId, { initial: true });
    }

    async function switchSeason(seasonId, options = {}) {
      const nextSeason = getSeasonConfig(seasonId);
      if (!nextSeason) return;

      if (!options.initial) {
        updateFromTableSilently();
        saveState();
      }

      selectedSeasonId = nextSeason.id;
      fantraxSeasonData = null;

      try {
        localStorage.setItem(SELECTED_SEASON_STORAGE_KEY, selectedSeasonId);
      } catch (error) {
        console.warn("Could not save the selected season.", error);
      }

      const select = document.getElementById("seasonSelect");
      if (select) select.value = selectedSeasonId;

      loadState();
      renderAll();
      await loadFantraxSeason(false, { autoImportIfMissing: true });
    }

    function setFantraxStatus(message, type = "") {
      const status = document.getElementById("fantraxStatus");
      if (!status) return;
      status.textContent = message;
      status.className = `hint fantrax-status ${type}`.trim();
    }

    function validateFantraxData(data) {
      if (!data || typeof data !== "object") {
        throw new Error("The Fantrax data file is empty.");
      }
      if (!Array.isArray(data.teams) || !data.teams.length) {
        throw new Error("No Fantrax teams were found.");
      }
      if (!Array.isArray(data.weeks) || !data.weeks.length) {
        throw new Error("No Fantrax scoring periods were found.");
      }
    }

    function fantraxWeekHasCompleteScores(week) {
      if (!Array.isArray(week?.matchups) || !week.matchups.length) return false;

      return week.matchups.every(matchup =>
        Number.isFinite(Number(matchup?.away?.score)) &&
        Number.isFinite(Number(matchup?.home?.score))
      );
    }

    function getImportableFantraxWeeks() {
      if (!fantraxSeasonData?.weeks) return [];

      return fantraxSeasonData.weeks
        .filter(fantraxWeekHasCompleteScores)
        .slice()
        .sort(
          (a, b) =>
            Number(a.scoringPeriod) - Number(b.scoringPeriod)
        );
    }

    function getLatestImportableFantraxPeriod() {
      const weeks = getImportableFantraxWeeks();
      if (!weeks.length) return null;

      const latest = Number(weeks[weeks.length - 1].scoringPeriod);
      return Number.isFinite(latest) ? latest : null;
    }

    function populateFantraxPeriodSelect() {
      const select = document.getElementById("fantraxPeriodSelect");
      const importButton = document.getElementById("fantraxImportButton");
      if (!select || !importButton || !fantraxSeasonData) return;

      select.innerHTML = "";

      const importableWeeks = getImportableFantraxWeeks();

      if (!importableWeeks.length) {
        select.innerHTML = "<option>No completed weeks</option>";
        select.disabled = true;
        importButton.disabled = true;
        return;
      }

      importableWeeks.forEach(week => {
        const option = document.createElement("option");
        option.value = String(week.scoringPeriod);
        option.textContent = `Week ${week.scoringPeriod} ${week.dateRange || ""}`.trim();
        select.appendChild(option);
      });

      const savedPeriod = Number(state.fantraxMeta?.importedThrough);
      const availablePeriods = importableWeeks.map(week =>
        Number(week.scoringPeriod)
      );
      const latestPeriod = availablePeriods[availablePeriods.length - 1];

      select.value = availablePeriods.includes(savedPeriod)

    async function loadFantraxSeason(showSuccess = true, options = {}) {
      const select = document.getElementById("fantraxPeriodSelect");
      const importButton = document.getElementById("fantraxImportButton");
      const seasonConfig = getSeasonConfig();
      const dataUrl = getSeasonDataUrl(seasonConfig);

      if (select) select.disabled = true;
      if (importButton) importButton.disabled = true;
      setFantraxStatus(`Loading ${seasonConfig?.label || "season"}…`);

      try {
        if (!dataUrl) throw new Error("No data file is configured for this season.");

        const response = await fetch(dataUrl, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        validateFantraxData(data);
        fantraxSeasonData = data;
        populateFantraxPeriodSelect();

        if (options.autoImportIfMissing) {
          const latestPeriod = getLatestImportableFantraxPeriod();
          const importedThrough = Number(state.fantraxMeta?.importedThrough);
          const needsInitialImport = !stateLoadedFromStorage;
          const hasNewCompletedWeek =
            Number.isFinite(latestPeriod) &&
            (!Number.isFinite(importedThrough) || latestPeriod > importedThrough);

          if (
            Number.isFinite(latestPeriod) &&
            (needsInitialImport || hasNewCompletedWeek)
          ) {
            importFantraxThroughWeek(latestPeriod, { silent: true });
          }
        }

        const leagueName = data.league?.name || "NiceHL";
        const season = data.league?.season || seasonConfig?.label || "";
        setFantraxStatus(
          showSuccess
            ? `${leagueName} ${season} loaded.`
            : `${season} ready.`,
          "success"
        );
        renderAnalysisCards();
      } catch (error) {
        console.error("Could not load Fantrax data.", error);
        fantraxSeasonData = null;
        if (select) {
          select.innerHTML = "<option>Season unavailable</option>";
          select.disabled = true;
        }
        setFantraxStatus(
          `Could not load ${seasonConfig?.file || "the season JSON file"}.`,
          "error"
        );
        const errorMarkup = '<div class="analysis-empty">Fantrax season data could not be loaded.</div>';
        [
          "nextWeekMatchups",
          "projectedStandings",
          "playoffProbability",
          "tankathonRankings",
          "expectedRecord",
          "scheduleStrength",
          "remainingSchedule"
        ].forEach(id => {
          const element = document.getElementById(id);
          if (element) element.innerHTML = errorMarkup;
        });
      }
    }

    function getWeeklyScoreEntries(week) {
      const entries = [];

      week.matchups.forEach(matchup => {
        if (matchup?.away?.name) {
          entries.push({
            name: String(matchup.away.name),
            score: Number(matchup.away.score)
          });
        }

        if (matchup?.home?.name) {
          entries.push({
            name: String(matchup.home.name),
            score: Number(matchup.home.score)
          });
        }
      });

      return entries.filter(entry => Number.isFinite(entry.score));
    }

    function calculateScoreRanks(entries) {
      const sorted = entries
        .slice()
        .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));

      const ranks = new Map();
      let index = 0;

      while (index < sorted.length) {
        let end = index;
        while (
          end + 1 < sorted.length &&
          sorted[end + 1].score === sorted[index].score
        ) {
          end++;
        }

        const averageRank = ((index + 1) + (end + 1)) / 2;
        for (let i = index; i <= end; i++) {
          ranks.set(sorted[i].name, averageRank);
        }

        index = end + 1;
      }

      return ranks;
    }

    function recordText(record) {
      if (record.ties > 0) {
        return `${record.wins}-${record.losses}-${record.ties}`;
      }
      return `${record.wins}-${record.losses}`;
    }

    function scoreDetail(team) {
      const score = Math.round(Number(team.score) * 10) / 10;
      return `${score} points`;
    }

    function buildWeekAwards(week, previousRatings) {
      const winners = [];
      const losers = [];
      const decidedMatchups = [];

      week.matchups.forEach(matchup => {
        const awayScore = Number(matchup?.away?.score);
        const homeScore = Number(matchup?.home?.score);
        if (!Number.isFinite(awayScore) || !Number.isFinite(homeScore)) return;
        if (awayScore === homeScore) return;

        const away = {
          name: String(matchup.away.name),
          score: awayScore
        };
        const home = {
          name: String(matchup.home.name),
          score: homeScore
        };

        const winner = awayScore > homeScore ? away : home;
        const loser = awayScore > homeScore ? home : away;
        const margin = Math.abs(awayScore - homeScore);

        const winnerElo = Number(previousRatings.get(winner.name) || 1000);
        const loserElo = Number(previousRatings.get(loser.name) || 1000);
        const winnerProbability = eloWinProbability(winnerElo, loserElo);

        winners.push(winner);
        losers.push(loser);
        decidedMatchups.push({
          winner,
          loser,
          margin,
          winnerElo,
          loserElo,
          winnerProbability
        });
      });

      const mostPointsInLoss = losers.length
        ? losers
            .slice()
            .sort(
              (a, b) =>
                b.score - a.score ||
                a.name.localeCompare(b.name)
            )[0]
        : null;

      const leastPointsInWin = winners.length
        ? winners
            .slice()
            .sort(
              (a, b) =>
                a.score - b.score ||
                a.name.localeCompare(b.name)
            )[0]
        : null;

      const narrowestWin = decidedMatchups.length
        ? decidedMatchups
            .slice()
            .sort(
              (a, b) =>
                a.margin - b.margin ||
                b.winner.score - a.winner.score ||
                a.winner.name.localeCompare(b.winner.name)
            )[0]
        : null;

      /*
       * Biggest Underdog Win:
       * the winner that entered the week with the lowest ELO win probability.
       * This always selects one winner, even when every winner was technically
       * favoured above 50%.
       */
      const biggestUnderdogWin = decidedMatchups.length
        ? decidedMatchups
            .slice()
            .sort(
              (a, b) =>
                a.winnerProbability - b.winnerProbability ||
                b.margin - a.margin ||
                a.winner.name.localeCompare(b.winner.name)
            )[0]
        : null;

      return [
        {
          title: "Most Points in a Loss",
          winner: mostPointsInLoss?.name || "—",
          detail: mostPointsInLoss
            ? scoreDetail(mostPointsInLoss)
            : "No losses"
        },
        {
          title: "Least Points in a Win",
          winner: leastPointsInWin?.name || "—",
          detail: leastPointsInWin
            ? scoreDetail(leastPointsInWin)
            : "No wins"
        },
        {
          title: "Narrowest Win",
          winner: narrowestWin?.winner?.name || "—",
          detail: narrowestWin
            ? `Beat ${narrowestWin.loser.name} by ${formatRating(narrowestWin.margin)}`
            : "No decided matchups"
        },
        {
          title: "Biggest Underdog Win",
          winner: biggestUnderdogWin?.winner?.name || "—",
          detail: biggestUnderdogWin
            ? `${formatPercent(biggestUnderdogWin.winnerProbability)} win probability vs ${biggestUnderdogWin.loser.name}`
            : "No decided matchups"
        }
      ];
    }

    function importFantraxThroughWeek(periodOverride = null, options = {}) {
      if (!fantraxSeasonData) {
        setFantraxStatus("Load the season first.", "error");
        return;
      }

      updateFromTableSilently();

      const selectedPeriod = Number(
        periodOverride ?? document.getElementById("fantraxPeriodSelect").value
      );

      const weeksToImport = getImportableFantraxWeeks()
        .filter(week => Number(week.scoringPeriod) <= selectedPeriod);

      if (!weeksToImport.length) {
        setFantraxStatus("No scoring periods were selected.", "error");
        return;
      }

      const teams = fantraxSeasonData.teams.map(team => ({
        name: String(team.name),
        record: "0-0",
        recordHistory: ["0-0"],
        elo: [1000],
        fantraxTeamId: String(team.fantraxTeamId || ""),
        teamLogoUrl: String(team.logoUrl || "")
      }));

      const teamMap = new Map(teams.map(team => [team.name, team]));
      const records = new Map(
        teams.map(team => [
          team.name,
          { wins: 0, losses: 0, ties: 0 }
        ])
      );

      const existingAwardsByWeek = Array.isArray(state.awardsByWeek)
        ? structuredCloneSafe(state.awardsByWeek)
        : [];

      const weeks = ["Week 0"];
      const awardsByWeek = [
        normalizeAwards(existingAwardsByWeek[0] || DEFAULT_AWARDS)
      ];

      weeksToImport.forEach(week => {
        const period = Number(week.scoringPeriod);
        weeks.push(`Week ${period}`);

        const scoreEntries = getWeeklyScoreEntries(week);
        const scoreRanks = calculateScoreRanks(scoreEntries);
        const teamCount = scoreEntries.length;

        const previousRatings = new Map(
          teams.map(team => [
            team.name,
            Number(team.elo[team.elo.length - 1] ?? 1000)
          ])
        );

        const weeklyChanges = new Map(
          teams.map(team => [team.name, 0])
        );

        scoreEntries.forEach(entry => {
          const rank = Number(scoreRanks.get(entry.name));
          const scoreRankPoints = Number.isFinite(rank)
            ? teamCount - rank
            : 0;

          weeklyChanges.set(
            entry.name,
            Number(weeklyChanges.get(entry.name) || 0) +
              scoreRankPoints
          );
        });

        week.matchups.forEach(matchup => {
          const awayName = String(matchup?.away?.name || "");
          const homeName = String(matchup?.home?.name || "");
          const awayScore = Number(matchup?.away?.score);
          const homeScore = Number(matchup?.home?.score);

          if (
            !teamMap.has(awayName) ||
            !teamMap.has(homeName) ||
            !Number.isFinite(awayScore) ||
            !Number.isFinite(homeScore)
          ) {
            return;
          }

          const awayRank = Number(scoreRanks.get(awayName));
          const homeRank = Number(scoreRanks.get(homeName));

          if (awayScore > homeScore) {
            const winPoints = teamCount + 1 - homeRank;
            const lossPoints = -awayRank;

            weeklyChanges.set(
              awayName,
              Number(weeklyChanges.get(awayName) || 0) + winPoints
            );
            weeklyChanges.set(
              homeName,
              Number(weeklyChanges.get(homeName) || 0) + lossPoints
            );

            records.get(awayName).wins++;
            records.get(homeName).losses++;
          } else if (homeScore > awayScore) {
            const winPoints = teamCount + 1 - awayRank;
            const lossPoints = -homeRank;

            weeklyChanges.set(
              homeName,
              Number(weeklyChanges.get(homeName) || 0) + winPoints
            );
            weeklyChanges.set(
              awayName,
              Number(weeklyChanges.get(awayName) || 0) + lossPoints
            );

            records.get(homeName).wins++;
            records.get(awayName).losses++;
          } else {
            records.get(awayName).ties++;
            records.get(homeName).ties++;
          }
        });

        teams.forEach(team => {
          const previous = Number(
            team.elo[team.elo.length - 1] ?? 1000
          );
          const change = Number(weeklyChanges.get(team.name) || 0);
          const updated = Math.round((previous + change) * 10) / 10;
          team.elo.push(updated);

          const record = records.get(team.name);
          const currentRecord = recordText(record);
          team.recordHistory.push(currentRecord);
          team.record = currentRecord;
        });

        awardsByWeek.push(
          buildWeekAwards(week, previousRatings)
        );
      });

      const importedWeekIndex = weeks.length - 1;

      state = cleanState({
        currentWeek: importedWeekIndex,
        weeks,
        teams,
        awardsByWeek,
        awards: awardsByWeek[importedWeekIndex],
        logoDataUrl: state.logoDataUrl,
        fantraxMeta: {
          leagueId: String(fantraxSeasonData.league?.leagueId || ""),
          leagueName: String(fantraxSeasonData.league?.name || ""),
          season: String(fantraxSeasonData.league?.season || ""),
          importedThrough: selectedPeriod,
          importedAt: new Date().toISOString(),
          formula:
            "weekly score rank points plus opponent score-rank result points",
          awardsMode: "automatic"
        }
      });

      saveState();
      renderAll();
      populateFantraxPeriodSelect();

      if (!options.silent) {
        setFantraxStatus(
          `Imported Weeks 1–${selectedPeriod}.`,
          "success"
        );
      }
    }

    function toggleScreenshotMode() {
      updateFromTable();
      document.body.classList.toggle("screenshot-mode");
      document
        .getElementById("captureArea")
        .scrollIntoView({ block: "start", behavior: "smooth" });
    }

    function downloadData() {
      updateFromTableSilently();
      const clean = cleanState(state);
      const blob = new Blob(
        [JSON.stringify(clean, null, 2)],
        { type: "application/json" }
      );
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "nicehl-power-rankings-data.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = e => {
        try {
          const imported = JSON.parse(e.target.result);
          if (
            !Array.isArray(imported.weeks) ||
            !Array.isArray(imported.teams)
          ) {
            throw new Error("Invalid data file");
          }

          state = cleanState(imported);
          saveState();
          renderAll();

          if (fantraxSeasonData) {
            populateFantraxPeriodSelect();
          }
        } catch (error) {
          alert(
            "That file does not match the fantasy power rankings format."
          );
        }
      };

      reader.readAsText(file);
      event.target.value = "";
    }

    function resetSample() {
      try {
        localStorage.removeItem(getSeasonStorageKey());
      } catch (error) {
        console.warn("Could not clear the selected season.", error);
      }

      stateLoadedFromStorage = false;
      state = cleanState({
        ...defaultState,
        logoDataUrl: getGlobalLeagueLogo() || ""
      });

      if (fantraxSeasonData?.weeks?.length) {
        const latestPeriod = Math.max(
          ...fantraxSeasonData.weeks
            .map(week => Number(week.scoringPeriod))
            .filter(Number.isFinite)
        );
        importFantraxThroughWeek(latestPeriod, { silent: true });
        setFantraxStatus(
          `${getSeasonConfig()?.label || "Season"} restored from Fantrax data.`,
          "success"
        );
      } else {
        saveState();
        renderAll();
      }
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g, "&#096;");
    }

    function renderAll() {
      state = cleanState(state);
      renderWeekSelect();
      renderInputTable();
      renderAwardsEditor();
      renderLogo();
      renderRankings();
    }

    renderAll();
    loadSeasonManifest();
  </script>
</body>
</html>
