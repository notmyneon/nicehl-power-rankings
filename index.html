<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NiceHL Power Rankings</title>
  <style>
    :root {
      --burgundy: #5b0f1a;
      --burgundy-dark: #360810;
      --burgundy-light: #7a1827;
      --silver: #c0c0c0;
      --silver-light: #eeeeee;
      --white: #ffffff;
      --black: #050505;
      --black-soft: #151515;
      --line: rgba(192, 192, 192, 0.45);
      --shadow: 0 18px 42px rgba(0, 0, 0, 0.36);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Aptos, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(91, 15, 26, 0.72), transparent 34%),
        radial-gradient(circle at bottom right, rgba(192, 192, 192, 0.26), transparent 32%),
        var(--black);
      color: var(--white);
      line-height: 1.25;
    }

    .app {
      width: min(1240px, calc(100% - 28px));
      margin: 18px auto 34px;
    }

    .editor {
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(5, 5, 5, 0.94);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .editor-header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(135deg, var(--burgundy), var(--black));
    }

    .hint {
      color: var(--silver-light);
      font-size: 12px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
    }

    button, select, input { font: inherit; }

    button, .file-label {
      border: 1px solid var(--silver);
      color: var(--white);
      background: var(--burgundy);
      font-weight: 800;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
    }

    button.secondary, .file-label.secondary {
      color: var(--white);
      background: var(--black-soft);
      border-color: var(--silver);
    }

    button.danger {
      background: var(--black);
      color: var(--silver-light);
      border-color: var(--silver);
    }

    select, input[type="text"], input[type="number"] {
      color: var(--white);
      background: var(--black-soft);
      border: 1px solid var(--silver);
      border-radius: 9px;
      padding: 8px 9px;
      outline: none;
    }

    select:focus, input:focus {
      border-color: var(--white);
      box-shadow: 0 0 0 2px rgba(192, 192, 192, 0.24);
    }

    input[type="number"] { width: 82px; }
    input.team-name { min-width: 185px; }
    input.record { width: 76px; }

    .fantrax-status {
      max-width: 250px;
      min-height: 1em;
    }

    .fantrax-status.success { color: #79e49b; }
    .fantrax-status.error { color: #ff8b8b; }

    .data-wrap {
      padding: 12px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th {
      text-align: left;
      color: var(--white);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 9px 8px;
      border-bottom: 1px solid var(--line);
      background: var(--burgundy-dark);
      position: sticky;
      top: 0;
      z-index: 1;
    }

    td {
      padding: 7px 8px;
      border-bottom: 1px solid rgba(192, 192, 192, 0.2);
      vertical-align: middle;
    }

    .hidden { display: none !important; }

    .awards-editor {
      padding: 0 12px 12px;
    }

    .awards-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .award-input-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 9px;
      background: rgba(21, 21, 21, 0.92);
    }

    .award-input-card label {
      display: block;
      margin-bottom: 4px;
      color: var(--silver-light);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.09em;
    }

    .award-input-card input {
      width: 100%;
      margin-bottom: 6px;
    }

    .board-shell {
      border: 2px solid var(--silver);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      background: var(--black);
    }

    .board {
      width: 100%;
      min-height: 790px;
      padding: 18px;
      background:
        linear-gradient(135deg, rgba(91, 15, 26, 0.98), rgba(5, 5, 5, 0.98) 48%, rgba(21, 21, 21, 0.98)),
        repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 13px);
      color: var(--white);
    }

    .board-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 4px 6px 10px;
      border-bottom: 2px solid var(--silver);
    }

    .board-top-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
    }

    .title-lockup {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .league-logo {
      width: 104px;
      height: 104px;
      object-fit: contain;
      border: none;
      background: transparent;
      padding: 0;
      flex: 0 0 auto;
      display: none;
    }

    .league-logo.has-logo {
      display: block;
    }

    .title-text {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 6vw, 72px);
      line-height: 0.88;
      letter-spacing: -0.065em;
      text-transform: uppercase;
    }

    .week-badge {
      min-width: 172px;
      padding: 11px 14px;
      border-radius: 17px;
      text-align: center;
      color: var(--black);
      background: linear-gradient(135deg, var(--white), var(--silver));
      border: 2px solid var(--white);
    }

    .week-badge span {
      display: block;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.13em;
      color: var(--black);
    }

    .week-badge strong {
      display: block;
      margin-top: 3px;
      font-size: 31px;
      line-height: 1;
      color: var(--burgundy);
      letter-spacing: -0.05em;
    }

    .summary-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
      margin: 12px 6px;
    }

    .summary-card {
      min-height: 58px;
      border-radius: 14px;
      padding: 9px 11px;
      background: var(--white);
      border: 1px solid var(--silver);
      color: var(--black);
      overflow: hidden;
    }

    .summary-card span {
      display: block;
      font-size: 9px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      color: var(--burgundy);
    }

    .summary-card strong {
      display: block;
      margin-top: 3px;
      font-size: 16px;
      line-height: 1.04;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .summary-card small {
      display: block;
      margin-top: 2px;
      font-size: 10px;
      color: var(--black-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rankings-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px 9px;
      padding: 0 6px 6px;
    }

    .analysis-stack {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin: 18px 6px 8px;
      align-items: start;
    }

    .analysis-card {
      min-width: 0;
      overflow: hidden;
      border: 2px solid rgba(192, 192, 192, 0.72);
      border-radius: 20px;
      padding: 14px;
      background:
        radial-gradient(circle at 12% 0%, rgba(119, 0, 35, 0.58) 0%, rgba(88, 0, 26, 0.28) 24%, transparent 52%),
        radial-gradient(circle at 94% 100%, rgba(92, 0, 27, 0.30) 0%, transparent 44%),
        linear-gradient(145deg, rgba(20, 7, 11, 0.98) 0%, rgba(12, 12, 14, 0.98) 58%, rgba(18, 8, 11, 0.98) 100%);
      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.07),
        inset 0 -18px 42px rgba(91, 0, 27, 0.08);
    }

    .analysis-card.analysis-card-wide {
      grid-column: 1 / -1;
    }

    .analysis-card-header {
      display: flex;
      align-items: center;
      margin: -14px -14px 12px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(192, 192, 192, 0.32);
      background:
        linear-gradient(90deg, rgba(112, 0, 33, 0.34), rgba(112, 0, 33, 0.08) 48%, transparent 78%);
    }

    .analysis-card-header h2 {
      margin: 1px 0 2px;
      font-size: 23px;
      line-height: 1;
      letter-spacing: -0.035em;
      text-transform: uppercase;
    }

    .analysis-card-header p {
      margin: 0;
      color: var(--silver-light);
      font-size: 11px;
    }

    .analysis-eyebrow {
      display: block;
      color: var(--silver);
      font-size: 9px;
      font-weight: 950;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .analysis-chip {
      flex: 0 0 auto;
      border: 1px solid var(--silver);
      border-radius: 999px;
      padding: 5px 8px;
      color: var(--black);
      background: var(--silver-light);
      font-size: 9px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .analysis-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px 8px;
    }

    .matchup-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px 9px;
    }

    .matchup-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 34px minmax(0, 1fr);
      gap: 7px;
      align-items: stretch;
      min-height: 64px;
      padding: 7px;
      border-radius: 13px;
      border: 1px solid rgba(192, 192, 192, 0.48);
      background: linear-gradient(135deg, var(--white), var(--silver-light));
      color: var(--black);
      box-shadow: inset 4px 0 0 var(--burgundy);
    }

    .matchup-side {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto auto;
      gap: 2px 7px;
      align-content: center;
      padding: 2px 3px;
    }

    .matchup-side-right {
      text-align: right;
    }

    .matchup-team {
      min-width: 0;
      font-size: 13px;
      font-weight: 950;
      line-height: 1.04;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .matchup-elo {
      font-size: 9px;
      font-weight: 850;
      color: var(--burgundy);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .matchup-probability {
      grid-row: 1 / 3;
      align-self: center;
      font-size: 20px;
      font-weight: 950;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .matchup-vs {
      display: grid;
      place-items: center;
      color: var(--white);
      background: linear-gradient(135deg, var(--burgundy), var(--black));
      border-radius: 10px;
      font-size: 10px;
      font-weight: 950;
      letter-spacing: 0.08em;
    }

    .week-preview-date {
      color: #d9d9d9;
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .04em;
      text-transform: uppercase;
      text-align: right;
    }

    .week-preview-list {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .week-preview-matchup {
      min-width: 0;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid rgba(192, 192, 192, .42);
      background:
        linear-gradient(145deg, rgba(111,0,31,.34), rgba(12,12,12,.82) 52%, rgba(0,0,0,.88));
      box-shadow: inset 4px 0 0 rgba(111,0,31,.95);
    }

    .card-copy-button {
      margin-left: auto;
      min-height: 26px;
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.24);
      background:
        linear-gradient(135deg, rgba(111,0,31,.92), rgba(16,16,16,.98));
      color: #fff;
      font: inherit;
      font-size: 9px;
      font-weight: 950;
      letter-spacing: .055em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: none;
      flex: 0 0 auto;
    }

    .card-copy-button:hover {
      border-color: rgba(255,255,255,.48);
      transform: translateY(-1px);
    }

    .card-copy-button:disabled {
      opacity: .58;
      cursor: wait;
      transform: none;
    }

    .week-preview-header {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr) 76px;
      gap: 8px;
      align-items: center;
      padding: 10px 11px 9px;
      border-bottom: 1px solid rgba(255,255,255,.10);
    }

    .week-preview-probability {
      color: #fff;
      font-size: 23px;
      font-weight: 950;
      line-height: 1;
      letter-spacing: -.045em;
    }

    .week-preview-probability-right {
      text-align: right;
    }

    .week-preview-matchup-title {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      gap: 7px;
      align-items: center;
      text-align: center;
    }

    .week-preview-team-block {
      min-width: 0;
    }

    .week-preview-team {
      min-width: 0;
      color: #fff;
      font-size: 15px;
      font-weight: 950;
      line-height: 1.08;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .week-preview-record {
      margin-top: 4px;
      color: #d6d6d6;
      font-size: 10px;
      font-weight: 850;
      white-space: nowrap;
    }

    .week-preview-vs {
      display: grid;
      place-items: center;
      min-width: 30px;
      min-height: 26px;
      padding: 0 7px;
      border-radius: 9px;
      background: rgba(255,255,255,.08);
      color: #ddd;
      font-size: 9px;
      font-weight: 950;
      letter-spacing: .08em;
    }

    .week-preview-series-row {
      padding: 9px 12px;
      border-bottom: 1px solid rgba(255,255,255,.10);
      background:
        linear-gradient(90deg, rgba(111,0,31,.25), rgba(0,0,0,.12));
      color: #f3f3f3;
      font-size: 14px;
      font-weight: 900;
      line-height: 1.25;
      text-align: center;
    }

    .week-preview-series-row.first-meeting {
      color: #cfcfcf;
      font-style: italic;
      font-weight: 700;
    }

    .week-preview-body {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .week-preview-history,
    .week-preview-watch {
      min-width: 0;
      padding: 8px 10px 10px;
    }

    .week-preview-history {
      background: rgba(0,0,0,.18);
    }

    .week-preview-watch {
      border-left: 1px solid rgba(255,255,255,.10);
      background:
        linear-gradient(145deg, rgba(111,0,31,.22), rgba(0,0,0,.26));
    }

    .week-preview-panel-title {
      min-height: 17px;
      color: #e2e2e2;
      font-size: 11px;
      font-weight: 950;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .week-preview-recent,
    .week-preview-watch-list {
      display: grid;
      grid-template-rows: repeat(3, 40px);
      gap: 6px;
      margin-top: 7px;
    }

    .week-preview-game,
    .week-preview-history-placeholder {
      min-width: 0;
      height: 40px;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.23);
      color: #f0f0f0;
      overflow: hidden;
    }

    .week-preview-game {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .week-preview-game-team {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      line-height: 1.1;
    }

    .week-preview-game-score {
      color: #fff;
      font-size: 15px;
      font-weight: 950;
      line-height: 1;
      white-space: nowrap;
      text-align: right;
    }

    .week-preview-history-placeholder {
      display: flex;
      align-items: center;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.25;
    }

    .week-preview-history-placeholder {
      color: rgba(255,255,255,.30);
      font-style: italic;
    }

    .week-preview-player {
      height: 40px;
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.23);
    }

    .week-preview-player-rank {
      width: 23px;
      height: 23px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: var(--burgundy-dark);
      color: #fff;
      font-size: 11px;
      font-weight: 950;
    }

    .week-preview-player-main {
      min-width: 0;
    }

    .week-preview-player-main strong {
      display: block;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #fff;
      font-size: 12px;
      line-height: 1.1;
    }

    .week-preview-player-main small {
      display: block;
      margin-top: 3px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #d7d7d7;
      font-size: 10px;
      line-height: 1.1;
    }

    .week-preview-player-points {
      text-align: right;
      color: #fff;
      font-size: 16px;
      font-weight: 950;
      white-space: nowrap;
    }

    .week-preview-player-points small {
      display: block;
      color: #d2d2d2;
      font-size: 9px;
      font-weight: 850;
    }

    .week-preview-player-placeholder {
      height: 40px;
      display: flex;
      align-items: center;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.07);
      background: rgba(0,0,0,.12);
      color: rgba(255,255,255,.30);
      font-size: 11px;
      font-style: italic;
    }

    .week-preview-watch-empty {
      margin-top: 6px;
      color: #cfcfcf;
      font-size: 9px;
      font-style: italic;
      line-height: 1.3;
    }

    .analysis-row {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) auto;
      gap: 7px;
      align-items: center;
      min-height: 48px;
      padding: 6px 8px;
      border-radius: 12px;
      border: 1px solid rgba(192, 192, 192, 0.48);
      background: linear-gradient(135deg, var(--white), var(--silver-light));
      color: var(--black);
      overflow: hidden;
      box-shadow: inset 4px 0 0 var(--burgundy);
    }

    .analysis-row.playoff-position {
      box-shadow: inset 4px 0 0 var(--burgundy), 0 0 0 1px rgba(122, 24, 39, 0.28);
    }

    .analysis-position {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: var(--white);
      background: linear-gradient(135deg, var(--burgundy), var(--black));
      font-size: 13px;
      font-weight: 950;
    }

    .analysis-team {
      min-width: 0;
    }

    .analysis-team strong {
      display: block;
      overflow: hidden;
      color: var(--black);
      font-size: 13px;
      line-height: 1.05;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .analysis-team small {
      display: block;
      margin-top: 3px;
      overflow: hidden;
      color: #333;
      font-size: 9px;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .analysis-value {
      min-width: 86px;
      padding-left: 7px;
      border-left: 1px solid var(--silver);
      text-align: right;
    }

    .analysis-value span {
      display: block;
      color: var(--burgundy);
      font-size: 8px;
      font-weight: 950;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .analysis-value strong {
      display: block;
      margin-top: 1px;
      color: var(--black);
      font-size: 18px;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .analysis-empty {
      grid-column: 1 / -1;
      padding: 18px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      color: var(--silver-light);
      background: rgba(21, 21, 21, 0.8);
      text-align: center;
      font-size: 12px;
    }

    .rank-card {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 82px 70px;
      gap: 7px;
      align-items: center;
      min-height: 61px;
      padding: 8px;
      border-radius: 15px;
      background: linear-gradient(135deg, var(--white), var(--silver-light));
      border: 1px solid var(--silver);
      color: var(--black);
      overflow: hidden;
      box-shadow: inset 5px 0 0 var(--burgundy);
    }

    .rank-card.top {
      background: linear-gradient(135deg, var(--silver-light), var(--white));
      border: 2px solid var(--white);
      box-shadow: inset 7px 0 0 var(--burgundy), 0 0 0 1px var(--silver);

      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;

      font-size: 20px;
      font-weight: 950;
      line-height: 1;
    }

    .team-block { min-width: 0; }

    .team-block h3 {
      margin: 0;
      font-size: 17px;
      line-height: 1.02;
      letter-spacing: -0.035em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .team-meta {
      display: flex;
      gap: 5px;
      margin-top: 4px;
      min-width: 0;
      align-items: center;
      color: var(--black);
      font-size: 10px;
      font-weight: 850;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      border-radius: 999px;
      padding: 2px 6px;
      background: var(--silver-light);
      border: 1px solid var(--silver);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric {
      text-align: right;
      border-left: 1px solid var(--silver);
      padding-left: 7px;
    }

    .metric span {
      display: block;
      font-size: 9px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--burgundy);
    }

    .metric strong {
      display: block;
      font-size: 23px;
      line-height: 1;
      letter-spacing: -0.045em;
      margin-top: 2px;
    }

    .movement {
      text-align: center;
      padding: 7px 5px;
      border-radius: 12px;
      border: 1px solid var(--silver);
      background: var(--silver-light);
      color: var(--black);
      font-size: 12px;
      font-weight: 950;
      line-height: 1.05;
      min-height: 39px;
      display: grid;
      place-items: center;
    }

    .movement.up {
      background: var(--burgundy);
      color: var(--white);
      border-color: var(--burgundy-dark);
    }

    .movement.down {
      background: var(--black);
      color: var(--silver-light);
      border-color: var(--black);
    }

    .movement.same {
      background: var(--silver-light);
      color: var(--black);
    }

    .weekly-review-card {
      grid-column: 1 / -1;
    }

    .weekly-review-card .analysis-card-header {
      align-items: center;
    }

    .weekly-review-date {
      color: var(--silver-light);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.86;
      text-align: right;
    }

    .weekly-review-story {
      margin-top: 8px;
      padding: 13px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      background:
        linear-gradient(135deg, rgba(111,0,31,.30), rgba(255,255,255,.03) 50%, rgba(0,0,0,.22)),
        rgba(0,0,0,0.2);
      color: #f7f7f7;
      font-size: 16px;
      line-height: 1.48;
    }

    .weekly-review-story p {
      margin: 0;
    }

    .weekly-review-story p + p {
      margin-top: 8px;
    }

    .weekly-review-panel {
      min-width: 0;
      padding: 9px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.13);
      background:
        linear-gradient(145deg, rgba(111,0,31,.25), rgba(0,0,0,.30));
    }

    .weekly-review-panel h3 {
      margin: 0 0 7px;
      color: #fff;
      font-size: 13px;
      font-weight: 950;
      letter-spacing: .065em;
      text-transform: uppercase;
    }

    .weekly-movers {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .weekly-mover-column {
      min-width: 0;
      display: grid;
      gap: 5px;
      align-content: start;
    }

    .weekly-mover-column-title {
      color: #d8d8d8;
      font-size: 10px;
      font-weight: 950;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 0 2px 2px;
    }

    .weekly-mover {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 7px;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.22);
    }

    .weekly-mover strong {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
    }

    .weekly-mover span {
      color: #ddd;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .weekly-mover .positive { color: #b8f5d0; }
    .weekly-mover .negative { color: #ffb8bd; }

    .weekly-player-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      margin-top: 7px;
    }

    .weekly-player-panel {
      min-width: 0;
      padding: 9px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.15);
      background:
        linear-gradient(145deg, rgba(111,0,31,.40), rgba(16,16,16,.58) 55%, rgba(0,0,0,.52));
    }

    .weekly-player-panel h3 {
      margin: 0 0 7px;
      color: #fff;
      font-size: 14px;
      font-weight: 950;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .weekly-player-list {
      display: grid;
      gap: 4px;
    }

    .weekly-player-row {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) minmax(58px, auto);
      gap: 6px;
      align-items: center;
      min-height: 46px;
      padding: 5px 7px;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,.11);
      background: rgba(0,0,0,.24);
    }

    .weekly-player-rank {
      width: 27px;
      height: 27px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--burgundy-dark);
      color: #fff;
      font-size: 12px;
      font-weight: 950;
    }

    .weekly-player-main {
      min-width: 0;
    }

    .weekly-player-main strong {
      display: block;
      color: #fff;
      font-size: 14px;
      line-height: 1.08;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .weekly-player-main small {
      display: block;
      margin-top: 3px;
      color: #dedede;
      font-size: 11px;
      line-height: 1.18;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .weekly-player-score {
      justify-self: end;
      text-align: right;
      white-space: nowrap;
      min-width: 54px;
    }

    .weekly-player-score strong {
      display: block;
      color: #fff;
      font-size: 18px;
      line-height: 1;
    }

    .weekly-player-score small {
      display: block;
      margin-top: 2px;
      color: #d0d0d0;
      font-size: 10px;
      font-weight: 900;
    }

    .weekly-player-score .positive { color: #b8f5d0; }
    .weekly-player-score .negative { color: #ffb8bd; }

    .weekly-player-empty {
      padding: 9px;
      border-radius: 9px;
      border: 1px dashed rgba(255,255,255,.17);
      color: #d3d3d3;
      font-size: 12px;
      line-height: 1.35;
    }

      margin-top: 7px;
    }

            </div>
            <div class="analysis-list" id="projectedStandings"></div>
          </section>

          <section class="analysis-card" id="playoffProbabilityCard">

          <section class="analysis-card" id="tankathonRankingsCard">

        </div>

    </section>
