    function differentTeamTieImpactSentence({
      players,
      statValue,
      statKind,
      review,
      seed
    }) {
      const entries = (players || []).map(player => ({
        player,
        teamName: weeklyPlayerOwner(player),
        matchup: weeklyMatchupForTeam(weeklyPlayerOwner(player), review)
      }));

      if (entries.length !== 2) return "";

      const [first, second] = entries;
      const value = formatRating(statValue);

      function resultPhrase(entry, compact = false) {
        const team = entry.teamName;
        const matchup = entry.matchup;

        if (!matchup) {
          return compact
            ? `${team}`
            : `for ${team}`;
        }

        if (matchup.result === "win") {
          return compact
            ? `as ${team} beat ${matchup.opponent} by ${formatRating(matchup.margin)}`
            : `in ${team}'s ${formatRating(matchup.margin)}-point win over ${matchup.opponent}`;
        }

        if (matchup.result === "loss") {
          return compact
            ? `as ${team} lost to ${matchup.opponent} by ${formatRating(matchup.margin)}`
            : `despite ${team}'s ${formatRating(matchup.margin)}-point loss to ${matchup.opponent}`;
        }

        return compact
          ? `as ${team} tied ${matchup.opponent}`
          : `as ${team} tied ${matchup.opponent}`;
      }

      if (statKind === "goals") {
        const templates = [
          `${first.player.name} scored ${value} goals ${resultPhrase(first)}, while ${second.player.name} matched him with ${value} ${resultPhrase(second, true)}.`,
          `${first.player.name} and ${second.player.name} each scored ${value} goals; ${first.player.name} did it ${resultPhrase(first)}, while ${second.player.name} matched the total ${resultPhrase(second, true)}.`,
          `${first.player.name} posted ${value} goals ${resultPhrase(first)}. ${second.player.name} equalled that mark with ${value} ${resultPhrase(second, true)}.`
        ];

        return templates[
          stableNarrativeIndex(`${seed}|different-team-goals`, templates.length)
        ];
      }

      if (statKind === "blocks") {
        const templates = [
          `${first.player.name} recorded ${value} blocked shots ${resultPhrase(first)}, while ${second.player.name} matched him with ${value} ${resultPhrase(second, true)}.`,
          `${first.player.name} and ${second.player.name} shared the blocked-shot lead at ${value}; ${first.player.name} reached the mark ${resultPhrase(first)}, while ${second.player.name} did the same ${resultPhrase(second, true)}.`,
          `${first.player.name} blocked ${value} shots ${resultPhrase(first)}. ${second.player.name} equalled the total with ${value} ${resultPhrase(second, true)}.`
        ];

        return templates[
          stableNarrativeIndex(`${seed}|different-team-blocks`, templates.length)
        ];
      }

      return "";
    }

    function weeklyReviewNarrative(review, playerReview) {
      const paragraphs = [];

      const high = review.highestScore;
      const average = review.leagueAverage;
      const blowout = review.blowout;

      const mostGoals = playerReview?.mostGoals || null;
      const mostBlocks = playerReview?.mostBlockedShots || null;
      const mostGoalsAllowed = playerReview?.mostGoalsAllowed || null;

      // 1. Fantasy-team story
      const teamStory = [];

      if (high && Number.isFinite(average)) {
        const difference = high.score - average;
        teamStory.push(
          `${high.name} paced the league with ${formatRating(high.score)} fantasy points, ${formatRating(Math.abs(difference))} ${difference >= 0 ? "above" : "below"} the ${formatRating(average)}-point league average`
        );
      } else if (high) {
        teamStory.push(
          `${high.name} paced the league with ${formatRating(high.score)} fantasy points`
        );
      }

      if (blowout) {
        teamStory.push(
          `${blowout.winner.name} posted the week's widest margin, beating ${blowout.loser.name} by ${formatRating(blowout.margin)} points`
        );
      }

      if (teamStory.length) {
        paragraphs.push(`${teamStory.join(". ")}.`);
      }

      // 2. Goal-scoring story
      if (mostGoals?.players?.length) {
        const goalCount = finitePlayerNumber(mostGoals.value);

        if (mostGoals.players.length === 1) {
          const player = mostGoals.players[0];
          const owner = weeklyPlayerOwner(player);

          paragraphs.push(
            skaterImpactSentence({
              playerName: player.name,
              teamName: owner,
              statValue: goalCount,
              statLabel: {
                singular: "goal",
                plural: "goals"
              },
              statVerb: "scored",
              statKind: "goals",
              review,
              seed: `week-${review.period}-goals`
            })
          );
        } else if (allPlayersShareFantasyTeam(mostGoals.players)) {
          const owner = weeklyPlayerOwner(mostGoals.players[0]);

          paragraphs.push(
            sameTeamTieImpactSentence({
              players: mostGoals.players,
              teamName: owner,
              statValue: goalCount,
              statLabel: {
                singular: "goal",
                plural: "goals"
              },
              statKind: "goals",
              review,
              seed: `week-${review.period}-goals`
            })
          );
        } else if (mostGoals.players.length === 2) {
          paragraphs.push(
            differentTeamTieImpactSentence({
              players: mostGoals.players,
              statValue: goalCount,
              statKind: "goals",
              review,
              seed: `week-${review.period}-goals`
            })
          );
        } else {
          const names = weeklyPlayerNameList(mostGoals.players);
          paragraphs.push(
            `${names} shared the weekly goal-scoring lead with ${formatRating(goalCount)} goals apiece.`
          );
        }
      }

      // 3. Blocked-shots story — intentionally its own line/paragraph
      if (mostBlocks?.players?.length) {
        const blockCount = finitePlayerNumber(mostBlocks.value);

        if (mostBlocks.players.length === 1) {
          const player = mostBlocks.players[0];
          const owner = weeklyPlayerOwner(player);

          paragraphs.push(
            skaterImpactSentence({
              playerName: player.name,
              teamName: owner,
              statValue: blockCount,
              statLabel: {
                singular: "blocked shot",
                plural: "blocked shots"
              },
              statVerb: "recorded",
              statKind: "blocks",
              review,
              seed: `week-${review.period}-blocks`
            })
          );
        } else if (allPlayersShareFantasyTeam(mostBlocks.players)) {
          const owner = weeklyPlayerOwner(mostBlocks.players[0]);

          paragraphs.push(
            sameTeamTieImpactSentence({
              players: mostBlocks.players,
              teamName: owner,
              statValue: blockCount,
              statLabel: {
                singular: "blocked shot",
                plural: "blocked shots"
              },
              statKind: "blocks",
              review,
              seed: `week-${review.period}-blocks`
            })
          );
        } else if (mostBlocks.players.length === 2) {
          paragraphs.push(
            differentTeamTieImpactSentence({
              players: mostBlocks.players,
              statValue: blockCount,
              statKind: "blocks",
              review,
              seed: `week-${review.period}-blocks`
            })
          );
        } else {
          const names = weeklyPlayerNameList(mostBlocks.players);
          paragraphs.push(
            `${names} shared the blocked-shot lead with ${formatRating(blockCount)} apiece.`
          );
        }
      }

      // 4. Goalie adversity: most GA + games + FPts/game
      if (mostGoalsAllowed?.players?.length) {
        const ga = finitePlayerNumber(mostGoalsAllowed.value);

        if (mostGoalsAllowed.players.length === 1) {
          const player = mostGoalsAllowed.players[0];
          const owner = weeklyPlayerOwner(player);
          const gp = weeklyPlayerGames(player);
          const fpts = weeklyPlayerFantasyPoints(player);
          const avg = gp !== null && gp > 0 && fpts !== null ? fpts / gp : null;
          paragraphs.push(
            goalieAdversitySentence({
              playerName: player.name,
              teamName: owner,
              goalsAgainst: ga,
              gamesPlayed: gp,
              averageFantasyPoints: avg,
              review,
              seed: `week-${review.period}-goalie-ga`
            })
          );
        } else {
          const tied = mostGoalsAllowed.players.map(player => {
            const gp = weeklyPlayerGames(player);
            const fpts = weeklyPlayerFantasyPoints(player);
            const avg = gp !== null && gp > 0 && fpts !== null ? fpts / gp : null;
            const details = [];
            if (gp !== null) details.push(`${formatRating(gp)} game${gp === 1 ? "" : "s"}`);
            if (avg !== null) details.push(`${formatRating(avg)} FPts/game`);
            return `${weeklyPlayerWithOwner(player)}${details.length ? ` (${details.join(", ")})` : ""}`;
          });

          paragraphs.push(
            `${weeklyLeaderNamesWithOwners(mostGoalsAllowed)} shared the unwanted lead after allowing ${formatRating(ga)} goals apiece. ${tied.join("; ")}.`
          );
        }
      }

      return paragraphs;
    }

    function matchupReviewText(matchup, review) {
      if (matchup.tied) {
        return `${matchup.awayName} and ${matchup.homeName} finished level at ${formatRating(matchup.awayScore)} points.`;
      }

      const parts = [];
      parts.push(
        `${matchup.winner.name} beat ${matchup.loser.name} ${formatRating(matchup.winner.score)}–${formatRating(matchup.loser.score)}.`
      );

      if (review.closest === matchup) {
        parts.push(`It was the week's closest game.`);
      } else if (review.blowout === matchup) {
        parts.push(`The ${formatRating(matchup.margin)}-point margin was the largest of the week.`);
      }

      if (matchup.winnerProbability < 0.5) {
        parts.push(
          `${matchup.winner.name} entered as a ${formatPercent(matchup.winnerProbability)} ELO underdog.`
        );
      } else {
        parts.push(
          `${matchup.winner.name} entered with a ${formatPercent(matchup.winnerProbability)} win probability.`
        );
      }

      if (review.highestScore?.name === matchup.winner.name) {
        parts.push(`${matchup.winner.name} also posted the league's highest score.`);
      }

      if (review.highestLoss?.name === matchup.loser.name) {
        parts.push(`${matchup.loser.name} recorded the week's highest score in a loss.`);
      }

      return parts.join(" ");
    }

    function weeklyPlayerIsGoalie(player) {
      if (String(player?.positionGroup || "").toLowerCase() === "goalie") return true;
      return /(^|[\s,\/])G($|[\s,\/])/i.test(String(player?.positions || ""));
    }

    function finitePlayerNumber(value) {
      if (value === null || value === undefined || value === "") return null;
      const number = Number(value);
      return Number.isFinite(number) ? number : null;
    }

    function weeklyPlayerFantasyPoints(player) {
      return finitePlayerNumber(player?.fantasyPoints);
    }

    function weeklyPlayerGames(player) {
      return finitePlayerNumber(
        player?.gamesPlayed ?? player?.summaryStats?.gp
      );
    }

    function normalizeWeeklyStatLabel(value) {
      return String(value ?? "")
        .toLowerCase()
        .replace(/&amp;/g, "and")
        .replace(/[^a-z0-9]+/g, "");
    }

    function weeklyPlayerStat(player, keys) {
      // First use the normalized summary fields produced by the newest exporter.
      for (const key of keys) {
        const direct = finitePlayerNumber(player?.summaryStats?.[key]);
        if (direct !== null) return direct;
      }

      // Older rich exports still preserve every Fantrax column in player.stats.
      // Search those raw labels so G / Blk / GA continue to work historically.
      const rawStats = player?.stats && typeof player.stats === "object"
        ? player.stats
        : {};

      const candidates = keys.map(normalizeWeeklyStatLabel);

      for (const [label, value] of Object.entries(rawStats)) {
        const normalized = normalizeWeeklyStatLabel(label);

        const aliases = {
          goals: ["g", "goal", "goals"],
          blockedShots: [
            "blk", "blks", "block", "blocks",
            "blockedshot", "blockedshots", "bs"
          ],
          goalsAgainst: [
            "ga", "goalagainst", "goalsagainst"
          ],
          goalieStarts: ["gs", "gamestarted", "gamesstarted"],
          wins: ["w", "win", "wins"],
          shutouts: ["sho", "shutout", "shutouts"],
          saves: ["sv", "save", "saves"],
          assists: ["a", "assist", "assists"],
          sog: ["sog", "shotongoal", "shotsongoal", "shots"],
          stp: ["stp", "specialteampoints", "specialteamspoints"],
          hitsBlocks: ["hb", "hitsblocks", "hitsandblocks"]
        };

        const expanded = new Set(candidates);
        for (const key of keys) {
          (aliases[key] || []).forEach(alias => expanded.add(alias));
        }

        if (expanded.has(normalized)) {
          const number = finitePlayerNumber(value);
          if (number !== null) return number;
        }
      }

      return null;
    }

    function weeklyPlayerStatLine(player) {
      const parts = [];
      const isGoalie = weeklyPlayerIsGoalie(player);

      if (isGoalie) {
        const starts = weeklyPlayerStat(player, ["goalieStarts"]);
        const wins = weeklyPlayerStat(player, ["wins"]);
        const ga = weeklyPlayerStat(player, ["goalsAgainst"]);
        const sho = weeklyPlayerStat(player, ["shutouts"]);

        if (starts !== null) parts.push(`${formatRating(starts)} GS`);
        if (wins !== null) parts.push(`${formatRating(wins)} W`);
        if (ga !== null) parts.push(`${formatRating(ga)} GA`);
        if (sho !== null && sho > 0) parts.push(`${formatRating(sho)} SHO`);
      } else {
        const goals = weeklyPlayerStat(player, ["goals"]);
        const assists = weeklyPlayerStat(player, ["assists"]);
        const sog = weeklyPlayerStat(player, ["sog"]);
        const stp = weeklyPlayerStat(player, ["stp"]);
        const hitsBlocks = weeklyPlayerStat(player, ["hitsBlocks"]);

        if (goals !== null) parts.push(`${formatRating(goals)} G`);
        if (assists !== null) parts.push(`${formatRating(assists)} A`);
        if (sog !== null) parts.push(`${formatRating(sog)} SOG`);
        if (stp !== null && stp > 0) parts.push(`${formatRating(stp)} STP`);
        if (hitsBlocks !== null) parts.push(`${formatRating(hitsBlocks)} H+B`);
      }

      return parts.slice(0, 4).join(" · ");
    }

    function buildWeeklyPlayerReview(period, week) {
      const players = Array.isArray(week?.players)
        ? week.players.filter(
            player => weeklyPlayerFantasyPoints(player) !== null
          )
        : [];

      if (!players.length) {
        return {
          available: false,
          topSkaters: [],
          topGoalies: [],
          underperformers: [],
          mostGoals: null,
          mostBlockedShots: null,
          mostGoaliePoints: null,
          mostGoalsAllowed: null
        };
      }

      const topSkaters = players
        .filter(player => !weeklyPlayerIsGoalie(player))
        .slice()
        .sort((a, b) =>
          weeklyPlayerFantasyPoints(b) - weeklyPlayerFantasyPoints(a) ||
          String(a.name).localeCompare(String(b.name))
        )
        .slice(0, 3);

      const topGoalies = players
        .filter(player => weeklyPlayerIsGoalie(player))
        .slice()
        .sort((a, b) =>
          weeklyPlayerFantasyPoints(b) - weeklyPlayerFantasyPoints(a) ||
          String(a.name).localeCompare(String(b.name))
        )
        .slice(0, 3);

      const mostGoals = weeklyLeaderByValue(
        players,
        player => weeklyPlayerStat(player, ["goals"]),
        player => !weeklyPlayerIsGoalie(player)
      );

      const mostBlockedShots = weeklyLeaderByValue(
        players,
        player => weeklyPlayerStat(player, ["blockedShots"]),
        player => !weeklyPlayerIsGoalie(player)
      );

      const mostGoaliePoints = weeklyLeaderByValue(
        players,
        player => weeklyPlayerFantasyPoints(player),
        player => weeklyPlayerIsGoalie(player)
      );

      const mostGoalsAllowed = weeklyLeaderByValue(
        players,
        player => weeklyPlayerStat(player, ["goalsAgainst"]),
        player => weeklyPlayerIsGoalie(player)
      );

      const performance = players
        .map(player => {
          const actual = weeklyPlayerFantasyPoints(player);
          const expected = finitePlayerNumber(
            player?.baseline?.expectedFantasyPoints
          );
          const exportedDelta = finitePlayerNumber(
            player?.baseline?.performanceDelta
          );

          if (actual === null || expected === null || expected < 0) {
            return null;
          }

          const delta =
            exportedDelta !== null
              ? exportedDelta
              : actual - expected;

          return {
            ...player,
            actual,
            expected,
            delta,
            performanceMethod:
              player?.baseline?.method || "exported-baseline"
          };
        })
        .filter(Boolean);

      const underperformers = performance
        .filter(player => player.delta < 0)
        .slice()
        .sort((a, b) => a.delta - b.delta || a.actual - b.actual)
        .slice(0, 3);

      return {
        available: true,
        topSkaters,
        topGoalies,
        underperformers,
        mostGoals,
        mostBlockedShots,
        mostGoaliePoints,
        mostGoalsAllowed
      };
    }

    function weeklyLeaderByValue(players, valueGetter, filter = () => true) {
      const eligible = (players || [])
        .filter(filter)
        .map(player => ({
          player,
          value: finitePlayerNumber(valueGetter(player))
        }))
        .filter(entry => entry.value !== null);

      if (!eligible.length) return null;

      const max = Math.max(...eligible.map(entry => entry.value));
      const tied = eligible
        .filter(entry => entry.value === max)
        .map(entry => entry.player)
        .sort((a, b) => String(a.name).localeCompare(String(b.name)));

      return {
        value: max,
        players: tied
      };
    }

    function weeklyHeadlinePlayerName(leader) {
      if (!leader?.players?.length) return "—";
      const first = leader.players[0]?.name || "—";
      return leader.players.length > 1
        ? `${first} +${leader.players.length - 1}`
        : first;
    }

    function weeklyHeadlinePlayerDetail(leader, unit) {
      if (!leader?.players?.length) return "—";
      const team = String(leader.players[0]?.fantasyTeamName || "").trim();
      const value = `${formatRating(leader.value)} ${unit}`;
      return team ? `${value} · ${team}` : value;
    }

    function renderWeeklyPlayerRows(players, mode = "score") {
      if (!players.length) {
        return '<div class="weekly-player-empty">No qualifying player data for this week.</div>';
      }

      return players.map((player, index) => {
        const teamName =
          String(player?.fantasyTeamName || "").trim() ||
          "Owned player";
        const position = String(player?.positions || "").trim();
        const nhlTeam = String(player?.nhlTeam || "").trim();
        const statLine = weeklyPlayerStatLine(player);

        const identity = [position, nhlTeam].filter(Boolean).join(" · ");
        const context = [
          teamName,
          statLine || identity
        ].filter(Boolean).join(" · ");

        let scoreHtml = "";
        if (mode === "performance") {
          const delta = Number(player.delta);
          scoreHtml = `
            <div class="weekly-player-score">
              <strong class="${delta >= 0 ? "positive" : "negative"}">${formatChange(delta)}</strong>
              <small>vs baseline</small>
            </div>
          `;
        } else {
          scoreHtml = `
            <div class="weekly-player-score">
              <strong>${formatRating(weeklyPlayerFantasyPoints(player))}</strong>
              <small>FPts</small>
            </div>
          `;
        }

        return `
          <div class="weekly-player-row">
            <div class="weekly-player-rank">${index + 1}</div>
            <div class="weekly-player-main">
              <strong title="${escapeAttribute(player.name || "")}">${escapeHtml(player.name || "Unknown")}</strong>
              <small title="${escapeAttribute(context)}">${escapeHtml(context)}</small>
            </div>
            ${scoreHtml}
          </div>
        `;
      }).join("");
    }

    function renderWeeklyReview() {
      const title = document.getElementById("weeklyReviewTitle");
      const date = document.getElementById("weeklyReviewDate");
      const content = document.getElementById("weeklyReviewContent");
      if (!title || !date || !content) return;

      const review = buildWeeklyReview();
      if (!review || !review.available) {
        title.textContent = review?.period ? `Week ${review.period} Review` : "Weekly Review";
        date.textContent = "";
        content.innerHTML =
          '<div class="analysis-empty">Select a completed week to generate the weekly recap.</div>';
        return;
      }

      title.textContent = `Week ${review.period} Review`;
      date.textContent = String(review.week?.dateRange || "").replace(/[()]/g, "");

      const playerReview = buildWeeklyPlayerReview(review.period, review.week);

      const narrative = weeklyReviewNarrative(review, playerReview)
        .map(paragraph => `<p>${escapeHtml(paragraph)}</p>`)
        .join("");

      const renderMoverRows = (teams, direction) => {
        if (!teams.length) {
          return '<div class="analysis-empty">No movement.</div>';
        }

        return teams.slice(0, 3).map(team => `
          <div class="weekly-mover">
            <strong title="${escapeAttribute(team.name)}">${escapeHtml(team.name)}</strong>
            <span class="${direction === "up" ? "positive" : "negative"}">
              ${formatChange(team.eloChange)} ELO${team.rankMovement ? ` · ${movementText(team.rankMovement)}` : ""}
            </span>
          </div>
        `).join("");
      };

      const movers = `
        <div class="weekly-mover-column">
          <div class="weekly-mover-column-title">Risers</div>
          ${renderMoverRows(review.risers, "up")}
        </div>
        <div class="weekly-mover-column">
          <div class="weekly-mover-column-title">Fallers</div>
          ${renderMoverRows(review.fallers, "down")}
        </div>
      `;

      const playerPanels = playerReview.available
        ? `
          <div class="weekly-player-grid">
            <div class="weekly-player-panel">
              <h3>Top Skaters</h3>
              <div class="weekly-player-list">
                ${renderWeeklyPlayerRows(playerReview.topSkaters, "score")}
              </div>
            </div>
            <div class="weekly-player-panel">
              <h3>Top Goalies</h3>
              <div class="weekly-player-list">
                ${renderWeeklyPlayerRows(playerReview.topGoalies, "score")}
              </div>
            </div>
            <div class="weekly-player-panel">
              <h3>Underperformers</h3>
              <div class="weekly-player-list">
                ${renderWeeklyPlayerRows(playerReview.underperformers, "performance")}
              </div>
            </div>
          </div>
        `
        : `
          <div class="weekly-player-grid">
            <div class="weekly-player-panel" style="grid-column:1 / -1;">
              <h3>Player Performances</h3>
              <div class="weekly-player-empty">
                This season file does not contain player-week data yet. Run the rich Fantrax exporter after a completed week, then replace the season JSON in the data folder.
              </div>
            </div>
          </div>
        `;

      content.innerHTML = `
        <div class="weekly-review-story">${narrative}</div>

        ${playerPanels}

        <div class="weekly-review-panel weekly-review-movers-panel">
          <h3>Power Ranking Movers</h3>
          <div class="weekly-movers">${movers}</div>
        </div>
      `;
    }

    function previewPlayersToWatch(teamA, teamB, previewPeriod) {
      if (!fantraxSeasonData?.weeks?.length) {
        return {
          sourcePeriod: null,
          players: []
        };
      }

      const candidateWeeks = fantraxSeasonData.weeks
        .filter(week =>
          Number(week?.scoringPeriod) < Number(previewPeriod) &&
          fantraxWeekHasCompleteScores(week) &&
          Array.isArray(week?.players) &&
          week.players.length
        )
        .sort(
          (a, b) =>
            Number(b.scoringPeriod) - Number(a.scoringPeriod)
        );

      const sourceWeek = candidateWeeks[0] || null;

      if (!sourceWeek) {
        return {
          sourcePeriod: null,
          players: []
        };
      }

      const matchupTeams = new Set([
        String(teamA || ""),
        String(teamB || "")
      ]);

      const players = sourceWeek.players
        .filter(player =>
          matchupTeams.has(String(player?.fantasyTeamName || ""))
        )
        .map(player => ({
          ...player,
          previewFantasyPoints: weeklyPlayerFantasyPoints(player)
        }))
        .filter(player =>
          player.previewFantasyPoints !== null
        )
        .sort((a, b) =>
          b.previewFantasyPoints - a.previewFantasyPoints ||
          String(a.name || "").localeCompare(String(b.name || ""))
        )
        .slice(0, 3);

      return {
        sourcePeriod: Number(sourceWeek.scoringPeriod),
        players
      };
    }

    function renderPreviewPlayersToWatch(teamA, teamB, previewPeriod) {
      const watch = previewPlayersToWatch(
        teamA,
        teamB,
        previewPeriod
      );

      const title = watch.sourcePeriod !== null
        ? `Players to Watch · Week ${watch.sourcePeriod}`
        : "Players to Watch";

      const rows = [];

      watch.players.slice(0, 3).forEach((player, index) => {
        rows.push(`
          <div class="week-preview-player">
            <div class="week-preview-player-rank">${index + 1}</div>
            <div class="week-preview-player-main">
              <strong title="${escapeAttribute(player.name || "")}">
                ${escapeHtml(player.name || "Unknown")}
              </strong>
            </div>
            <div class="week-preview-player-points">
              ${formatRating(player.previewFantasyPoints)}
              <small>FPts</small>
            </div>
          </div>
        `);
      });

      while (rows.length < 3) {
        rows.push(`
          <div class="week-preview-player-placeholder">
            ${watch.sourcePeriod === null ? "No previous-week player data" : "—"}
          </div>
        `);
      }

      return `
        <div class="week-preview-watch">
          <div class="week-preview-panel-title">${escapeHtml(title)}</div>
          <div class="week-preview-watch-list">
            ${rows.join("")}
          </div>
        </div>
      `;
    }

    function renderPreviewRecentMeetings(recentGames) {
      const rows = [];

      (recentGames || []).slice(0, 3).forEach(game => {
        const text = String(game || "").trim();
        const match = text.match(/^(.*)\s+(-?\d+(?:\.\d+)?)\s*[–-]\s*(-?\d+(?:\.\d+)?)$/);

        if (match) {
          const team = match[1].trim();
          const score = `${match[2]}–${match[3]}`;

          rows.push(`
            <div class="week-preview-game">
              <div class="week-preview-game-team" title="${escapeAttribute(team)}">
                ${escapeHtml(team)}
              </div>
              <div class="week-preview-game-score">
                ${escapeHtml(score)}
              </div>
            </div>
          `);
        } else {
          rows.push(`
            <div class="week-preview-game">
              <div class="week-preview-game-team" title="${escapeAttribute(text)}">
                ${escapeHtml(text)}
              </div>
            </div>
          `);
        }
      });

      while (rows.length < 3) {
        rows.push(
          `<div class="week-preview-history-placeholder">${rows.length === 0 ? "No previous meetings" : "—"}</div>`
        );
      }

      return `
        <div class="week-preview-recent">
          ${rows.join("")}
        </div>
      `;
    }

    async function dashboardCardToPngBlob(card) {
      if (!card) {
        throw new Error("Dashboard card not found.");
      }

      if (typeof window.html2canvas !== "function") {
        throw new Error("Card renderer did not load.");
      }

      if (document.fonts?.ready) {
        try {
          await document.fonts.ready;
        } catch (error) {
          console.warn("Font readiness check failed.", error);
        }
      }

      const scale = Math.max(
        2,
        Math.min(3, Number(window.devicePixelRatio) || 2)
      );

      const canvas = await window.html2canvas(card, {
        backgroundColor: null,
        scale,
        useCORS: true,
        allowTaint: false,
        logging: false,
        imageTimeout: 15000,
        removeContainer: true,
        ignoreElements: element =>
          element?.classList?.contains("card-copy-button") ||
          element?.classList?.contains("no-print"),
        onclone: clonedDocument => {
          clonedDocument
            .querySelectorAll(".card-copy-button, .no-print")
            .forEach(node => node.remove());
        }
      });

      return await new Promise((resolve, reject) => {
        canvas.toBlob(
          blob => blob
            ? resolve(blob)
            : reject(new Error("Could not create PNG image.")),
          "image/png",
          1
        );
      });
    }

    async function copyDashboardCard(cardId, button) {
      const card = document.getElementById(cardId);
      if (!card) return;

      const originalText = button?.textContent || "Copy";

      if (button) {
        button.disabled = true;
        button.textContent = "Copying…";
      }

      try {
        if (
          !window.isSecureContext ||
          !navigator.clipboard?.write ||
          typeof ClipboardItem === "undefined"
        ) {
          throw new Error(
            "Image clipboard access is unavailable in this browser/context."
          );
        }

        const pngPromise = dashboardCardToPngBlob(card);

        let copied = false;
        let firstError = null;

        // Preferred path: keep the clipboard request tied directly to the
        // user's click while the PNG renders asynchronously.
        try {
          await navigator.clipboard.write([
            new ClipboardItem({
              "image/png": pngPromise
            })
          ]);
          copied = true;
        } catch (error) {
          firstError = error;
        }

        // Some Chromium builds only accept a resolved Blob in ClipboardItem.
        // Retry with the completed PNG before reporting failure.
        if (!copied) {
          const blob = await pngPromise;
          await navigator.clipboard.write([
            new ClipboardItem({
              "image/png": blob
            })
          ]);
          copied = true;
        }

        if (copied && button) {
          button.textContent = "Copied!";
          setTimeout(() => {
            button.textContent = originalText;
            button.disabled = false;
          }, 1100);
        }
      } catch (error) {
        console.error("Dashboard card copy failed:", error);

        if (button) {
          const message =
            /notallowed|permission|clipboard|secure/i.test(
              String(error?.name || "") + " " + String(error?.message || "")
            )
              ? "Clipboard blocked"
              : /renderer|html2canvas|load/i.test(
                  String(error?.message || "")
                )
                ? "Renderer failed"
                : "Copy failed";

          button.textContent = message;

          setTimeout(() => {
            button.textContent = originalText;
            button.disabled = false;
          }, 1900);
        }
      }
    }

    function validateSeasonManifest(manifest) {
      if (!manifest || !Array.isArray(manifest.seasons) || !manifest.seasons.length) {
        throw new Error("No seasons were found in the manifest.");
      }

      const seasons = manifest.seasons
        .map(season => ({
          id: String(season?.id || "").trim(),
          label: String(season?.label || season?.id || "").trim(),
          file: String(season?.file || "").trim(),
          complete: Boolean(season?.complete)
        }))
        .filter(season => season.id && season.file);

      if (!seasons.length) {
        throw new Error("The season manifest contains no valid entries.");
      }

      const requestedDefault = String(manifest.defaultSeason || "").trim();
      return {
        defaultSeason: seasons.some(season => season.id === requestedDefault)
          ? requestedDefault
          : seasons[0].id,
        seasons
      };
    }

    function populateSeasonSelect() {
      const select = document.getElementById("seasonSelect");
      if (!select) return;

      select.innerHTML = "";
      seasonManifest.seasons.forEach(season => {
        const option = document.createElement("option");
        option.value = season.id;
        option.textContent = season.label;
        option.selected = season.id === selectedSeasonId;
        select.appendChild(option);
      });

      select.disabled = false;
      select.onchange = () => switchSeason(select.value);
    }

    async function loadSeasonManifest() {
      try {
        const response = await fetch(SEASON_MANIFEST_URL, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        seasonManifest = validateSeasonManifest(await response.json());
      } catch (error) {
        console.warn("Could not load seasons.json; using the built-in season list.", error);
        seasonManifest = validateSeasonManifest(FALLBACK_SEASON_MANIFEST);
      }

      let savedSeason = "";
      try {
        savedSeason = String(localStorage.getItem(SELECTED_SEASON_STORAGE_KEY) || "");
      } catch (error) {
        console.warn("Could not load the selected season.", error);
      }

      selectedSeasonId = seasonManifest.seasons.some(season => season.id === savedSeason)
        ? savedSeason
        : seasonManifest.defaultSeason;

      populateSeasonSelect();
      await loadHeadToHeadHistory();
      await switchSeason(selectedSeasonId, { initial: true });
    }

    async function switchSeason(seasonId, options = {}) {
      const nextSeason = getSeasonConfig(seasonId);
      if (!nextSeason) return;

      if (!options.initial) {
        updateFromTableSilently();
        saveState();
      }

      selectedSeasonId = nextSeason.id;
      fantraxSeasonData = null;

      try {
        localStorage.setItem(SELECTED_SEASON_STORAGE_KEY, selectedSeasonId);
      } catch (error) {
        console.warn("Could not save the selected season.", error);
      }

      const select = document.getElementById("seasonSelect");
      if (select) select.value = selectedSeasonId;

      loadState();
      renderAll();
      await loadFantraxSeason(false, { autoImportIfMissing: true });

    function setFantraxStatus(message, type = "") {
      const status = document.getElementById("fantraxStatus");
      if (!status) return;
      status.textContent = message;
      status.className = `hint fantrax-status ${type}`.trim();
    }

    function validateFantraxData(data) {
      if (!data || typeof data !== "object") {
        throw new Error("The Fantrax data file is empty.");
      }
      if (!Array.isArray(data.teams) || !data.teams.length) {
        throw new Error("No Fantrax teams were found.");
      }
      if (!Array.isArray(data.weeks) || !data.weeks.length) {
        throw new Error("No Fantrax scoring periods were found.");
      }
    }

    function fantraxWeekHasCompleteScores(week) {
      if (!Array.isArray(week?.matchups) || !week.matchups.length) return false;

      // New exports explicitly mark unfinished scoring periods. This prevents
      // Fantrax's preseason 0–0 schedule placeholders from being imported as ties.
      if (week.complete === false) return false;

      const hasScores = week.matchups.every(matchup =>
        Number.isFinite(Number(matchup?.away?.score)) &&
        Number.isFinite(Number(matchup?.home?.score))
      );

      if (!hasScores) return false;
      if (week.complete === true) return true;

      // Backward-compatible fallback for older exports without week.complete.
      // An entire 16-team NiceHL scoring period cannot realistically finish 0–0
      // across every matchup, so all-zero rows are treated as future placeholders.
      return week.matchups.some(matchup =>
        Number(matchup?.away?.score) !== 0 ||
        Number(matchup?.home?.score) !== 0 ||
        Number(matchup?.away?.adjustment) !== 0 ||
        Number(matchup?.home?.adjustment) !== 0
      );
    }

    function getImportableFantraxWeeks() {
      if (!fantraxSeasonData?.weeks) return [];

      return fantraxSeasonData.weeks
        .filter(fantraxWeekHasCompleteScores)
        .slice()
        .sort(
          (a, b) =>
            Number(a.scoringPeriod) - Number(b.scoringPeriod)
        );
    }

    function getLatestImportableFantraxPeriod() {
      const weeks = getImportableFantraxWeeks();
      if (!weeks.length) return null;

      const latest = Number(weeks[weeks.length - 1].scoringPeriod);
      return Number.isFinite(latest) ? latest : null;
    }

    function populateFantraxPeriodSelect() {
      const select = document.getElementById("fantraxPeriodSelect");
      const importButton = document.getElementById("fantraxImportButton");
      if (!select || !importButton || !fantraxSeasonData) return;

      select.innerHTML = "";

      const importableWeeks = getImportableFantraxWeeks();

      if (!importableWeeks.length) {
        select.innerHTML = "<option>No completed weeks</option>";
        select.disabled = true;
        importButton.disabled = true;
        return;
      }

      importableWeeks.forEach(week => {
        const option = document.createElement("option");
        option.value = String(week.scoringPeriod);
        option.textContent = `Week ${week.scoringPeriod} ${week.dateRange || ""}`.trim();
        select.appendChild(option);
      });

      const savedPeriod = Number(state.fantraxMeta?.importedThrough);
      const availablePeriods = importableWeeks.map(week =>
        Number(week.scoringPeriod)
      );
      const latestPeriod = availablePeriods[availablePeriods.length - 1];

      select.value = availablePeriods.includes(savedPeriod)
        ? String(savedPeriod)
        : String(latestPeriod);

      select.disabled = false;
      importButton.disabled = false;
    }

    function syncPreseasonTeamsFromFantrax() {
      if (!fantraxSeasonData?.teams?.length) return;

      const importableWeeks = getImportableFantraxWeeks();

      // Before the first completed scoring period, the selected season must
      // always be a clean Week 0 state. This also clears any stale browser
      // state that may have been saved under the new season ID.
      if (importableWeeks.length === 0) {
        state = cleanState({
          currentWeek: 0,
          weeks: ["Week 0"],
          teams: fantraxSeasonData.teams.map(team => ({
            name: String(team.name || ""),
            record: "0-0",
            recordHistory: ["0-0"],
            elo: [1000],
            fantraxTeamId: String(team.fantraxTeamId || ""),
            teamLogoUrl: String(team.logoUrl || "")
          })),
          awardsByWeek: [normalizeAwards(DEFAULT_AWARDS)],
          awards: normalizeAwards(DEFAULT_AWARDS),
          logoDataUrl: state.logoDataUrl,
          fantraxMeta: null
        });

        saveState();
        renderAll();

        const rankSelect = document.getElementById("weekSelect");
        if (rankSelect) rankSelect.value = "0";
        return;
      }

      if (state.currentWeek !== 0) return;

      const existingByName = new Map(
        state.teams.map(team => [String(team.name), team])
      );

      state.teams = fantraxSeasonData.teams.map(team => {
        const name = String(team.name || "");
        const existing = existingByName.get(name);
        const preseasonElo = Number(existing?.elo?.[0]);

        return {
          name,
          record: "0-0",
          recordHistory: ["0-0"],
          elo: [Number.isFinite(preseasonElo) ? preseasonElo : 1000],
          fantraxTeamId: String(team.fantraxTeamId || ""),
          teamLogoUrl: String(team.logoUrl || "")
        };
      });

      state.weeks = ["Week 0"];
      state.currentWeek = 0;
      state.awardsByWeek = [normalizeAwards(DEFAULT_AWARDS)];
      state.awards = normalizeAwards(DEFAULT_AWARDS);

      saveState();
      renderAll();
    }

    async function loadFantraxSeason(showSuccess = true, options = {}) {
      const select = document.getElementById("fantraxPeriodSelect");
      const importButton = document.getElementById("fantraxImportButton");
      const seasonConfig = getSeasonConfig();
      const dataUrl = getSeasonDataUrl(seasonConfig);

      if (select) select.disabled = true;
      if (importButton) importButton.disabled = true;
      setFantraxStatus(`Loading ${seasonConfig?.label || "season"}…`);

      try {
        if (!dataUrl) throw new Error("No data file is configured for this season.");

        const response = await fetch(dataUrl, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        validateFantraxData(data);
        fantraxSeasonData = data;
        syncPreseasonTeamsFromFantrax();
        populateFantraxPeriodSelect();

        if (options.autoImportIfMissing) {
          const latestPeriod = getLatestImportableFantraxPeriod();
          const importedThrough = Number(state.fantraxMeta?.importedThrough);
          const needsInitialImport = !stateLoadedFromStorage;
          const hasNewCompletedWeek =
            Number.isFinite(latestPeriod) &&
            (!Number.isFinite(importedThrough) || latestPeriod > importedThrough);

          if (
            Number.isFinite(latestPeriod) &&
            (needsInitialImport || hasNewCompletedWeek)
          ) {
            importFantraxThroughWeek(latestPeriod, { silent: true });
          }
        }

        const leagueName = data.league?.name || "NiceHL";
        const season = data.league?.season || seasonConfig?.label || "";
        setFantraxStatus(
          showSuccess
            ? `${leagueName} ${season} loaded.`
            : `${season} ready.`,
          "success"
        );
        renderAnalysisCards();
      } catch (error) {
        console.error("Could not load Fantrax data.", error);
        fantraxSeasonData = null;
        if (select) {
          select.innerHTML = "<option>Season unavailable</option>";
          select.disabled = true;
        }
        setFantraxStatus(
          `Could not load ${seasonConfig?.file || "the season JSON file"}.`,
          "error"
        );
        const errorMarkup = '<div class="analysis-empty">Fantrax season data could not be loaded.</div>';
        [
          "nextWeekMatchups",
          "projectedStandings",
          "playoffProbability",
          "tankathonRankings",
          "expectedRecord",
          "scheduleStrength",
          "remainingSchedule"
        ].forEach(id => {
          const element = document.getElementById(id);
          if (element) element.innerHTML = errorMarkup;
        });
      }
    }

    function getWeeklyScoreEntries(week) {
      const entries = [];

      week.matchups.forEach(matchup => {
        if (matchup?.away?.name) {
          entries.push({
            name: String(matchup.away.name),
            score: Number(matchup.away.score)
          });
        }

        if (matchup?.home?.name) {
          entries.push({
            name: String(matchup.home.name),
            score: Number(matchup.home.score)
          });
        }
      });

      return entries.filter(entry => Number.isFinite(entry.score));
    }

    function calculateScoreRanks(entries) {
      const sorted = entries
        .slice()
        .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));

      const ranks = new Map();
      let index = 0;

      while (index < sorted.length) {
        let end = index;
        while (
          end + 1 < sorted.length &&
          sorted[end + 1].score === sorted[index].score
        ) {
          end++;
        }

        const averageRank = ((index + 1) + (end + 1)) / 2;
        for (let i = index; i <= end; i++) {
          ranks.set(sorted[i].name, averageRank);
        }

        index = end + 1;
      }

      return ranks;
    }

    function recordText(record) {
      if (record.ties > 0) {
        return `${record.wins}-${record.losses}-${record.ties}`;
      }
      return `${record.wins}-${record.losses}`;
    }

    function scoreDetail(team) {
      const score = Math.round(Number(team.score) * 10) / 10;
      return `${score} points`;
    }

    function buildWeekAwards(week, previousRatings) {
      const winners = [];
      const losers = [];
      const decidedMatchups = [];

      week.matchups.forEach(matchup => {
        const awayScore = Number(matchup?.away?.score);
        const homeScore = Number(matchup?.home?.score);
        if (!Number.isFinite(awayScore) || !Number.isFinite(homeScore)) return;
        if (awayScore === homeScore) return;

        const away = {
          name: String(matchup.away.name),
          score: awayScore
        };
        const home = {
          name: String(matchup.home.name),
          score: homeScore
        };

        const winner = awayScore > homeScore ? away : home;
        const loser = awayScore > homeScore ? home : away;
        const margin = Math.abs(awayScore - homeScore);

        const winnerElo = Number(previousRatings.get(winner.name) || 1000);
        const loserElo = Number(previousRatings.get(loser.name) || 1000);
        const winnerProbability = eloWinProbability(winnerElo, loserElo);

        winners.push(winner);
        losers.push(loser);
        decidedMatchups.push({
          winner,
          loser,
          margin,
          winnerElo,
          loserElo,
          winnerProbability
        });
      });

      const mostPointsInLoss = losers.length
        ? losers
            .slice()
            .sort(
              (a, b) =>
                b.score - a.score ||
                a.name.localeCompare(b.name)
            )[0]
        : null;

      const leastPointsInWin = winners.length
        ? winners
            .slice()
            .sort(
              (a, b) =>
                a.score - b.score ||
                a.name.localeCompare(b.name)
            )[0]
        : null;

      const narrowestWin = decidedMatchups.length
        ? decidedMatchups
            .slice()
            .sort(
              (a, b) =>
                a.margin - b.margin ||
                b.winner.score - a.winner.score ||
                a.winner.name.localeCompare(b.winner.name)
            )[0]
        : null;

      /*
       * Biggest Underdog Win:
       * the winner that entered the week with the lowest ELO win probability.
       * This always selects one winner, even when every winner was technically
       * favoured above 50%.
       */
      const biggestUnderdogWin = decidedMatchups.length
        ? decidedMatchups
            .slice()
            .sort(
              (a, b) =>
                a.winnerProbability - b.winnerProbability ||
                b.margin - a.margin ||
                a.winner.name.localeCompare(b.winner.name)
            )[0]
        : null;

      return [
        {
          title: "Most Points in a Loss",
          winner: mostPointsInLoss?.name || "—",
          detail: mostPointsInLoss
            ? scoreDetail(mostPointsInLoss)
            : "No losses"
        },
        {
          title: "Least Points in a Win",
          winner: leastPointsInWin?.name || "—",
          detail: leastPointsInWin
            ? scoreDetail(leastPointsInWin)
            : "No wins"
        },
        {
          title: "Narrowest Win",
          winner: narrowestWin?.winner?.name || "—",
          detail: narrowestWin
            ? `Beat ${narrowestWin.loser.name} by ${formatRating(narrowestWin.margin)}`
            : "No decided matchups"
        },
        {
          title: "Biggest Underdog Win",
          winner: biggestUnderdogWin?.winner?.name || "—",
          detail: biggestUnderdogWin
            ? `${formatPercent(biggestUnderdogWin.winnerProbability)} win probability vs ${biggestUnderdogWin.loser.name}`
            : "No decided matchups"
        }
      ];
    }

    function importFantraxThroughWeek(periodOverride = null, options = {}) {
      if (!fantraxSeasonData) {
        setFantraxStatus("Load the season first.", "error");
        return;
      }

      updateFromTableSilently();

      const selectedPeriod = Number(
        periodOverride ?? document.getElementById("fantraxPeriodSelect").value
      );

      const weeksToImport = getImportableFantraxWeeks()
        .filter(week => Number(week.scoringPeriod) <= selectedPeriod);

      if (!weeksToImport.length) {
        setFantraxStatus("No scoring periods were selected.", "error");
        return;
      }

      const teams = fantraxSeasonData.teams.map(team => ({
        name: String(team.name),
        record: "0-0",
        recordHistory: ["0-0"],
        elo: [1000],
        fantraxTeamId: String(team.fantraxTeamId || ""),
        teamLogoUrl: String(team.logoUrl || "")
      }));

      const teamMap = new Map(teams.map(team => [team.name, team]));
      const records = new Map(
        teams.map(team => [
          team.name,
          { wins: 0, losses: 0, ties: 0 }
        ])
      );

      const existingAwardsByWeek = Array.isArray(state.awardsByWeek)
        ? structuredCloneSafe(state.awardsByWeek)
        : [];

      const weeks = ["Week 0"];
      const awardsByWeek = [
        normalizeAwards(existingAwardsByWeek[0] || DEFAULT_AWARDS)
      ];

      weeksToImport.forEach(week => {
        const period = Number(week.scoringPeriod);
        weeks.push(`Week ${period}`);

        const scoreEntries = getWeeklyScoreEntries(week);
        const scoreRanks = calculateScoreRanks(scoreEntries);
        const teamCount = scoreEntries.length;

        const previousRatings = new Map(
          teams.map(team => [
            team.name,
            Number(team.elo[team.elo.length - 1] ?? 1000)
          ])
        );

        const weeklyChanges = new Map(
          teams.map(team => [team.name, 0])
        );

        scoreEntries.forEach(entry => {
          const rank = Number(scoreRanks.get(entry.name));
          const scoreRankPoints = Number.isFinite(rank)
            ? teamCount - rank
            : 0;

          weeklyChanges.set(
            entry.name,
            Number(weeklyChanges.get(entry.name) || 0) +
              scoreRankPoints
          );
        });

        week.matchups.forEach(matchup => {
          const awayName = String(matchup?.away?.name || "");
          const homeName = String(matchup?.home?.name || "");
          const awayScore = Number(matchup?.away?.score);
          const homeScore = Number(matchup?.home?.score);

          if (
            !teamMap.has(awayName) ||
            !teamMap.has(homeName) ||
            !Number.isFinite(awayScore) ||
            !Number.isFinite(homeScore)
          ) {
            return;
          }

          const awayRank = Number(scoreRanks.get(awayName));
          const homeRank = Number(scoreRanks.get(homeName));

          if (awayScore > homeScore) {
            const winPoints = teamCount + 1 - homeRank;
            const lossPoints = -awayRank;

            weeklyChanges.set(
              awayName,
              Number(weeklyChanges.get(awayName) || 0) + winPoints
            );
            weeklyChanges.set(
              homeName,
              Number(weeklyChanges.get(homeName) || 0) + lossPoints
            );

            records.get(awayName).wins++;
            records.get(homeName).losses++;
          } else if (homeScore > awayScore) {
            const winPoints = teamCount + 1 - awayRank;
            const lossPoints = -homeRank;

            weeklyChanges.set(
              homeName,
              Number(weeklyChanges.get(homeName) || 0) + winPoints
            );
            weeklyChanges.set(
              awayName,
              Number(weeklyChanges.get(awayName) || 0) + lossPoints
            );

            records.get(homeName).wins++;
            records.get(awayName).losses++;
          } else {
            records.get(awayName).ties++;
            records.get(homeName).ties++;
          }
        });

        teams.forEach(team => {
          const previous = Number(
            team.elo[team.elo.length - 1] ?? 1000
          );
          const change = Number(weeklyChanges.get(team.name) || 0);
          const updated = Math.round((previous + change) * 10) / 10;
          team.elo.push(updated);

          const record = records.get(team.name);
          const currentRecord = recordText(record);
          team.recordHistory.push(currentRecord);
          team.record = currentRecord;
        });

        awardsByWeek.push(
          buildWeekAwards(week, previousRatings)
        );
      });

      const importedWeekIndex = weeks.length - 1;

      state = cleanState({
        currentWeek: importedWeekIndex,
        weeks,
        teams,
        awardsByWeek,
        awards: awardsByWeek[importedWeekIndex],
        logoDataUrl: state.logoDataUrl,
        fantraxMeta: {
          leagueId: String(fantraxSeasonData.league?.leagueId || ""),
          leagueName: String(fantraxSeasonData.league?.name || ""),
          season: String(fantraxSeasonData.league?.season || ""),
          importedThrough: selectedPeriod,
          importedAt: new Date().toISOString(),
          formula:
            "weekly score rank points plus opponent score-rank result points",
          awardsMode: "automatic"
        }
      });

      saveState();
      renderAll();
      populateFantraxPeriodSelect();

      if (!options.silent) {
        setFantraxStatus(
          `Imported Weeks 1–${selectedPeriod}.`,
          "success"
        );
      }
    }

    function toggleScreenshotMode() {
      updateFromTable();
      document.body.classList.toggle("screenshot-mode");
      document
        .getElementById("captureArea")
        .scrollIntoView({ block: "start", behavior: "smooth" });
    }

    function downloadData() {
      updateFromTableSilently();
      const clean = cleanState(state);
      const blob = new Blob(
        [JSON.stringify(clean, null, 2)],
        { type: "application/json" }
      );
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "nicehl-power-rankings-data.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = e => {
        try {
          const imported = JSON.parse(e.target.result);
          if (
            !Array.isArray(imported.weeks) ||
            !Array.isArray(imported.teams)
          ) {
            throw new Error("Invalid data file");
          }

          state = cleanState(imported);
          saveState();
          renderAll();

          if (fantraxSeasonData) {
            populateFantraxPeriodSelect();
          }
        } catch (error) {
          alert(
            "That file does not match the fantasy power rankings format."
          );
        }
      };

      reader.readAsText(file);
      event.target.value = "";
    }

    function resetSample() {
      try {
        localStorage.removeItem(getSeasonStorageKey());
      } catch (error) {
        console.warn("Could not clear the selected season.", error);
      }

      stateLoadedFromStorage = false;
      state = cleanState({
        ...defaultState,
        logoDataUrl: getGlobalLeagueLogo() || ""
      });

      if (fantraxSeasonData?.weeks?.length) {
        const latestCompletedPeriod = getLatestImportableFantraxPeriod();

        if (latestCompletedPeriod !== null) {
          importFantraxThroughWeek(latestCompletedPeriod, { silent: true });
          setFantraxStatus(
            `${getSeasonConfig()?.label || "Season"} restored through Week ${latestCompletedPeriod}.`,
            "success"
          );
        } else {
          syncPreseasonTeamsFromFantrax();
          setFantraxStatus(
            `${getSeasonConfig()?.label || "Season"} reset to Week 0. No completed scoring periods yet.`,
            "success"
          );
        }
      } else {
        saveState();
        renderAll();
      }
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g, "&#096;");
    }

    function renderAll() {
      state = cleanState(state);
      renderWeekSelect();
      renderInputTable();
      renderAwardsEditor();
      renderLogo();
      renderRankings();
    }

    renderAll();
    loadSeasonManifest();
  </script>
</body>
