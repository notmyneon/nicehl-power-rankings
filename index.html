            "aliases": [
                  {
                        "name": "Synth City",
                        "fromSeason": "2019-20",
                        "toSeason": "2021-22"
                  },
                  {
                        "name": "Synth City Sphynx",
                        "fromSeason": "2022-23",
                        "toSeason": null
                  }
            ]
      },
      {
            "id": "woodland-whistle-pigs",
            "currentName": "Woodland Whistle Pigs",
            "aliases": [
                  {
                        "name": "Taku River Glaciers",
                        "fromSeason": "2019-20",
                        "toSeason": "2021-22"
                  },
                  {
                        "name": "Woodland Whistle Pigs",
                        "fromSeason": "2022-23",
                        "toSeason": null
                  }
            ]
      }
];

    const DEFAULT_AWARDS = [
      { title: "Most Points in a Loss", winner: "", detail: "" },
      { title: "Least Points in a Win", winner: "", detail: "" },
      { title: "Narrowest Win", winner: "", detail: "" },
      { title: "Biggest Underdog Win", winner: "", detail: "" }
    ];

    const NICEHL_TEAMS = [
      "Alberta Cobra Chickens",
      "Bowness Ice Beavers",
      "Cantuar Slough Sharks",
      "Driftless Hockey Club",
      "High Point Herons",
      "Les Rois de Lyon",
      "Mt. Pearl Vikings",
      "Pacifica Blackwall",
      "Pennant Pumpjacks",
      "Potomac Poutine",
      "Rockaway Brattwursts",
      "Scotty",
      "Southside Hellbats",
      "Steel Valley Fishercats",
      "Synth City Sphynx",
      "Woodland Whistle Pigs"
    ];

    const defaultState = {
      currentWeek: 0,
      weeks: ["Week 0"],
      teams: NICEHL_TEAMS.map(name => ({
        name,
        record: "0-0",
        recordHistory: ["0-0"],
        elo: [1000]
      })),
      awards: structuredCloneSafe(DEFAULT_AWARDS),
      awardsByWeek: [structuredCloneSafe(DEFAULT_AWARDS)],
      logoDataUrl: "",
      fantraxMeta: null
    };

    let state = structuredCloneSafe(defaultState);
    let fantraxSeasonData = null;
    let headToHeadHistoryData = null;
    let headToHeadAliasMap = new Map();
    let seasonManifest = structuredCloneSafe(FALLBACK_SEASON_MANIFEST);
    let selectedSeasonId = FALLBACK_SEASON_MANIFEST.defaultSeason;
    let stateLoadedFromStorage = false;

    function structuredCloneSafe(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function getSeasonConfig(seasonId = selectedSeasonId) {
      return seasonManifest.seasons.find(season => season.id === seasonId) || null;
    }

    function getSeasonStorageKey(seasonId = selectedSeasonId) {
      return `${SEASON_STORAGE_PREFIX}${seasonId}`;
    }

    function getSeasonDataUrl(season = getSeasonConfig()) {
      if (!season?.file) return "";
      if (/^(?:https?:)?\/\//i.test(season.file) || season.file.startsWith("./")) {
        return season.file;
      }
      return `./data/${season.file}`;
    }

    function getGlobalLeagueLogo() {
      try {
        return localStorage.getItem(LEAGUE_LOGO_STORAGE_KEY);
      } catch (error) {
        return null;
      }
    }

    function fullWeekLabel(label) {
      const match = String(label || "").match(/^W(\d+)$/i);
      if (match) return `Week ${match[1]}`;
      return label || "Week 0";
    }

    function normalizeAwards(source) {
      const input = Array.isArray(source) ? source : [];
      return DEFAULT_AWARDS.map((defaultAward, index) => {
        const award = input[index] || defaultAward;
        return {
          title: String(award?.title || defaultAward.title),
          winner: String(award?.winner || ""),
          detail: String(award?.detail || "")
        };
      });
    }

    function cleanState(input) {
      const weeksRaw =
        Array.isArray(input?.weeks) && input.weeks.length
          ? input.weeks.map(String)
          : structuredCloneSafe(defaultState.weeks);

      const weeks = weeksRaw.map(fullWeekLabel);
      const currentWeek = Math.max(
        0,
        Math.min(Number(input?.currentWeek || 0), weeks.length - 1)
      );

      const sourceTeams =
        Array.isArray(input?.teams) && input.teams.length
          ? input.teams
          : structuredCloneSafe(defaultState.teams);

      const teams = sourceTeams.map((team, index) => {
        const legacyRecord = String(team?.record || "0-0");
        const recordHistory = weeks.map((_, weekIndex) => {
          const savedRecord = team?.recordHistory?.[weekIndex];
          if (savedRecord !== undefined && savedRecord !== null) {
            return String(savedRecord);
          }
          if (weekIndex === 0) return "0-0";
          return legacyRecord;
        });

        return {
          name: String(team?.name || `Team ${index + 1}`),
          record: String(recordHistory[currentWeek] || legacyRecord),
          recordHistory,
          elo: weeks.map((_, weekIndex) => {
            const value = Number(team?.elo?.[weekIndex]);
            return Number.isFinite(value) ? value : null;
          }),
          fantraxTeamId: String(team?.fantraxTeamId || ""),
          teamLogoUrl: String(team?.teamLogoUrl || "")
        };
      });

      let awardsByWeek;
      if (Array.isArray(input?.awardsByWeek) && input.awardsByWeek.length) {
        awardsByWeek = weeks.map((_, weekIndex) =>
          normalizeAwards(input.awardsByWeek[weekIndex])
        );
      } else {
        const legacyAwards = normalizeAwards(input?.awards);
        awardsByWeek = weeks.map((_, weekIndex) =>
          weekIndex === currentWeek
            ? structuredCloneSafe(legacyAwards)
            : structuredCloneSafe(DEFAULT_AWARDS)
        );
      }

      return {
        seasonId: selectedSeasonId,
        currentWeek,
        weeks,
        teams,
        awards: normalizeAwards(awardsByWeek[currentWeek]),
        awardsByWeek,
        logoDataUrl: String(input?.logoDataUrl || ""),
        fantraxMeta:
          input?.fantraxMeta && typeof input.fantraxMeta === "object"
            ? structuredCloneSafe(input.fantraxMeta)
            : null
      };
    }

    function loadState() {
      stateLoadedFromStorage = false;
      let loadedState = null;

      try {
        const saved = localStorage.getItem(getSeasonStorageKey());
        if (saved) {
          const parsed = JSON.parse(saved);
          if (!parsed?.seasonId || parsed.seasonId === selectedSeasonId) {
            loadedState = parsed;
            stateLoadedFromStorage = true;
          } else {
            console.warn(
              `Ignored saved state for ${parsed.seasonId} while loading ${selectedSeasonId}.`
            );
          }
        } else if (selectedSeasonId === LEGACY_STATE_SEASON_ID) {
          // The legacy v7 state belonged to 2025-26. Never migrate it into a
          // newer season simply because that newer season is now the default.
          const legacySaved = localStorage.getItem(LEGACY_STORAGE_KEY);
          if (legacySaved) {
            loadedState = JSON.parse(legacySaved);
            stateLoadedFromStorage = true;
            localStorage.setItem(getSeasonStorageKey(), legacySaved);
          }
        }
      } catch (error) {
        console.warn("Could not load saved rankings.", error);
      }

      state = cleanState(loadedState || defaultState);

      try {
        const globalLogo = getGlobalLeagueLogo();
        if (globalLogo !== null) {
          state.logoDataUrl = globalLogo;
        } else if (state.logoDataUrl) {
          localStorage.setItem(LEAGUE_LOGO_STORAGE_KEY, state.logoDataUrl);
        }
      } catch (error) {
        console.warn("Could not load the saved league logo.", error);
      }

      return stateLoadedFromStorage;
    }

    function saveState() {
      try {
        state.awards = normalizeAwards(state.awardsByWeek[state.currentWeek]);
        const cleaned = cleanState(state);
        localStorage.setItem(getSeasonStorageKey(), JSON.stringify(cleaned));
        localStorage.setItem(LEAGUE_LOGO_STORAGE_KEY, cleaned.logoDataUrl || "");
        stateLoadedFromStorage = true;
      } catch (error) {
        console.warn("Could not save rankings.", error);
      }
    }

    function getRecordForWeek(team, weekIndex) {
      const exact = team?.recordHistory?.[weekIndex];
      if (exact !== undefined && exact !== null && String(exact).trim()) {
        return String(exact);
      }

      for (let i = weekIndex - 1; i >= 0; i--) {
        const previous = team?.recordHistory?.[i];
        if (previous !== undefined && previous !== null && String(previous).trim()) {
          return String(previous);
        }
      }

      return String(team?.record || "0-0");
    }

    function getAwardsForWeek(weekIndex = state.currentWeek) {
      if (!Array.isArray(state.awardsByWeek)) state.awardsByWeek = [];
      if (!state.awardsByWeek[weekIndex]) {
        state.awardsByWeek[weekIndex] = structuredCloneSafe(DEFAULT_AWARDS);
      }
      return state.awardsByWeek[weekIndex];
    }

    function renderWeekSelect() {
      const select = document.getElementById("weekSelect");
      select.innerHTML = "";

      state.weeks.forEach((week, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = fullWeekLabel(week);
        if (index === state.currentWeek) option.selected = true;
        select.appendChild(option);
      });

      select.onchange = () => {
        updateFromTableSilently();
        state.currentWeek = Number(select.value);
        state.awards = normalizeAwards(getAwardsForWeek(state.currentWeek));
        saveState();
        renderInputTable();
        renderAwardsEditor();
        renderRankings();
      };
    }

    function renderLogo() {
      const logo = document.getElementById("leagueLogo");
      if (!logo) return;

      if (state.logoDataUrl) {
        logo.src = state.logoDataUrl;
        logo.classList.add("has-logo");
      } else {
        logo.removeAttribute("src");
        logo.classList.remove("has-logo");
      }
    }

    function importLogo(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = e => {
        state.logoDataUrl = String(e.target.result || "");
        saveState();
        renderLogo();
      };
      reader.readAsDataURL(file);
      event.target.value = "";
    }

    function removeLogo() {
      state.logoDataUrl = "";
      saveState();
      renderLogo();
    }

    function renderAwardsEditor() {
      const editor = document.getElementById("awardsEditor");
      if (!editor) return;

      const awards = getAwardsForWeek(state.currentWeek);
      editor.innerHTML = `
        <div class="awards-grid">
          ${awards.map((award, index) => `
            <div class="award-input-card">
              <label>Award ${index + 1}</label>
              <input type="text" value="${escapeAttribute(award.title)}" data-award="${index}" data-award-field="title" placeholder="Award title" />
              <input type="text" value="${escapeAttribute(award.winner)}" data-award="${index}" data-award-field="winner" placeholder="Winner / team" />
              <input type="text" value="${escapeAttribute(award.detail)}" data-award="${index}" data-award-field="detail" placeholder="Details" />
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderInputTable() {
      const table = document.getElementById("inputTable");
      const weekHeaders = state.weeks
        .map(week => `<th>${escapeHtml(fullWeekLabel(week))}</th>`)
        .join("");

      table.innerHTML = `
        <thead>
          <tr>
            <th>Team</th>
            <th>${escapeHtml(fullWeekLabel(state.weeks[state.currentWeek]))} Record</th>
            ${weekHeaders}
            <th class="no-print">Remove</th>
          </tr>
        </thead>
        <tbody>
          ${state.teams.map((team, rowIndex) => `
            <tr>
              <td><input class="team-name" type="text" value="${escapeAttribute(team.name)}" data-row="${rowIndex}" data-field="name" /></td>
              <td><input class="record" type="text" value="${escapeAttribute(getRecordForWeek(team, state.currentWeek))}" data-row="${rowIndex}" data-field="record-current" /></td>
              ${state.weeks.map((_, weekIndex) => `
                <td>
                  <input
                    type="number"
                    step="0.5"
                    value="${Number.isFinite(Number(team.elo?.[weekIndex])) ? team.elo[weekIndex] : ""}"
                    data-row="${rowIndex}"
                    data-week="${weekIndex}"
                  />
                </td>
              `).join("")}
              <td class="no-print"><button type="button" class="secondary" onclick="removeTeam(${rowIndex})">Remove</button></td>
            </tr>
          `).join("")}
        </tbody>
      `;
    }

    function updateFromTable() {
      updateFromTableSilently();
      state.currentWeek = Number(document.getElementById("weekSelect").value);
      state.awards = normalizeAwards(getAwardsForWeek(state.currentWeek));
      saveState();
      renderAll();
    }

    function updateFromTableSilently() {
      const table = document.getElementById("inputTable");
      if (!table || !table.querySelector("input")) return;

      const inputs = document.querySelectorAll("#inputTable input");
      inputs.forEach(input => {
        const row = Number(input.dataset.row);
        if (!state.teams[row]) return;

        if (input.dataset.field === "name") {
          state.teams[row].name = input.value.trim();
        }

        if (input.dataset.field === "record-current") {
          if (!Array.isArray(state.teams[row].recordHistory)) {
            state.teams[row].recordHistory = state.weeks.map(() => "0-0");
          }
          state.teams[row].recordHistory[state.currentWeek] =
            input.value.trim() || "0-0";
          state.teams[row].record =
            state.teams[row].recordHistory[state.currentWeek];
        }

        if (input.dataset.week !== undefined) {
          const week = Number(input.dataset.week);
          const value = input.value === "" ? null : Number(input.value);
          state.teams[row].elo[week] = Number.isFinite(value) ? value : null;
        }
      });

      const awards = getAwardsForWeek(state.currentWeek);
      const awardInputs = document.querySelectorAll("#awardsEditor input");
      awardInputs.forEach(input => {
        const index = Number(input.dataset.award);
        const field = input.dataset.awardField;
        if (!awards[index] || !field) return;
        awards[index][field] = input.value.trim();
      });
      state.awards = normalizeAwards(awards);
    }

    function addTeam() {
      updateFromTableSilently();
      state.teams.push({
        name: "New Team",
        record: "0-0",
        recordHistory: state.weeks.map(() => "0-0"),
        elo: state.weeks.map((_, index) => (index === 0 ? 1000 : null)),
        fantraxTeamId: "",
        teamLogoUrl: ""
      });
      saveState();
      renderAll();
    }

    function removeTeam(index) {
      updateFromTableSilently();
      state.teams.splice(index, 1);
      saveState();
      renderAll();
    }

    function addWeek() {
      updateFromTableSilently();
      const nextNumber = state.weeks.length;
      state.weeks.push(`Week ${nextNumber}`);

      state.teams.forEach(team => {
        team.elo.push(null);
        if (!Array.isArray(team.recordHistory)) team.recordHistory = ["0-0"];
        const previousRecord =
          team.recordHistory[team.recordHistory.length - 1] || team.record || "0-0";
        team.recordHistory.push(previousRecord);
      });

      state.awardsByWeek.push(structuredCloneSafe(DEFAULT_AWARDS));
      state.currentWeek = state.weeks.length - 1;
      saveState();
      renderAll();
    }

    function getValueForWeek(team, weekIndex) {
      const exact = Number(team.elo?.[weekIndex]);
      if (Number.isFinite(exact)) return exact;

      for (let i = weekIndex - 1; i >= 0; i--) {
        const previous = Number(team.elo?.[i]);
        if (Number.isFinite(previous)) return previous;
      }

      return 0;
    }

    function buildRankData(weekIndex) {
      const current = state.teams
        .map((team, index) => ({
          ...team,
          originalIndex: index,
          displayRecord: getRecordForWeek(team, weekIndex),
          currentElo: getValueForWeek(team, weekIndex),
          previousElo:
            weekIndex > 0
              ? getValueForWeek(team, weekIndex - 1)
              : getValueForWeek(team, weekIndex)
        }))
        .sort(
          (a, b) =>
            b.currentElo - a.currentElo || a.name.localeCompare(b.name)
        );

      const previous = state.teams
        .map((team, index) => ({
          originalIndex: index,
          value:
            weekIndex > 0
              ? getValueForWeek(team, weekIndex - 1)
              : getValueForWeek(team, weekIndex)
        }))
        .sort(
          (a, b) =>
            b.value - a.value || a.originalIndex - b.originalIndex
        );

      const prevRanks = new Map();
      previous.forEach((team, index) =>
        prevRanks.set(team.originalIndex, index + 1)
      );

      return current.map((team, index) => {
        const rank = index + 1;
        const prevRank = prevRanks.get(team.originalIndex) || rank;
        const rankMovement = prevRank - rank;
        const eloChange = team.currentElo - team.previousElo;
        return {
          ...team,
          rank,
          prevRank,
          rankMovement,
          eloChange
        };
      });
    }

    function movementText(rankMovement) {
      if (rankMovement > 0) return `▲ ${rankMovement}`;
      if (rankMovement < 0) return `▼ ${Math.abs(rankMovement)}`;
      return "—";
    }

    function movementClass(rankMovement) {
      if (rankMovement > 0) return "up";
      if (rankMovement < 0) return "down";
      return "same";
    }

    function formatChange(value) {
      const rounded = Math.round(value * 10) / 10;
      if (rounded > 0) return `+${rounded}`;
      return `${rounded}`;
    }

    function formatRating(value) {
      const rounded = Math.round(value * 10) / 10;
      return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
    }

    function orderForTwoColumnDisplay(data) {
      const splitPoint = Math.ceil(data.length / 2);
      const left = data.slice(0, splitPoint);
      const right = data.slice(splitPoint);
      const ordered = [];
      const maxRows = Math.max(left.length, right.length);

      for (let i = 0; i < maxRows; i++) {
        if (left[i]) ordered.push(left[i]);
        if (right[i]) ordered.push(right[i]);
      }

      return ordered;
    }

    function getCurrentScoringPeriod() {
      const label = String(state.weeks[state.currentWeek] || "Week 0");
      const match = label.match(/(\d+)/);
      return match ? Number(match[1]) : 0;
    }

    function getSortedSeasonWeeks() {
      if (!fantraxSeasonData?.weeks) return [];
      return fantraxSeasonData.weeks
        .slice()
        .sort((a, b) => Number(a.scoringPeriod) - Number(b.scoringPeriod));
    }

    function eloWinProbability(teamElo, opponentElo) {
      const own = Number(teamElo);
      const opponent = Number(opponentElo);
      if (!Number.isFinite(own) || !Number.isFinite(opponent)) return 0.5;
      return 1 / (1 + Math.pow(10, (opponent - own) / 400));
    }

    function formatPercent(value) {
      if (!Number.isFinite(Number(value))) return "—";
      return `${(Number(value) * 100).toFixed(1)}%`;
    }

    function formatProjectedNumber(value) {
      const rounded = Math.round(Number(value) * 10) / 10;
      return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
    }

    function formatProjectedRecord(wins, losses, ties = 0) {
      const base = `${formatProjectedNumber(wins)}–${formatProjectedNumber(losses)}`;
      return ties ? `${base}–${ties}` : base;
    }

    function formatAllPlayRecord(wins, losses) {
      return `${formatProjectedNumber(wins)}–${formatProjectedNumber(losses)}`;
    }

    function formatExpectedRecord(wins, losses) {
      return `${Number(wins).toFixed(2)}–${Number(losses).toFixed(2)}`;
    }

    function formatExpectedDifference(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return "—";
      const sign = number > 0 ? "+" : "";
      return `${sign}${number.toFixed(2)}`;
    }

    const PLAYOFF_SPOTS = 8;
    const PLAYOFF_SIMULATIONS = 20000;

    function hashString(value) {
      let hash = 2166136261;
      const text = String(value);

      for (let index = 0; index < text.length; index++) {
        hash ^= text.charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }

      return hash >>> 0;
    }

    function createSeededRandom(seed) {
      let value = seed >>> 0;

      return function random() {
        value += 0x6D2B79F5;
        let result = value;
        result = Math.imul(result ^ (result >>> 15), result | 1);
        result ^= result + Math.imul(result ^ (result >>> 7), result | 61);
        return ((result ^ (result >>> 14)) >>> 0) / 4294967296;
      };
    }

    function calculatePlayoffProbabilities(
      stats,
      remainingWeeks,
      ratings,
      currentPeriod
    ) {
      const teams = Array.from(stats.values())
        .map(team => ({
          name: team.name,
          wins: team.wins,
          losses: team.losses,
          ties: team.ties,
          elo: Number(ratings.get(team.name) || 1000)
        }))
        .sort((a, b) => a.name.localeCompare(b.name));

      const teamIndexes = new Map(
        teams.map((team, index) => [team.name, index])
      );

      const futureGames = [];

      remainingWeeks.forEach(week => {
        week.matchups.forEach(matchup => {
          const awayName = String(matchup?.away?.name || "");
          const homeName = String(matchup?.home?.name || "");
          const awayIndex = teamIndexes.get(awayName);
          const homeIndex = teamIndexes.get(homeName);

          if (awayIndex === undefined || homeIndex === undefined) return;

          futureGames.push({
            awayIndex,
            homeIndex,
            awayProbability: eloWinProbability(
              teams[awayIndex].elo,
              teams[homeIndex].elo
            )
          });
        });
      });

      const seedText = [
        currentPeriod,
        ...teams.map(team =>
          `${team.name}:${team.wins}:${team.losses}:${team.ties}:${team.elo}`
        ),
        ...futureGames.map(game =>
          `${game.awayIndex}:${game.homeIndex}:${game.awayProbability.toFixed(6)}`
        )
      ].join("|");

      const random = createSeededRandom(hashString(seedText));
      const playoffCounts = teams.map(() => 0);
      const finishTotals = teams.map(() => 0);
      const simulatedWinTotals = teams.map(() => 0);

      for (let simulation = 0; simulation < PLAYOFF_SIMULATIONS; simulation++) {
        const winValues = teams.map(team => team.wins + 0.5 * team.ties);

        futureGames.forEach(game => {
          if (random() < game.awayProbability) {
            winValues[game.awayIndex] += 1;
          } else {
            winValues[game.homeIndex] += 1;
          }
        });

        const order = teams
          .map((team, index) => index)
          .sort(
            (first, second) =>
              winValues[second] - winValues[first] ||
              teams[second].elo - teams[first].elo ||
              teams[first].name.localeCompare(teams[second].name)
          );

        order.forEach((teamIndex, finishIndex) => {
          finishTotals[teamIndex] += finishIndex + 1;
          simulatedWinTotals[teamIndex] += winValues[teamIndex];

          if (finishIndex < PLAYOFF_SPOTS) {
            playoffCounts[teamIndex]++;
          }
        });
      }

      return teams
        .map((team, index) => ({
          ...team,
          playoffProbability:
            playoffCounts[index] / PLAYOFF_SIMULATIONS,
          averageFinish:
            finishTotals[index] / PLAYOFF_SIMULATIONS,
          averageFinalWins:
            simulatedWinTotals[index] / PLAYOFF_SIMULATIONS
        }))
        .sort(
          (a, b) =>
            b.playoffProbability - a.playoffProbability ||
            a.averageFinish - b.averageFinish ||
            b.elo - a.elo ||
            a.name.localeCompare(b.name)
        );
    }

    function normaliseHistoryName(name) {
      return String(name || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ");
    }

    function fallbackHistoryFranchiseId(name) {
      return String(name || "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "") || "unknown";
    }

    function buildHeadToHeadAliasMap() {
      headToHeadAliasMap = new Map();

      (headToHeadHistoryData?.franchises || []).forEach(franchise => {
        const id = String(franchise?.id || "");
        if (!id) return;

        const currentName = normaliseHistoryName(franchise?.currentName);
        if (currentName) headToHeadAliasMap.set(currentName, id);

        (franchise?.aliases || []).forEach(alias => {
          const key = normaliseHistoryName(alias?.name);
          if (key) headToHeadAliasMap.set(key, id);
        });
      });
    }

    function historyFranchiseId(name) {
      const key = normaliseHistoryName(name);
      return headToHeadAliasMap.get(key) || fallbackHistoryFranchiseId(name);
    }

    function fallbackHistorySeasonOrder() {
      return (seasonManifest?.seasons || [])
        .map(season => String(season?.id || ""))
        .filter(Boolean)
        .reverse();
    }

    function historyDataShell() {
      return {
        version: 1,
        description: "NiceHL head-to-head history rebuilt from season files.",
        seasonOrder: fallbackHistorySeasonOrder(),
        franchises: structuredCloneSafe(FALLBACK_H2H_FRANCHISES),
        games: []
      };
    }

    function matchupHasHistoricalScores(matchup) {
      const awayScore = Number(matchup?.away?.score);
      const homeScore = Number(matchup?.home?.score);

      if (!Number.isFinite(awayScore) || !Number.isFinite(homeScore)) {
        return false;
      }

      // Respect the explicit completion marker used by newer exports.
      if (matchup?.complete === false) return false;

      return true;
    }

    function historyGamesFromSeasonData(data, seasonId) {
      const games = [];

      (data?.weeks || []).forEach(week => {
        const period = Number(week?.scoringPeriod);
        if (!Number.isFinite(period)) return;
        if (week?.complete === false) return;

        (week?.matchups || []).forEach(matchup => {
          const awayName = String(matchup?.away?.name || "").trim();
          const homeName = String(matchup?.home?.name || "").trim();
          const awayScore = Number(matchup?.away?.score);
          const homeScore = Number(matchup?.home?.score);

          if (
            !awayName ||
            !homeName ||
            !Number.isFinite(awayScore) ||
            !Number.isFinite(homeScore)
          ) {
            return;
          }

          let winner = "tie";
          if (awayScore > homeScore) winner = "away";
          else if (homeScore > awayScore) winner = "home";

          games.push({
            season: String(seasonId || data?.league?.season || ""),
            period,
            dateRange: String(week?.dateRange || ""),
            awayName,
            awayFranchiseId: historyFranchiseId(awayName),
            awayScore,
            homeName,
            homeFranchiseId: historyFranchiseId(homeName),
            homeScore,
            winner,
            margin: Math.abs(awayScore - homeScore)
          });
        });
      });

      return games;
    }

    async function rebuildHeadToHeadHistoryFromSeasonFiles() {
      // Seed the alias map before parsing historical team names.
      headToHeadHistoryData = historyDataShell();
      buildHeadToHeadAliasMap();

      const games = [];
      const loadedSeasons = [];
      const failedSeasons = [];

      for (const season of seasonManifest?.seasons || []) {
        const url = getSeasonDataUrl(season);
        if (!url) continue;

        try {
          const response = await fetch(url, { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);

          const data = await response.json();
          const seasonGames = historyGamesFromSeasonData(data, season.id);
          games.push(...seasonGames);
          loadedSeasons.push(`${season.id} (${seasonGames.length} games)`);
        } catch (error) {
          failedSeasons.push(season.id);
          console.warn(`Could not load ${season.id} for head-to-head history.`, error);
        }
      }

      if (!games.length) {
        throw new Error("No historical matchup games could be rebuilt from season files.");
      }

      headToHeadHistoryData = {
        ...historyDataShell(),
        games
      };
      buildHeadToHeadAliasMap();

      console.log(
        `Head-to-head history rebuilt from season files: ${games.length} games.`,
        loadedSeasons
      );

      if (failedSeasons.length) {
        console.warn(
          "Some seasons were unavailable while rebuilding H2H history:",
          failedSeasons
        );
      }
    }

    async function loadHeadToHeadHistory() {
      try {
        const response = await fetch("./data/nicehl-head-to-head-history.json", {
          cache: "no-store"
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        if (!Array.isArray(data?.games) || !data.games.length) {
          throw new Error("History file does not contain matchup games.");
        }

        headToHeadHistoryData = data;
        buildHeadToHeadAliasMap();
        console.log(`Loaded compact head-to-head archive: ${data.games.length} games.`);
      } catch (error) {
        console.warn(
          "Compact head-to-head history unavailable; rebuilding from season files instead.",
          error
        );

        try {
          await rebuildHeadToHeadHistoryFromSeasonFiles();
        } catch (fallbackError) {
          console.warn("Could not rebuild head-to-head history.", fallbackError);
          headToHeadHistoryData = historyDataShell();
          buildHeadToHeadAliasMap();
        }
      }
    }

    function historySeasonIndex(seasonId) {
      const order = headToHeadHistoryData?.seasonOrder || [];
      const index = order.indexOf(String(seasonId || ""));
      return index >= 0 ? index : Number.MAX_SAFE_INTEGER;
    }

    function historyGameBeforePreview(game, seasonId, previewPeriod) {
      const gameSeasonIndex = historySeasonIndex(game?.season);
      const targetSeasonIndex = historySeasonIndex(seasonId);

      if (gameSeasonIndex < targetSeasonIndex) return true;
      if (gameSeasonIndex > targetSeasonIndex) return false;

      return Number(game?.period) < Number(previewPeriod);
    }

    function currentSeasonHistoryGames(seasonId, previewPeriod) {
      if (!fantraxSeasonData?.weeks?.length) return [];

      const loadedSeason = String(
        fantraxSeasonData?.league?.season ||
        fantraxSeasonData?.league?.seasonName ||
        ""
      );

      if (loadedSeason && loadedSeason !== String(seasonId || "")) {
        return [];
      }

      const games = [];

      fantraxSeasonData.weeks.forEach(week => {
        const period = Number(week?.scoringPeriod);

        if (
          !Number.isFinite(period) ||
          period >= Number(previewPeriod) ||
          !fantraxWeekHasCompleteScores(week)
        ) {
          return;
        }

        (week.matchups || []).forEach(matchup => {
          const awayName = String(matchup?.away?.name || "");
          const homeName = String(matchup?.home?.name || "");
          const awayScore = Number(matchup?.away?.score);
          const homeScore = Number(matchup?.home?.score);

          if (
            !awayName ||
            !homeName ||
            !Number.isFinite(awayScore) ||
            !Number.isFinite(homeScore)
          ) {
            return;
          }

          let winner = "tie";
          if (awayScore > homeScore) winner = "away";
          else if (homeScore > awayScore) winner = "home";

          games.push({
            season: String(seasonId || loadedSeason),
            period,
            dateRange: String(week?.dateRange || ""),
            awayName,
            awayFranchiseId: historyFranchiseId(awayName),
            awayScore,
            homeName,
            homeFranchiseId: historyFranchiseId(homeName),
            homeScore,
            winner,
            margin: Math.abs(awayScore - homeScore)
          });
        });
      });

      return games;
    }

    function combinedHeadToHeadHistoryGames(seasonId, previewPeriod) {
      const archived = Array.isArray(headToHeadHistoryData?.games)
        ? headToHeadHistoryData.games
        : [];

      const current = currentSeasonHistoryGames(
        seasonId,
        previewPeriod
      );

      const byKey = new Map();

      [...archived, ...current].forEach(game => {
        const pair = [
          String(game?.awayFranchiseId || ""),
          String(game?.homeFranchiseId || "")
        ].sort().join("|");

        const key = [
          String(game?.season || ""),
          Number(game?.period),
          pair
        ].join("|");

        // Current-season loaded data comes last and therefore replaces
        // an archived copy if both happen to contain the same matchup.
        byKey.set(key, game);
      });

      return Array.from(byKey.values());
    }

    function buildHeadToHeadPreview(teamA, teamB, seasonId, previewPeriod) {
      if (!headToHeadHistoryData?.games?.length) {
        return {
          available: false,
          seriesText: "No historical matchup data loaded.",
          recent: []
        };
      }

      const franchiseA = historyFranchiseId(teamA);
      const franchiseB = historyFranchiseId(teamB);

      const games = combinedHeadToHeadHistoryGames(
        seasonId,
        previewPeriod
      )
        .filter(game =>
          historyGameBeforePreview(game, seasonId, previewPeriod) &&
          (
            (
              game.awayFranchiseId === franchiseA &&
              game.homeFranchiseId === franchiseB
            ) ||
            (
              game.awayFranchiseId === franchiseB &&
              game.homeFranchiseId === franchiseA
            )
          )
        )
        .sort((a, b) =>
          historySeasonIndex(b.season) - historySeasonIndex(a.season) ||
          Number(b.period) - Number(a.period)
        );

      if (!games.length) {
        return {
          available: true,
          seriesText: "First meeting between these franchises.",
          recent: []
        };
      }

      let winsA = 0;
      let winsB = 0;
      let ties = 0;

      games.forEach(game => {
        const awayA = game.awayFranchiseId === franchiseA;
        const scoreA = awayA ? Number(game.awayScore) : Number(game.homeScore);
        const scoreB = awayA ? Number(game.homeScore) : Number(game.awayScore);

        if (scoreA > scoreB) winsA++;
        else if (scoreB > scoreA) winsB++;
        else ties++;
      });

      let seriesText = "";
      if (winsA > winsB) {
        seriesText = `${teamA} leads the all-time series ${winsA}–${winsB}`;
      } else if (winsB > winsA) {
        seriesText = `${teamB} leads the all-time series ${winsB}–${winsA}`;
      } else {
        seriesText = `All-time series tied ${winsA}–${winsB}`;
      }
      if (ties) seriesText += ` with ${ties} tie${ties === 1 ? "" : "s"}`;
      seriesText += ".";

      const recent = games.slice(0, 3).map(game => {
        const awayA = game.awayFranchiseId === franchiseA;
        const scoreA = awayA ? Number(game.awayScore) : Number(game.homeScore);
        const scoreB = awayA ? Number(game.homeScore) : Number(game.awayScore);

        let resultText;
        if (scoreA > scoreB) {
          resultText = `${teamA} ${formatRating(scoreA)}–${formatRating(scoreB)}`;
        } else if (scoreB > scoreA) {
          resultText = `${teamB} ${formatRating(scoreB)}–${formatRating(scoreA)}`;
        } else {
          resultText = `Tie ${formatRating(scoreA)}–${formatRating(scoreB)}`;
        }

        return resultText;
      });

      return {
        available: true,
        seriesText,
        recent
      };
    }

    function buildSeasonAnalysis() {
      if (!fantraxSeasonData) return null;

      const currentPeriod = getCurrentScoringPeriod();
      const seasonWeeks = getSortedSeasonWeeks();
      const completedWeeks = seasonWeeks.filter(
        week => Number(week.scoringPeriod) <= currentPeriod
      );
      const remainingWeeks = seasonWeeks.filter(
        week => Number(week.scoringPeriod) > currentPeriod
      );
      const nextWeek = remainingWeeks.length ? remainingWeeks[0] : null;

      const teamNames = fantraxSeasonData.teams.map(team => String(team.name));
      const stateTeamMap = new Map(state.teams.map(team => [team.name, team]));
      const ratings = new Map(
        teamNames.map(name => [
          name,
          getValueForWeek(stateTeamMap.get(name) || { elo: [1000] }, state.currentWeek)
        ])
      );

      const nextWeekMatchups = nextWeek
        ? nextWeek.matchups
            .map(matchup => {
              const awayName = String(matchup?.away?.name || "");
              const homeName = String(matchup?.home?.name || "");
              if (!awayName || !homeName) return null;

              const awayElo = Number(ratings.get(awayName) || 1000);
              const homeElo = Number(ratings.get(homeName) || 1000);
              const awayProbability = eloWinProbability(awayElo, homeElo);

              return {
                awayName,
                homeName,
                awayElo,
                homeElo,
                awayRecord: getRecordForWeek(stateTeamMap.get(awayName), state.currentWeek),
                homeRecord: getRecordForWeek(stateTeamMap.get(homeName), state.currentWeek),
                awayProbability,
                homeProbability: 1 - awayProbability
              };
            })
            .filter(Boolean)
        : [];

      const stats = new Map(
        teamNames.map(name => [
          name,
          {
            name,
            wins: 0,
            losses: 0,
            ties: 0,
            pointsFor: 0,
            pointsAgainst: 0,
            allPlayFor: 0,
            allPlayAgainst: 0,
            scheduleFor: 0,
            scheduleAgainst: 0,
            expectedRemainingWins: 0,
            remainingGames: 0,
            opponentEloTotal: 0,
            expectedRecordWins: 0,
            expectedRecordGames: 0,
            offensiveExpectedWins: 0,
            defensiveExpectedWins: 0
          }
        ])
      );

      completedWeeks.forEach(week => {
        const entries = getWeeklyScoreEntries(week);
        const scoreMap = new Map(entries.map(entry => [entry.name, entry.score]));
        const teamCount = entries.length;
        const maxRankPoints = Math.max(0, teamCount - 1);
        const weeklyRankPoints = new Map();

        entries.forEach(entry => {
          // Match the workbook's rank-points method: highest score earns 15,
          // lowest earns 0, and equal scores share the same RANK.EQ position.
          const rankPoints = entries.reduce(
            (total, other) => total + (other.score <= entry.score ? 1 : 0),
            -1
          );
          weeklyRankPoints.set(entry.name, rankPoints);

          const team = stats.get(entry.name);
          if (team) {
            team.allPlayFor += rankPoints;
            team.allPlayAgainst += maxRankPoints - rankPoints;
          }
        });

        week.matchups.forEach(matchup => {
          const awayName = String(matchup?.away?.name || "");
          const homeName = String(matchup?.home?.name || "");
          const awayScore = Number(scoreMap.get(awayName));
          const homeScore = Number(scoreMap.get(homeName));
          const awayStats = stats.get(awayName);
          const homeStats = stats.get(homeName);

          if (!awayStats || !homeStats) return;

          if (awayScore > homeScore) {
            awayStats.wins++;
            homeStats.losses++;
          } else if (homeScore > awayScore) {
            homeStats.wins++;
            awayStats.losses++;
          } else if (Number.isFinite(awayScore) && Number.isFinite(homeScore)) {
            awayStats.ties++;
            homeStats.ties++;
          }

          if (Number.isFinite(awayScore) && Number.isFinite(homeScore)) {
            awayStats.pointsFor += awayScore;
            awayStats.pointsAgainst += homeScore;
            homeStats.pointsFor += homeScore;
            homeStats.pointsAgainst += awayScore;
          }

          const awayOpponentRank = Number(weeklyRankPoints.get(homeName) || 0);
          const homeOpponentRank = Number(weeklyRankPoints.get(awayName) || 0);

          awayStats.scheduleFor += awayOpponentRank;
          awayStats.scheduleAgainst += maxRankPoints - awayOpponentRank;
          homeStats.scheduleFor += homeOpponentRank;
          homeStats.scheduleAgainst += maxRankPoints - homeOpponentRank;

          /*
           * Expected Record
           *
           * Offensive component:
           *   the team's own weekly all-play wins divided by 15.
           *
           * Defensive component:
           *   the inverse of its opponent's weekly all-play wins.
           *   Facing the week's highest scorer produces 0.00 defensive wins;
           *   facing the lowest scorer produces 1.00 defensive wins.
           *
           * Weekly expected wins are the average of those two components.
           */
          if (maxRankPoints > 0) {
            const awayOwnRank = Number(weeklyRankPoints.get(awayName) || 0);
            const homeOwnRank = Number(weeklyRankPoints.get(homeName) || 0);

            const awayOffensiveWins = awayOwnRank / maxRankPoints;
            const awayDefensiveWins =
              (maxRankPoints - homeOwnRank) / maxRankPoints;
            const homeOffensiveWins = homeOwnRank / maxRankPoints;
            const homeDefensiveWins =
              (maxRankPoints - awayOwnRank) / maxRankPoints;

            awayStats.offensiveExpectedWins += awayOffensiveWins;
            awayStats.defensiveExpectedWins += awayDefensiveWins;
            awayStats.expectedRecordWins +=
              (awayOffensiveWins + awayDefensiveWins) / 2;
            awayStats.expectedRecordGames++;

            homeStats.offensiveExpectedWins += homeOffensiveWins;
            homeStats.defensiveExpectedWins += homeDefensiveWins;
            homeStats.expectedRecordWins +=
              (homeOffensiveWins + homeDefensiveWins) / 2;
            homeStats.expectedRecordGames++;
          }
        });
      });

      remainingWeeks.forEach(week => {
        week.matchups.forEach(matchup => {
          const awayName = String(matchup?.away?.name || "");
          const homeName = String(matchup?.home?.name || "");
          const awayStats = stats.get(awayName);
          const homeStats = stats.get(homeName);
          if (!awayStats || !homeStats) return;

          const awayElo = Number(ratings.get(awayName) || 1000);
          const homeElo = Number(ratings.get(homeName) || 1000);
          const awayProbability = eloWinProbability(awayElo, homeElo);
          const homeProbability = eloWinProbability(homeElo, awayElo);

          awayStats.expectedRemainingWins += awayProbability;
          awayStats.remainingGames++;
          awayStats.opponentEloTotal += homeElo;

          homeStats.expectedRemainingWins += homeProbability;
          homeStats.remainingGames++;
          homeStats.opponentEloTotal += awayElo;
        });
      });

      /*
       * Tankathon Rankings
       *
       * 1. Select the bottom eight teams from the full standings:
       *    fewest wins, then fewest total points scored.
       * 2. Recalculate a mini table using only completed games in which
       *    both teams belong to that bottom-eight group.
       * 3. Rank the mini table by fewest mini-table wins, then fewest
       *    mini-table points scored.
       */
      const tankathonPool = Array.from(stats.values())
        .slice()
        .sort(
          (a, b) =>
            a.wins - b.wins ||
            a.pointsFor - b.pointsFor ||
            a.name.localeCompare(b.name)
        )
        .slice(0, 8);

      const tankathonNames = new Set(
        tankathonPool.map(team => team.name)
      );

      const tankathonStats = new Map(
        tankathonPool.map(team => [
          team.name,
          {
            name: team.name,
            overallWins: team.wins,
            overallLosses: team.losses,
            overallTies: team.ties,
            overallPointsFor: team.pointsFor,
            wins: 0,
            losses: 0,
            ties: 0,
            pointsFor: 0,
            pointsAgainst: 0,
            games: 0
          }
        ])
      );

      completedWeeks.forEach(week => {
        week.matchups.forEach(matchup => {
          const awayName = String(matchup?.away?.name || "");
          const homeName = String(matchup?.home?.name || "");

          if (
            !tankathonNames.has(awayName) ||
            !tankathonNames.has(homeName)
          ) {
            return;
          }

          const awayScore = Number(matchup?.away?.score);
          const homeScore = Number(matchup?.home?.score);
          if (!Number.isFinite(awayScore) || !Number.isFinite(homeScore)) {
            return;
          }

          const awayTeam = tankathonStats.get(awayName);
          const homeTeam = tankathonStats.get(homeName);
          if (!awayTeam || !homeTeam) return;

          awayTeam.games++;
          homeTeam.games++;
          awayTeam.pointsFor += awayScore;
          awayTeam.pointsAgainst += homeScore;
          homeTeam.pointsFor += homeScore;
          homeTeam.pointsAgainst += awayScore;

          if (awayScore > homeScore) {
            awayTeam.wins++;
            homeTeam.losses++;
          } else if (homeScore > awayScore) {
            homeTeam.wins++;
            awayTeam.losses++;
          } else {
            awayTeam.ties++;
            homeTeam.ties++;
          }
        });
      });

      const tankathonRankings = Array.from(tankathonStats.values())
        .sort((a, b) => {
          const aWinRate = a.games
            ? (a.wins + 0.5 * a.ties) / a.games
            : 0;
          const bWinRate = b.games
            ? (b.wins + 0.5 * b.ties) / b.games
            : 0;

          return (
            bWinRate - aWinRate ||
            b.wins - a.wins ||
            b.pointsFor - a.pointsFor ||
            a.name.localeCompare(b.name)
          );
        });

      const projections = Array.from(stats.values())
        .map(team => {
          const expectedLosses = team.remainingGames - team.expectedRemainingWins;
          const projectedWins = team.wins + team.expectedRemainingWins;
          const projectedLosses = team.losses + expectedLosses;
          const avgWinProbability = team.remainingGames
            ? team.expectedRemainingWins / team.remainingGames
            : null;

          return {
            ...team,
            elo: Number(ratings.get(team.name) || 1000),
            projectedWins,
            projectedLosses,
            avgWinProbability,
            projectionScore: projectedWins + 0.5 * team.ties
          };
        })
        .sort(
          (a, b) =>
            b.projectionScore - a.projectionScore ||
            b.elo - a.elo ||
            a.name.localeCompare(b.name)
        );

      const scheduleStrength = Array.from(stats.values())
        .map(team => {
          const scheduleGames = team.scheduleFor + team.scheduleAgainst;
          return {
            ...team,
            difficulty: scheduleGames ? team.scheduleFor / scheduleGames : null
          };
        })
        .sort(
          (a, b) =>
            Number(b.difficulty ?? -1) - Number(a.difficulty ?? -1) ||
            b.scheduleFor - a.scheduleFor ||
            a.name.localeCompare(b.name)
        );

      const expectedRecords = Array.from(stats.values())
        .map(team => {
          const expectedWins = team.expectedRecordWins;
          const expectedLosses = Math.max(
            0,
            team.expectedRecordGames - expectedWins
          );
          const actualWinValue = team.wins + 0.5 * team.ties;

          return {
            ...team,
            expectedWins,
            expectedLosses,
            actualWinValue,
            difference: actualWinValue - expectedWins
          };
        })
        .sort(
          (a, b) =>
            b.expectedWins - a.expectedWins ||
            b.actualWinValue - a.actualWinValue ||
            a.name.localeCompare(b.name)
        );

      const playoffProbabilities = calculatePlayoffProbabilities(
        stats,
        remainingWeeks,
        ratings,
        currentPeriod
      );

      const remainingSos = Array.from(stats.values())
        .map(team => ({
          ...team,
          elo: Number(ratings.get(team.name) || 1000),
          avgWinProbability: team.remainingGames
            ? team.expectedRemainingWins / team.remainingGames
            : null,
          avgOpponentElo: team.remainingGames
            ? team.opponentEloTotal / team.remainingGames
            : null
        }))
        .sort((a, b) => {
          if (a.avgWinProbability === null && b.avgWinProbability !== null) return 1;
          if (a.avgWinProbability !== null && b.avgWinProbability === null) return -1;
          return (
            Number(a.avgWinProbability ?? 1) - Number(b.avgWinProbability ?? 1) ||
            Number(b.avgOpponentElo ?? 0) - Number(a.avgOpponentElo ?? 0) ||
            a.name.localeCompare(b.name)
          );
        });

      return {
        currentPeriod,
        completedWeekCount: completedWeeks.length,
        remainingWeekCount: remainingWeeks.length,
        nextWeekPeriod: nextWeek ? Number(nextWeek.scoringPeriod) : null,
        nextWeekDateRange: nextWeek ? String(nextWeek.dateRange || "") : "",
        nextWeekMatchups,
        projections,
        playoffProbabilities,
        tankathonRankings,
        expectedRecords,
        scheduleStrength,
        remainingSos
      };
    }

    function renderAnalysisRows(items, rowBuilder) {
      return orderForTwoColumnDisplay(items)
        .map((item, displayIndex) => rowBuilder(item, displayIndex))
        .join("");
    }

    function buildWeeklyReview() {
      if (!fantraxSeasonData) return null;

      const period = getCurrentScoringPeriod();
      if (!period) return { period: 0, available: false };

      const week = getSortedSeasonWeeks().find(
        item => Number(item.scoringPeriod) === period
      );

      if (!week || !fantraxWeekHasCompleteScores(week)) {
        return { period, available: false, week };
      }

      const entries = getWeeklyScoreEntries(week)
        .slice()
        .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));

      const leagueAverage = entries.length
        ? entries.reduce((sum, entry) => sum + entry.score, 0) / entries.length
        : 0;

      const scoreRank = new Map(
        entries.map((entry, index) => [entry.name, index + 1])
      );

      const stateTeamMap = new Map(state.teams.map(team => [team.name, team]));
      const previousWeekIndex = Math.max(0, state.currentWeek - 1);
      const previousRatings = new Map(
        state.teams.map(team => [
          team.name,
          getValueForWeek(team, previousWeekIndex)
        ])
      );

      const matchups = [];
      const winners = [];
      const losers = [];

      (week.matchups || []).forEach(matchup => {
        const awayName = String(matchup?.away?.name || "");
        const homeName = String(matchup?.home?.name || "");
        const awayScore = Number(matchup?.away?.score);
        const homeScore = Number(matchup?.home?.score);

        if (
          !awayName ||
          !homeName ||
          !Number.isFinite(awayScore) ||
          !Number.isFinite(homeScore)
        ) return;

        const awayTeam = stateTeamMap.get(awayName);
        const homeTeam = stateTeamMap.get(homeName);
        const awayPreviousElo = Number(previousRatings.get(awayName) || 1000);
        const homePreviousElo = Number(previousRatings.get(homeName) || 1000);
        const awayCurrentElo = getValueForWeek(awayTeam || { elo: [1000] }, state.currentWeek);
        const homeCurrentElo = getValueForWeek(homeTeam || { elo: [1000] }, state.currentWeek);

        const awayProbability = eloWinProbability(awayPreviousElo, homePreviousElo);
        const homeProbability = 1 - awayProbability;

        if (awayScore === homeScore) {
          matchups.push({
            tied: true,
            awayName,
            homeName,
            awayScore,
            homeScore,
            margin: 0,
            awayProbability,
            homeProbability,
            awayEloChange: awayCurrentElo - awayPreviousElo,
            homeEloChange: homeCurrentElo - homePreviousElo
          });
          return;
        }

        const awayWon = awayScore > homeScore;
        const winner = {
          name: awayWon ? awayName : homeName,
          score: awayWon ? awayScore : homeScore,
          probability: awayWon ? awayProbability : homeProbability,
          eloChange: awayWon
            ? awayCurrentElo - awayPreviousElo
            : homeCurrentElo - homePreviousElo
        };
        const loser = {
          name: awayWon ? homeName : awayName,
          score: awayWon ? homeScore : awayScore,
          probability: awayWon ? homeProbability : awayProbability,
          eloChange: awayWon
            ? homeCurrentElo - homePreviousElo
            : awayCurrentElo - awayPreviousElo
        };

        winners.push(winner);
        losers.push(loser);
        matchups.push({
          tied: false,
          awayName,
          homeName,
          awayScore,
          homeScore,
          winner,
          loser,
          margin: Math.abs(awayScore - homeScore),
          winnerProbability: winner.probability,
          winnerScoreRank: scoreRank.get(winner.name) || null,
          loserScoreRank: scoreRank.get(loser.name) || null
        });
      });

      const decided = matchups.filter(matchup => !matchup.tied);
      const closest = decided.length
        ? decided.slice().sort((a, b) => a.margin - b.margin || b.winner.score - a.winner.score)[0]
        : null;
      const blowout = decided.length
        ? decided.slice().sort((a, b) => b.margin - a.margin || b.winner.score - a.winner.score)[0]
        : null;
      const biggestUpset = decided.length
        ? decided.slice().sort((a, b) => a.winnerProbability - b.winnerProbability || b.margin - a.margin)[0]
        : null;
      const highestLoss = losers.length
        ? losers.slice().sort((a, b) => b.score - a.score || a.name.localeCompare(b.name))[0]
        : null;
      const highestScore = entries[0] || null;
      const lowestScore = entries[entries.length - 1] || null;

      const rankData = buildRankData(state.currentWeek);
      const risers = rankData
        .filter(team => team.eloChange > 0)
        .slice()
        .sort((a, b) => b.eloChange - a.eloChange || b.rankMovement - a.rankMovement)
        .slice(0, 3);
      const fallers = rankData
        .filter(team => team.eloChange < 0)
        .slice()
        .sort((a, b) => a.eloChange - b.eloChange || a.rankMovement - b.rankMovement)
        .slice(0, 3);

      const upsetCount = decided.filter(matchup => matchup.winnerProbability < 0.5).length;

      return {
        available: true,
        period,
        week,
        entries,
        leagueAverage,
        matchups,
        closest,
        blowout,
        biggestUpset,
        highestLoss,
        highestScore,
        lowestScore,
        risers,
        fallers,
        upsetCount
      };
    }

    function weeklyTeamMatchupContext(teamName, review) {
      const name = String(teamName || "").trim();
      if (!name || !review?.matchups?.length) return "";

      const matchup = review.matchups.find(item =>
        item.awayName === name || item.homeName === name
      );

      if (!matchup) return "";

      if (matchup.tied) {
        const opponent =
          matchup.awayName === name ? matchup.homeName : matchup.awayName;
        return `as ${name} tied ${opponent}`;
      }

      if (matchup.winner?.name === name) {
        return `as ${name} beat ${matchup.loser.name} by ${formatRating(matchup.margin)} points`;
      }

      if (matchup.loser?.name === name) {
        return `although ${name} lost to ${matchup.winner.name} by ${formatRating(matchup.margin)} points`;
      }

      return "";
    }

    function weeklyPlayerOwner(player) {
      return String(player?.fantasyTeamName || "").trim();
    }

    function weeklyPlayerWithOwner(player) {
      if (!player) return "";
      const owner = weeklyPlayerOwner(player);
      return owner
        ? `${player.name} (${owner})`
        : String(player.name || "");
    }

    function weeklyLeaderNamesWithOwners(leader) {
      const players = leader?.players || [];
      if (!players.length) return "";

      const names = players.map(weeklyPlayerWithOwner);

      if (names.length === 1) return names[0];
      if (names.length === 2) return `${names[0]} and ${names[1]}`;
      return `${names.slice(0, -1).join(", ")}, and ${names[names.length - 1]}`;
    }

    function stableNarrativeIndex(seed, count) {
      const text = String(seed || "");
      let hash = 0;

      for (let i = 0; i < text.length; i++) {
        hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0;
      }

      return Math.abs(hash) % Math.max(1, count);
    }

    function weeklyMatchupForTeam(teamName, review) {
      const name = String(teamName || "").trim();
      if (!name || !review?.matchups?.length) return null;

      const matchup = review.matchups.find(item =>
        item.awayName === name || item.homeName === name
      );

      if (!matchup) return null;

      if (matchup.tied) {
        const opponent =
          matchup.awayName === name ? matchup.homeName : matchup.awayName;

        return {
          result: "tie",
          opponent,
          margin: 0
        };
      }

      if (matchup.winner?.name === name) {
        return {
          result: "win",
          opponent: matchup.loser.name,
          margin: matchup.margin
        };
      }

      if (matchup.loser?.name === name) {
        return {
          result: "loss",
          opponent: matchup.winner.name,
          margin: matchup.margin
        };
      }

      return null;
    }

          templates = [
            `${playerName} led the defensive effort with ${formatRating(statValue)} ${pluralLabel} as ${teamName} beat ${matchup.opponent} by ${formatRating(matchup.margin)} points.`,
            `${playerName} piled up ${formatRating(statValue)} ${pluralLabel}, helping ${teamName} hold off ${matchup.opponent} by ${formatRating(matchup.margin)} points.`,

          ];
        } else if (statKind === "blocks") {
          templates = [

            `Despite ${playerName}'s ${formatRating(statValue)} blocked shots, ${teamName} came up ${formatRating(matchup.margin)} points short against ${matchup.opponent}.`,
            `${playerName} did plenty of defensive work with ${formatRating(statValue)} blocked shots, but ${teamName} still fell to ${matchup.opponent} by ${formatRating(matchup.margin)} points.`,

          ];

        return templates[
          stableNarrativeIndex(

          )
        ];
      }

      if (statKind === "goals") {
        return `${playerName} scored ${formatRating(statValue)} ${pluralLabel} as ${teamName} finished level with ${matchup.opponent}.`;
      }

      if (statKind === "blocks") {
        return `${playerName} recorded ${formatRating(statValue)} ${pluralLabel} as ${teamName} tied ${matchup.opponent}.`;
      }
