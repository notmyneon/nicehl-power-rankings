<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NiceHL Power Rankings</title>
  <style>
    :root {
      --burgundy: #5b0f1a;
      --burgundy-dark: #360810;
      --burgundy-light: #7a1827;
      --silver: #c0c0c0;
      --silver-light: #eeeeee;
      --white: #ffffff;
      --black: #050505;
      --black-soft: #151515;
      --line: rgba(192, 192, 192, 0.45);
      --shadow: 0 18px 42px rgba(0, 0, 0, 0.36);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Aptos, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(91, 15, 26, 0.72), transparent 34%),
        radial-gradient(circle at bottom right, rgba(192, 192, 192, 0.26), transparent 32%),
        var(--black);
      color: var(--white);
      line-height: 1.25;
    }

    .app {
      width: min(1240px, calc(100% - 28px));
      margin: 18px auto 34px;
    }

    .editor {
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(5, 5, 5, 0.94);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .editor-header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(135deg, var(--burgundy), var(--black));
    }

    .hint {
      color: var(--silver-light);
      font-size: 12px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
    }

    button, select, input { font: inherit; }

    button, .file-label {
      border: 1px solid var(--silver);
      color: var(--white);
      background: var(--burgundy);
      font-weight: 800;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
    }

    button.secondary, .file-label.secondary {
      color: var(--white);
      background: var(--black-soft);
      border-color: var(--silver);
    }

    button.danger {
      background: var(--black);
      color: var(--silver-light);
      border-color: var(--silver);
    }

    select, input[type="text"], input[type="number"] {
      color: var(--white);
      background: var(--black-soft);
      border: 1px solid var(--silver);
      border-radius: 9px;
      padding: 8px 9px;
      outline: none;
    }

    select:focus, input:focus {
      border-color: var(--white);
      box-shadow: 0 0 0 2px rgba(192, 192, 192, 0.24);
    }

    input[type="number"] { width: 82px; }
    input.team-name { min-width: 185px; }
    input.manager { min-width: 132px; }
    input.record { width: 76px; }

    .fantrax-status {
      max-width: 250px;
      min-height: 1em;
    }

    .fantrax-status.success { color: #79e49b; }
    .fantrax-status.error { color: #ff8b8b; }

    .data-wrap {
      padding: 12px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th {
      text-align: left;
      color: var(--white);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 9px 8px;
      border-bottom: 1px solid var(--line);
      background: var(--burgundy-dark);
      position: sticky;
      top: 0;
      z-index: 1;
    }

    td {
      padding: 7px 8px;
      border-bottom: 1px solid rgba(192, 192, 192, 0.2);
      vertical-align: middle;
    }

    .hidden { display: none !important; }

    .awards-editor {
      padding: 0 12px 12px;
    }

    .awards-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .award-input-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 9px;
      background: rgba(21, 21, 21, 0.92);
    }

    .award-input-card label {
      display: block;
      margin-bottom: 4px;
      color: var(--silver-light);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.09em;
    }

    .award-input-card input {
      width: 100%;
      margin-bottom: 6px;
    }

    .board-shell {
      border: 2px solid var(--silver);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      background: var(--black);
    }

    .board {
      width: 100%;
      min-height: 790px;
      padding: 18px;
      background:
        linear-gradient(135deg, rgba(91, 15, 26, 0.98), rgba(5, 5, 5, 0.98) 48%, rgba(21, 21, 21, 0.98)),
        repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 13px);
      color: var(--white);
    }

    .board-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 4px 6px 10px;
      border-bottom: 2px solid var(--silver);
    }

    .board-top-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
    }

    .title-lockup {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .league-logo {
      width: 104px;
      height: 104px;
      object-fit: contain;
      border: none;
      background: transparent;
      padding: 0;
      flex: 0 0 auto;
      display: none;
    }

    .league-logo.has-logo {
      display: block;
    }

    .title-text {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 6vw, 72px);
      line-height: 0.88;
      letter-spacing: -0.065em;
      text-transform: uppercase;
    }

    .week-badge {
      min-width: 172px;
      padding: 11px 14px;
      border-radius: 17px;
      text-align: center;
      color: var(--black);
      background: linear-gradient(135deg, var(--white), var(--silver));
      border: 2px solid var(--white);
    }

    .week-badge span {
      display: block;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.13em;
      color: var(--black);
    }

    .week-badge strong {
      display: block;
      margin-top: 3px;
      font-size: 31px;
      line-height: 1;
      color: var(--burgundy);
      letter-spacing: -0.05em;
    }

    .summary-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
      margin: 12px 6px;
    }

    .summary-card {
      min-height: 58px;
      border-radius: 14px;
      padding: 9px 11px;
      background: var(--white);
      border: 1px solid var(--silver);
      color: var(--black);
      overflow: hidden;
    }

    .summary-card span {
      display: block;
      font-size: 9px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      color: var(--burgundy);
    }

    .summary-card strong {
      display: block;
      margin-top: 3px;
      font-size: 16px;
      line-height: 1.04;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .summary-card small {
      display: block;
      margin-top: 2px;
      font-size: 10px;
      color: var(--black-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rankings-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px 9px;
      padding: 0 6px 6px;
    }

    .analysis-stack {
      display: grid;
      gap: 12px;
      margin: 14px 6px 4px;
    }

    .analysis-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px;
      background: rgba(5, 5, 5, 0.72);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .analysis-card-header {
      display: flex;
      align-items: center;
      margin-bottom: 9px;
      padding: 0 2px;
    }

    .analysis-card-header h2 {
      margin: 1px 0 2px;
      font-size: 23px;
      line-height: 1;
      letter-spacing: -0.035em;
      text-transform: uppercase;
    }

    .analysis-card-header p {
      margin: 0;
      color: var(--silver-light);
      font-size: 11px;
    }

    .analysis-eyebrow {
      display: block;
      color: var(--silver);
      font-size: 9px;
      font-weight: 950;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .analysis-chip {
      flex: 0 0 auto;
      border: 1px solid var(--silver);
      border-radius: 999px;
      padding: 5px 8px;
      color: var(--black);
      background: var(--silver-light);
      font-size: 9px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .analysis-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px 8px;
    }

    .matchup-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px 9px;
    }

    .matchup-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 34px minmax(0, 1fr);
      gap: 7px;
      align-items: stretch;
      min-height: 64px;
      padding: 7px;
      border-radius: 13px;
      border: 1px solid rgba(192, 192, 192, 0.48);
      background: linear-gradient(135deg, var(--white), var(--silver-light));
      color: var(--black);
      box-shadow: inset 4px 0 0 var(--burgundy);
    }

    .matchup-side {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto auto;
      gap: 2px 7px;
      align-content: center;
      padding: 2px 3px;
    }

    .matchup-side-right {
      text-align: right;
    }

    .matchup-team {
      min-width: 0;
      font-size: 13px;
      font-weight: 950;
      line-height: 1.04;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .matchup-elo {
      font-size: 9px;
      font-weight: 850;
      color: var(--burgundy);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .matchup-probability {
      grid-row: 1 / 3;
      align-self: center;
      font-size: 20px;
      font-weight: 950;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .matchup-vs {
      display: grid;
      place-items: center;
      color: var(--white);
      background: linear-gradient(135deg, var(--burgundy), var(--black));
      border-radius: 10px;
      font-size: 10px;
      font-weight: 950;
      letter-spacing: 0.08em;
    }

    .analysis-row {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) auto;
      gap: 7px;
      align-items: center;
      min-height: 48px;
      padding: 6px 8px;
      border-radius: 12px;
      border: 1px solid rgba(192, 192, 192, 0.48);
      background: linear-gradient(135deg, var(--white), var(--silver-light));
      color: var(--black);
      overflow: hidden;
      box-shadow: inset 4px 0 0 var(--burgundy);
    }

    .analysis-row.playoff-position {
      box-shadow: inset 4px 0 0 var(--burgundy), 0 0 0 1px rgba(122, 24, 39, 0.28);
    }

    .analysis-position {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: var(--white);
      background: linear-gradient(135deg, var(--burgundy), var(--black));
      font-size: 13px;
      font-weight: 950;
    }

    .analysis-team {
      min-width: 0;
    }

    .analysis-team strong {
      display: block;
      overflow: hidden;
      color: var(--black);
      font-size: 13px;
      line-height: 1.05;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .analysis-team small {
      display: block;
      margin-top: 3px;
      overflow: hidden;
      color: #333;
      font-size: 9px;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .analysis-value {
      min-width: 86px;
      padding-left: 7px;
      border-left: 1px solid var(--silver);
      text-align: right;
    }

    .analysis-value span {
      display: block;
      color: var(--burgundy);
      font-size: 8px;
      font-weight: 950;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .analysis-value strong {
      display: block;
      margin-top: 1px;
      color: var(--black);
      font-size: 18px;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .analysis-empty {
      grid-column: 1 / -1;
      padding: 18px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      color: var(--silver-light);
      background: rgba(21, 21, 21, 0.8);
      text-align: center;
      font-size: 12px;
    }

    .rank-card {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 82px 70px;
      gap: 7px;
      align-items: center;
      min-height: 61px;
      padding: 8px;
      border-radius: 15px;
      background: linear-gradient(135deg, var(--white), var(--silver-light));
      border: 1px solid var(--silver);
      color: var(--black);
      overflow: hidden;
      box-shadow: inset 5px 0 0 var(--burgundy);
    }

    .rank-card.top {
      background: linear-gradient(135deg, var(--silver-light), var(--white));
      border: 2px solid var(--white);
      box-shadow: inset 7px 0 0 var(--burgundy), 0 0 0 1px var(--silver);
    }

    .rank-num {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: var(--white);
      background: linear-gradient(135deg, var(--burgundy), var(--black));
      font-size: 20px;
      font-weight: 950;
      line-height: 1;
    }

    .team-block { min-width: 0; }

    .team-block h3 {
      margin: 0;
      font-size: 17px;
      line-height: 1.02;
      letter-spacing: -0.035em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .team-meta {
      display: flex;
      gap: 5px;
      margin-top: 4px;
      min-width: 0;
      align-items: center;
      color: var(--black);
      font-size: 10px;
      font-weight: 850;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      border-radius: 999px;
      padding: 2px 6px;
      background: var(--silver-light);
      border: 1px solid var(--silver);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric {
      text-align: right;
      border-left: 1px solid var(--silver);
      padding-left: 7px;
    }

    .metric span {
      display: block;
      font-size: 9px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--burgundy);
    }

    .metric strong {
      display: block;
      font-size: 23px;
      line-height: 1;
      letter-spacing: -0.045em;
      margin-top: 2px;
    }

    .movement {
      text-align: center;
      padding: 7px 5px;
      border-radius: 12px;
      border: 1px solid var(--silver);
      background: var(--silver-light);
      color: var(--black);
      font-size: 12px;
      font-weight: 950;
      line-height: 1.05;
      min-height: 39px;
      display: grid;
      place-items: center;
    }

    .movement.up {
      background: var(--burgundy);
      color: var(--white);
      border-color: var(--burgundy-dark);
    }

    .movement.down {
      background: var(--black);
      color: var(--silver-light);
      border-color: var(--black);
    }

    .movement.same {
      background: var(--silver-light);
      color: var(--black);
    }

    .footer-line {
      display: none;
    }

    .screenshot-mode .editor { display: none; }
    .screenshot-mode .app { width: min(1180px, calc(100% - 10px)); margin: 5px auto; }
    .screenshot-mode .board-shell { border-radius: 18px; }
    .screenshot-mode .board { min-height: 760px; padding: 14px; }
    .screenshot-mode h1 { font-size: clamp(42px, 5.4vw, 64px); }
    .screenshot-mode .league-logo { width: 106px; height: 106px; }
    .screenshot-mode .rank-card { min-height: 58px; }

    @media (max-width: 860px) {
      .editor-header, .board-top, .summary-strip, .rankings-grid, .awards-grid, .analysis-list, .matchup-list { grid-template-columns: 1fr; }
      .controls { justify-content: flex-start; }
      .title-lockup { align-items: flex-start; }
      .board-top-right { justify-content: space-between; }
      .league-logo { width: 82px; height: 82px; }
      .analysis-chip { align-self: flex-start; }
      .rank-card { grid-template-columns: 44px 1fr 74px; }
      .movement { grid-column: 1 / -1; }
      h1 { font-size: 44px; }
    }

    @media print {
      @page { size: letter landscape; margin: 0.2in; }
      body {
        background: white !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .editor, .no-print { display: none !important; }
      .app { width: 100%; margin: 0; }
      .board-shell { border-radius: 0; box-shadow: none; }
      .board { min-height: auto; padding: 12px; }
      h1 { font-size: 52px; }
      .summary-strip { margin: 9px 6px; }
      .rank-card { min-height: 56px; padding: 7px; }
      .team-block h3 { font-size: 15px; }
      .metric strong { font-size: 20px; }
      .analysis-stack { gap: 8px; margin-top: 9px; }
      .analysis-card { padding: 9px; }
      .analysis-row { min-height: 43px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="editor">
      <div class="editor-header">
        <div class="controls no-print">
          <label for="weekSelect" class="hint">Rank by:</label>
          <select id="weekSelect"></select>

          <span class="hint">Fantrax:</span>
          <select id="fantraxPeriodSelect" disabled>
            <option>Loading season…</option>
          </select>
          <button id="fantraxLoadButton" type="button" class="secondary" onclick="loadFantraxSeason(false)">Reload Season</button>
          <button id="fantraxImportButton" type="button" onclick="importFantraxThroughWeek()" disabled>Import Through Week</button>
          <span id="fantraxStatus" class="hint fantrax-status"></span>

          <button type="button" onclick="addTeam()">Add Team</button>
          <button type="button" onclick="addWeek()">Add Week</button>
          <button type="button" onclick="updateFromTable()">Update</button>
          <label class="file-label secondary" for="logoFile">Choose Logo</label>
          <input id="logoFile" class="hidden" type="file" accept="image/*" onchange="importLogo(event)" />
          <button type="button" class="secondary" onclick="removeLogo()">Remove Logo</button>
          <button type="button" class="secondary" onclick="toggleScreenshotMode()">Screenshot Mode</button>
          <button type="button" class="secondary" onclick="downloadData()">Export</button>
          <label class="file-label secondary" for="importFile">Import</label>
          <input id="importFile" class="hidden" type="file" accept="application/json" onchange="importData(event)" />
          <button type="button" class="secondary" onclick="window.print()">Print/PDF</button>
          <button type="button" class="danger" onclick="resetSample()">Reset</button>
        </div>
      </div>
      <div class="data-wrap">
        <table id="inputTable" aria-label="Team ELO input table"></table>
      </div>
      <div class="awards-editor no-print" id="awardsEditor"></div>
    </section>

    <section class="board-shell" id="captureArea">
      <div class="board">
        <div class="board-top">
          <div class="title-lockup">
            <img id="leagueLogo" class="league-logo" alt="NiceHL logo" />
            <div class="title-text">
              <h1 id="leagueTitle" contenteditable="true">NiceHL Power Rankings</h1>
            </div>
          </div>
          <div class="board-top-right">
            <div class="week-badge">
              <span>Current Week</span>
              <strong id="heroWeek">Week 0</strong>
            </div>
          </div>
        </div>

        <div class="summary-strip" id="summaryStrip"></div>
        <div class="rankings-grid" id="rankings"></div>

        <div class="analysis-stack" id="analysisStack">
          <section class="analysis-card">
            <div class="analysis-card-header">
              <h2 id="nextWeekTitle">Next Week Win Probabilities</h2>
            </div>
            <div class="matchup-list" id="nextWeekMatchups"></div>
          </section>

          <section class="analysis-card">
            <div class="analysis-card-header">
              <h2>Projected Standings</h2>
            </div>
            <div class="analysis-list" id="projectedStandings"></div>
          </section>

          <section class="analysis-card">
            <div class="analysis-card-header">
              <h2>Expected Record</h2>
            </div>
            <div class="analysis-list" id="expectedRecord"></div>
          </section>

          <section class="analysis-card">
            <div class="analysis-card-header">
              <h2>Schedule Strength So Far</h2>
            </div>
            <div class="analysis-list" id="scheduleStrength"></div>
          </section>

          <section class="analysis-card">
            <div class="analysis-card-header">
              <h2>Remaining Strength of Schedule</h2>
            </div>
            <div class="analysis-list" id="remainingSchedule"></div>
          </section>
        </div>

        <div class="footer-line">
          <span id="rankSubhead"></span>
        </div>
      </div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "niceHLEloPowerRankings_v7_fantrax_import";
    const FANTRAX_DATA_URL = "./data/nicehl-2025-26-regular-season.json";

    const DEFAULT_AWARDS = [
      { title: "Most Points in a Loss", winner: "", detail: "" },
      { title: "Least Points in a Win", winner: "", detail: "" },
      { title: "Narrowest Win", winner: "", detail: "" },
      { title: "Biggest Underdog Win", winner: "", detail: "" }
    ];

    const NICEHL_TEAMS = [
      "Alberta Cobra Chickens",
      "Bowness Ice Beavers",
      "Cantuar Slough Sharks",
      "Driftless Hockey Club",
      "Les Rois de Lyon",
      "Maplewood HC",
      "Mt. Pearl Vikings",
      "Pennant Pumpjacks",
      "Potomac Poutine",
      "Rockaway Brattwursts",
      "Rotterdam Red Foxes",
      "Scotty",
      "Southside Hellbats",
      "Steel Valley Fishercats",
      "Synth City Sphynx",
      "Woodland Whistle Pigs"
    ];

    const defaultState = {
      currentWeek: 0,
      weeks: ["Week 0"],
      teams: NICEHL_TEAMS.map(name => ({
        name,
        manager: "",
        record: "0-0",
        recordHistory: ["0-0"],
        elo: [1000]
      })),
      awards: structuredCloneSafe(DEFAULT_AWARDS),
      awardsByWeek: [structuredCloneSafe(DEFAULT_AWARDS)],
      logoDataUrl: "",
      fantraxMeta: null
    };

    let state = structuredCloneSafe(defaultState);
    let fantraxSeasonData = null;

    function structuredCloneSafe(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function fullWeekLabel(label) {
      const match = String(label || "").match(/^W(\d+)$/i);
      if (match) return `Week ${match[1]}`;
      return label || "Week 0";
    }

    function normalizeAwards(source) {
      const input = Array.isArray(source) ? source : [];
      return DEFAULT_AWARDS.map((defaultAward, index) => {
        const award = input[index] || defaultAward;
        return {
          title: String(award?.title || defaultAward.title),
          winner: String(award?.winner || ""),
          detail: String(award?.detail || "")
        };
      });
    }

    function cleanState(input) {
      const weeksRaw =
        Array.isArray(input?.weeks) && input.weeks.length
          ? input.weeks.map(String)
          : structuredCloneSafe(defaultState.weeks);

      const weeks = weeksRaw.map(fullWeekLabel);
      const currentWeek = Math.max(
        0,
        Math.min(Number(input?.currentWeek || 0), weeks.length - 1)
      );

      const sourceTeams =
        Array.isArray(input?.teams) && input.teams.length
          ? input.teams
          : structuredCloneSafe(defaultState.teams);

      const teams = sourceTeams.map((team, index) => {
        const legacyRecord = String(team?.record || "0-0");
        const recordHistory = weeks.map((_, weekIndex) => {
          const savedRecord = team?.recordHistory?.[weekIndex];
          if (savedRecord !== undefined && savedRecord !== null) {
            return String(savedRecord);
          }
          if (weekIndex === 0) return "0-0";
          return legacyRecord;
        });

        return {
          name: String(team?.name || `Team ${index + 1}`),
          manager: String(team?.manager || ""),
          record: String(recordHistory[currentWeek] || legacyRecord),
          recordHistory,
          elo: weeks.map((_, weekIndex) => {
            const value = Number(team?.elo?.[weekIndex]);
            return Number.isFinite(value) ? value : null;
          }),
          fantraxTeamId: String(team?.fantraxTeamId || ""),
          teamLogoUrl: String(team?.teamLogoUrl || "")
        };
      });

      let awardsByWeek;
      if (Array.isArray(input?.awardsByWeek) && input.awardsByWeek.length) {
        awardsByWeek = weeks.map((_, weekIndex) =>
          normalizeAwards(input.awardsByWeek[weekIndex])
        );
      } else {
        const legacyAwards = normalizeAwards(input?.awards);
        awardsByWeek = weeks.map((_, weekIndex) =>
          weekIndex === currentWeek
            ? structuredCloneSafe(legacyAwards)
            : structuredCloneSafe(DEFAULT_AWARDS)
        );
      }

      return {
        currentWeek,
        weeks,
        teams,
        awards: normalizeAwards(awardsByWeek[currentWeek]),
        awardsByWeek,
        logoDataUrl: String(input?.logoDataUrl || ""),
        fantraxMeta:
          input?.fantraxMeta && typeof input.fantraxMeta === "object"
            ? structuredCloneSafe(input.fantraxMeta)
            : null
      };
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          state = cleanState(JSON.parse(saved));
          return;
        }
      } catch (error) {
        console.warn("Could not load saved rankings.", error);
      }
      state = cleanState(defaultState);
    }

    function saveState() {
      try {
        state.awards = normalizeAwards(state.awardsByWeek[state.currentWeek]);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(cleanState(state)));
      } catch (error) {
        console.warn("Could not save rankings.", error);
      }
    }

    function getRecordForWeek(team, weekIndex) {
      const exact = team?.recordHistory?.[weekIndex];
      if (exact !== undefined && exact !== null && String(exact).trim()) {
        return String(exact);
      }

      for (let i = weekIndex - 1; i >= 0; i--) {
        const previous = team?.recordHistory?.[i];
        if (previous !== undefined && previous !== null && String(previous).trim()) {
          return String(previous);
        }
      }

      return String(team?.record || "0-0");
    }

    function getAwardsForWeek(weekIndex = state.currentWeek) {
      if (!Array.isArray(state.awardsByWeek)) state.awardsByWeek = [];
      if (!state.awardsByWeek[weekIndex]) {
        state.awardsByWeek[weekIndex] = structuredCloneSafe(DEFAULT_AWARDS);
      }
      return state.awardsByWeek[weekIndex];
    }

    function renderWeekSelect() {
      const select = document.getElementById("weekSelect");
      select.innerHTML = "";

      state.weeks.forEach((week, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = fullWeekLabel(week);
        if (index === state.currentWeek) option.selected = true;
        select.appendChild(option);
      });

      select.onchange = () => {
        updateFromTableSilently();
        state.currentWeek = Number(select.value);
        state.awards = normalizeAwards(getAwardsForWeek(state.currentWeek));
        saveState();
        renderInputTable();
        renderAwardsEditor();
        renderRankings();
      };
    }

    function renderLogo() {
      const logo = document.getElementById("leagueLogo");
      if (!logo) return;

      if (state.logoDataUrl) {
        logo.src = state.logoDataUrl;
        logo.classList.add("has-logo");
      } else {
        logo.removeAttribute("src");
        logo.classList.remove("has-logo");
      }
    }

    function importLogo(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = e => {
        state.logoDataUrl = String(e.target.result || "");
        saveState();
        renderLogo();
      };
      reader.readAsDataURL(file);
      event.target.value = "";
    }

    function removeLogo() {
      state.logoDataUrl = "";
      saveState();
      renderLogo();
    }

    function renderAwardsEditor() {
      const editor = document.getElementById("awardsEditor");
      if (!editor) return;

      const awards = getAwardsForWeek(state.currentWeek);
      editor.innerHTML = `
        <div class="awards-grid">
          ${awards.map((award, index) => `
            <div class="award-input-card">
              <label>Award ${index + 1}</label>
              <input type="text" value="${escapeAttribute(award.title)}" data-award="${index}" data-award-field="title" placeholder="Award title" />
              <input type="text" value="${escapeAttribute(award.winner)}" data-award="${index}" data-award-field="winner" placeholder="Winner / team" />
              <input type="text" value="${escapeAttribute(award.detail)}" data-award="${index}" data-award-field="detail" placeholder="Details" />
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderInputTable() {
      const table = document.getElementById("inputTable");
      const weekHeaders = state.weeks
        .map(week => `<th>${escapeHtml(fullWeekLabel(week))}</th>`)
        .join("");

      table.innerHTML = `
        <thead>
          <tr>
            <th>Team</th>
            <th>Manager</th>
            <th>${escapeHtml(fullWeekLabel(state.weeks[state.currentWeek]))} Record</th>
            ${weekHeaders}
            <th class="no-print">Remove</th>
          </tr>
        </thead>
        <tbody>
          ${state.teams.map((team, rowIndex) => `
            <tr>
              <td><input class="team-name" type="text" value="${escapeAttribute(team.name)}" data-row="${rowIndex}" data-field="name" /></td>
              <td><input class="manager" type="text" value="${escapeAttribute(team.manager || "")}" data-row="${rowIndex}" data-field="manager" /></td>
              <td><input class="record" type="text" value="${escapeAttribute(getRecordForWeek(team, state.currentWeek))}" data-row="${rowIndex}" data-field="record-current" /></td>
              ${state.weeks.map((_, weekIndex) => `
                <td>
                  <input
                    type="number"
                    step="0.5"
                    value="${Number.isFinite(Number(team.elo?.[weekIndex])) ? team.elo[weekIndex] : ""}"
                    data-row="${rowIndex}"
                    data-week="${weekIndex}"
                  />
                </td>
              `).join("")}
              <td class="no-print"><button type="button" class="secondary" onclick="removeTeam(${rowIndex})">Remove</button></td>
            </tr>
          `).join("")}
        </tbody>
      `;
    }

    function updateFromTable() {
      updateFromTableSilently();
      state.currentWeek = Number(document.getElementById("weekSelect").value);
      state.awards = normalizeAwards(getAwardsForWeek(state.currentWeek));
      saveState();
      renderAll();
    }

    function updateFromTableSilently() {
      const table = document.getElementById("inputTable");
      if (!table || !table.querySelector("input")) return;

      const inputs = document.querySelectorAll("#inputTable input");
      inputs.forEach(input => {
        const row = Number(input.dataset.row);
        if (!state.teams[row]) return;

        if (input.dataset.field === "name" || input.dataset.field === "manager") {
          state.teams[row][input.dataset.field] = input.value.trim();
        }

        if (input.dataset.field === "record-current") {
          if (!Array.isArray(state.teams[row].recordHistory)) {
            state.teams[row].recordHistory = state.weeks.map(() => "0-0");
          }
          state.teams[row].recordHistory[state.currentWeek] =
            input.value.trim() || "0-0";
          state.teams[row].record =
            state.teams[row].recordHistory[state.currentWeek];
        }

        if (input.dataset.week !== undefined) {
          const week = Number(input.dataset.week);
          const value = input.value === "" ? null : Number(input.value);
          state.teams[row].elo[week] = Number.isFinite(value) ? value : null;
        }
      });

      const awards = getAwardsForWeek(state.currentWeek);
      const awardInputs = document.querySelectorAll("#awardsEditor input");
      awardInputs.forEach(input => {
        const index = Number(input.dataset.award);
        const field = input.dataset.awardField;
        if (!awards[index] || !field) return;
        awards[index][field] = input.value.trim();
      });
      state.awards = normalizeAwards(awards);
    }

    function addTeam() {
      updateFromTableSilently();
      state.teams.push({
        name: "New Team",
        manager: "",
        record: "0-0",
        recordHistory: state.weeks.map(() => "0-0"),
        elo: state.weeks.map((_, index) => (index === 0 ? 1000 : null)),
        fantraxTeamId: "",
        teamLogoUrl: ""
      });
      saveState();
      renderAll();
    }

    function removeTeam(index) {
      updateFromTableSilently();
      state.teams.splice(index, 1);
      saveState();
      renderAll();
    }

    function addWeek() {
      updateFromTableSilently();
      const nextNumber = state.weeks.length;
      state.weeks.push(`Week ${nextNumber}`);

      state.teams.forEach(team => {
        team.elo.push(null);
        if (!Array.isArray(team.recordHistory)) team.recordHistory = ["0-0"];
        const previousRecord =
          team.recordHistory[team.recordHistory.length - 1] || team.record || "0-0";
        team.recordHistory.push(previousRecord);
      });

      state.awardsByWeek.push(structuredCloneSafe(DEFAULT_AWARDS));
      state.currentWeek = state.weeks.length - 1;
      saveState();
      renderAll();
    }

    function getValueForWeek(team, weekIndex) {
      const exact = Number(team.elo?.[weekIndex]);
      if (Number.isFinite(exact)) return exact;

      for (let i = weekIndex - 1; i >= 0; i--) {
        const previous = Number(team.elo?.[i]);
        if (Number.isFinite(previous)) return previous;
      }

      return 0;
    }

    function buildRankData(weekIndex) {
      const current = state.teams
        .map((team, index) => ({
          ...team,
          originalIndex: index,
          displayRecord: getRecordForWeek(team, weekIndex),
          currentElo: getValueForWeek(team, weekIndex),
          previousElo:
            weekIndex > 0
              ? getValueForWeek(team, weekIndex - 1)
              : getValueForWeek(team, weekIndex)
        }))
        .sort(
          (a, b) =>
            b.currentElo - a.currentElo || a.name.localeCompare(b.name)
        );

      const previous = state.teams
        .map((team, index) => ({
          originalIndex: index,
          value:
            weekIndex > 0
              ? getValueForWeek(team, weekIndex - 1)
              : getValueForWeek(team, weekIndex)
        }))
        .sort(
          (a, b) =>
            b.value - a.value || a.originalIndex - b.originalIndex
        );

      const prevRanks = new Map();
      previous.forEach((team, index) =>
        prevRanks.set(team.originalIndex, index + 1)
      );

      return current.map((team, index) => {
        const rank = index + 1;
        const prevRank = prevRanks.get(team.originalIndex) || rank;
        const rankMovement = prevRank - rank;
        const eloChange = team.currentElo - team.previousElo;
        return {
          ...team,
          rank,
          prevRank,
          rankMovement,
          eloChange
        };
      });
    }

    function movementText(rankMovement) {
      if (rankMovement > 0) return `▲ ${rankMovement}`;
      if (rankMovement < 0) return `▼ ${Math.abs(rankMovement)}`;
      return "—";
    }

    function movementClass(rankMovement) {
      if (rankMovement > 0) return "up";
      if (rankMovement < 0) return "down";
      return "same";
    }

    function formatChange(value) {
      const rounded = Math.round(value * 10) / 10;
      if (rounded > 0) return `+${rounded}`;
      return `${rounded}`;
    }

    function formatRating(value) {
      const rounded = Math.round(value * 10) / 10;
      return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
    }

    function orderForTwoColumnDisplay(data) {
      const splitPoint = Math.ceil(data.length / 2);
      const left = data.slice(0, splitPoint);
      const right = data.slice(splitPoint);
      const ordered = [];
      const maxRows = Math.max(left.length, right.length);

      for (let i = 0; i < maxRows; i++) {
        if (left[i]) ordered.push(left[i]);
        if (right[i]) ordered.push(right[i]);
      }

      return ordered;
    }

    function getCurrentScoringPeriod() {
      const label = String(state.weeks[state.currentWeek] || "Week 0");
      const match = label.match(/(\d+)/);
      return match ? Number(match[1]) : 0;
    }

    function getSortedSeasonWeeks() {
      if (!fantraxSeasonData?.weeks) return [];
      return fantraxSeasonData.weeks
        .slice()
        .sort((a, b) => Number(a.scoringPeriod) - Number(b.scoringPeriod));
    }

    function eloWinProbability(teamElo, opponentElo) {
      const own = Number(teamElo);
      const opponent = Number(opponentElo);
      if (!Number.isFinite(own) || !Number.isFinite(opponent)) return 0.5;
      return 1 / (1 + Math.pow(10, (opponent - own) / 400));
    }

    function formatPercent(value) {
      if (!Number.isFinite(Number(value))) return "—";
      return `${(Number(value) * 100).toFixed(1)}%`;
    }

    function formatProjectedNumber(value) {
      const rounded = Math.round(Number(value) * 10) / 10;
      return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
    }

    function formatProjectedRecord(wins, losses, ties = 0) {
      const base = `${formatProjectedNumber(wins)}–${formatProjectedNumber(losses)}`;
      return ties ? `${base}–${ties}` : base;
    }

    function formatAllPlayRecord(wins, losses) {
      return `${formatProjectedNumber(wins)}–${formatProjectedNumber(losses)}`;
    }

    function formatExpectedRecord(wins, losses) {
      return `${Number(wins).toFixed(2)}–${Number(losses).toFixed(2)}`;
    }

    function formatExpectedDifference(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return "—";
      const sign = number > 0 ? "+" : "";
      return `${sign}${number.toFixed(2)}`;
    }

    function buildSeasonAnalysis() {
      if (!fantraxSeasonData) return null;

      const currentPeriod = getCurrentScoringPeriod();
      const seasonWeeks = getSortedSeasonWeeks();
      const completedWeeks = seasonWeeks.filter(
        week => Number(week.scoringPeriod) <= currentPeriod
      );
      const remainingWeeks = seasonWeeks.filter(
        week => Number(week.scoringPeriod) > currentPeriod
      );
      const nextWeek = remainingWeeks.length ? remainingWeeks[0] : null;

      const teamNames = fantraxSeasonData.teams.map(team => String(team.name));
      const stateTeamMap = new Map(state.teams.map(team => [team.name, team]));
      const ratings = new Map(
        teamNames.map(name => [
          name,
          getValueForWeek(stateTeamMap.get(name) || { elo: [1000] }, state.currentWeek)
        ])
      );

      const nextWeekMatchups = nextWeek
        ? nextWeek.matchups
            .map(matchup => {
              const awayName = String(matchup?.away?.name || "");
              const homeName = String(matchup?.home?.name || "");
              if (!awayName || !homeName) return null;

              const awayElo = Number(ratings.get(awayName) || 1000);
              const homeElo = Number(ratings.get(homeName) || 1000);
              const awayProbability = eloWinProbability(awayElo, homeElo);

              return {
                awayName,
                homeName,
                awayElo,
                homeElo,
                awayProbability,
                homeProbability: 1 - awayProbability
              };
            })
            .filter(Boolean)
        : [];

      const stats = new Map(
        teamNames.map(name => [
          name,
          {
            name,
            wins: 0,
            losses: 0,
            ties: 0,
            allPlayFor: 0,
            allPlayAgainst: 0,
            scheduleFor: 0,
            scheduleAgainst: 0,
            expectedRemainingWins: 0,
            remainingGames: 0,
            opponentEloTotal: 0,
            expectedRecordWins: 0,
            expectedRecordGames: 0,
            offensiveExpectedWins: 0,
            defensiveExpectedWins: 0
          }
        ])
      );

      completedWeeks.forEach(week => {
        const entries = getWeeklyScoreEntries(week);
        const scoreMap = new Map(entries.map(entry => [entry.name, entry.score]));
        const teamCount = entries.length;
        const maxRankPoints = Math.max(0, teamCount - 1);
        const weeklyRankPoints = new Map();

        entries.forEach(entry => {
          // Match the workbook's rank-points method: highest score earns 15,
          // lowest earns 0, and equal scores share the same RANK.EQ position.
          const rankPoints = entries.reduce(
            (total, other) => total + (other.score <= entry.score ? 1 : 0),
            -1
          );
          weeklyRankPoints.set(entry.name, rankPoints);

          const team = stats.get(entry.name);
          if (team) {
            team.allPlayFor += rankPoints;
            team.allPlayAgainst += maxRankPoints - rankPoints;
          }
        });

        week.matchups.forEach(matchup => {
          const awayName = String(matchup?.away?.name || "");
          const homeName = String(matchup?.home?.name || "");
          const awayScore = Number(scoreMap.get(awayName));
          const homeScore = Number(scoreMap.get(homeName));
          const awayStats = stats.get(awayName);
          const homeStats = stats.get(homeName);

          if (!awayStats || !homeStats) return;

          if (awayScore > homeScore) {
            awayStats.wins++;
            homeStats.losses++;
          } else if (homeScore > awayScore) {
            homeStats.wins++;
            awayStats.losses++;
          } else if (Number.isFinite(awayScore) && Number.isFinite(homeScore)) {
            awayStats.ties++;
            homeStats.ties++;
          }

          const awayOpponentRank = Number(weeklyRankPoints.get(homeName) || 0);
          const homeOpponentRank = Number(weeklyRankPoints.get(awayName) || 0);

          awayStats.scheduleFor += awayOpponentRank;
          awayStats.scheduleAgainst += maxRankPoints - awayOpponentRank;
          homeStats.scheduleFor += homeOpponentRank;
          homeStats.scheduleAgainst += maxRankPoints - homeOpponentRank;

          /*
           * Expected Record
           *
           * Offensive component:
           *   the team's own weekly all-play wins divided by 15.
           *
           * Defensive component:
           *   the inverse of its opponent's weekly all-play wins.
           *   Facing the week's highest scorer produces 0.00 defensive wins;
           *   facing the lowest scorer produces 1.00 defensive wins.
           *
           * Weekly expected wins are the average of those two components.
           */
          if (maxRankPoints > 0) {
            const awayOwnRank = Number(weeklyRankPoints.get(awayName) || 0);
            const homeOwnRank = Number(weeklyRankPoints.get(homeName) || 0);

            const awayOffensiveWins = awayOwnRank / maxRankPoints;
            const awayDefensiveWins =
              (maxRankPoints - homeOwnRank) / maxRankPoints;
            const homeOffensiveWins = homeOwnRank / maxRankPoints;
            const homeDefensiveWins =
              (maxRankPoints - awayOwnRank) / maxRankPoints;

            awayStats.offensiveExpectedWins += awayOffensiveWins;
            awayStats.defensiveExpectedWins += awayDefensiveWins;
            awayStats.expectedRecordWins +=
              (awayOffensiveWins + awayDefensiveWins) / 2;
            awayStats.expectedRecordGames++;

            homeStats.offensiveExpectedWins += homeOffensiveWins;
            homeStats.defensiveExpectedWins += homeDefensiveWins;
            homeStats.expectedRecordWins +=
              (homeOffensiveWins + homeDefensiveWins) / 2;
            homeStats.expectedRecordGames++;
          }
        });
      });

      remainingWeeks.forEach(week => {
        week.matchups.forEach(matchup => {
          const awayName = String(matchup?.away?.name || "");
          const homeName = String(matchup?.home?.name || "");
          const awayStats = stats.get(awayName);
          const homeStats = stats.get(homeName);
          if (!awayStats || !homeStats) return;

          const awayElo = Number(ratings.get(awayName) || 1000);
          const homeElo = Number(ratings.get(homeName) || 1000);
          const awayProbability = eloWinProbability(awayElo, homeElo);
          const homeProbability = eloWinProbability(homeElo, awayElo);

          awayStats.expectedRemainingWins += awayProbability;
          awayStats.remainingGames++;
          awayStats.opponentEloTotal += homeElo;

          homeStats.expectedRemainingWins += homeProbability;
          homeStats.remainingGames++;
          homeStats.opponentEloTotal += awayElo;
        });
      });

      const projections = Array.from(stats.values())
        .map(team => {
          const expectedLosses = team.remainingGames - team.expectedRemainingWins;
          const projectedWins = team.wins + team.expectedRemainingWins;
          const projectedLosses = team.losses + expectedLosses;
          const avgWinProbability = team.remainingGames
            ? team.expectedRemainingWins / team.remainingGames
            : null;

          return {
            ...team,
            elo: Number(ratings.get(team.name) || 1000),
            projectedWins,
            projectedLosses,
            avgWinProbability,
            projectionScore: projectedWins + 0.5 * team.ties
          };
        })
        .sort(
          (a, b) =>
            b.projectionScore - a.projectionScore ||
            b.elo - a.elo ||
            a.name.localeCompare(b.name)
        );

      const scheduleStrength = Array.from(stats.values())
        .map(team => {
          const scheduleGames = team.scheduleFor + team.scheduleAgainst;
          return {
            ...team,
            difficulty: scheduleGames ? team.scheduleFor / scheduleGames : null
          };
        })
        .sort(
          (a, b) =>
            Number(b.difficulty ?? -1) - Number(a.difficulty ?? -1) ||
            b.scheduleFor - a.scheduleFor ||
            a.name.localeCompare(b.name)
        );

      const expectedRecords = Array.from(stats.values())
        .map(team => {
          const expectedWins = team.expectedRecordWins;
          const expectedLosses = Math.max(
            0,
            team.expectedRecordGames - expectedWins
          );
          const actualWinValue = team.wins + 0.5 * team.ties;

          return {
            ...team,
            expectedWins,
            expectedLosses,
            actualWinValue,
            difference: actualWinValue - expectedWins
          };
        })
        .sort(
          (a, b) =>
            b.expectedWins - a.expectedWins ||
            b.actualWinValue - a.actualWinValue ||
            a.name.localeCompare(b.name)
        );

      const remainingSos = Array.from(stats.values())
        .map(team => ({
          ...team,
          elo: Number(ratings.get(team.name) || 1000),
          avgWinProbability: team.remainingGames
            ? team.expectedRemainingWins / team.remainingGames
            : null,
          avgOpponentElo: team.remainingGames
            ? team.opponentEloTotal / team.remainingGames
            : null
        }))
        .sort((a, b) => {
          if (a.avgWinProbability === null && b.avgWinProbability !== null) return 1;
          if (a.avgWinProbability !== null && b.avgWinProbability === null) return -1;
          return (
            Number(a.avgWinProbability ?? 1) - Number(b.avgWinProbability ?? 1) ||
            Number(b.avgOpponentElo ?? 0) - Number(a.avgOpponentElo ?? 0) ||
            a.name.localeCompare(b.name)
          );
        });

      return {
        currentPeriod,
        completedWeekCount: completedWeeks.length,
        remainingWeekCount: remainingWeeks.length,
        nextWeekPeriod: nextWeek ? Number(nextWeek.scoringPeriod) : null,
        nextWeekDateRange: nextWeek ? String(nextWeek.dateRange || "") : "",
        nextWeekMatchups,
        projections,
        expectedRecords,
        scheduleStrength,
        remainingSos
      };
    }

    function renderAnalysisRows(items, rowBuilder) {
      return orderForTwoColumnDisplay(items)
        .map((item, displayIndex) => rowBuilder(item, displayIndex))
        .join("");
    }

    function renderAnalysisCards() {
      const nextWeekTitle = document.getElementById("nextWeekTitle");
      const nextWeekMatchups = document.getElementById("nextWeekMatchups");
      const projected = document.getElementById("projectedStandings");
      const expected = document.getElementById("expectedRecord");
      const schedule = document.getElementById("scheduleStrength");
      const remaining = document.getElementById("remainingSchedule");
      const remainingChip = document.getElementById("remainingGamesChip");

      if (
        !nextWeekTitle ||
        !nextWeekMatchups ||
        !projected ||
        !expected ||
        !schedule ||
        !remaining
      ) return;

      const analysis = buildSeasonAnalysis();
      if (!analysis) {
        const loading = '<div class="analysis-empty">Loading Fantrax season data…</div>';
        nextWeekMatchups.innerHTML = loading;
        projected.innerHTML = loading;
        expected.innerHTML = loading;
        schedule.innerHTML = loading;
        remaining.innerHTML = loading;
        return;
      }

      if (
        analysis.nextWeekPeriod === null ||
        !analysis.nextWeekMatchups.length
      ) {
        nextWeekTitle.textContent = "Next Week Win Probabilities";
        nextWeekMatchups.innerHTML =
          '<div class="analysis-empty">No later regular-season matchups after this selected week.</div>';
      } else {
        nextWeekTitle.textContent =
          `Week ${analysis.nextWeekPeriod} Win Probabilities`;

        nextWeekMatchups.innerHTML = analysis.nextWeekMatchups
          .map(matchup => `
            <div class="matchup-row">
              <div class="matchup-side">
                <div class="matchup-team" title="${escapeAttribute(matchup.awayName)}">${escapeHtml(matchup.awayName)}</div>
                <div class="matchup-elo">ELO ${formatRating(matchup.awayElo)}</div>
                <div class="matchup-probability">${formatPercent(matchup.awayProbability)}</div>
              </div>
              <div class="matchup-vs">VS</div>
              <div class="matchup-side matchup-side-right">
                <div class="matchup-team" title="${escapeAttribute(matchup.homeName)}">${escapeHtml(matchup.homeName)}</div>
                <div class="matchup-elo">ELO ${formatRating(matchup.homeElo)}</div>
                <div class="matchup-probability">${formatPercent(matchup.homeProbability)}</div>
              </div>
            </div>
          `)
          .join("");
      }

      const projectedRanked = analysis.projections.map((team, index) => ({
        ...team,
        rank: index + 1
      }));

      projected.innerHTML = renderAnalysisRows(projectedRanked, team => `
        <div class="analysis-row ${team.rank <= 8 ? "playoff-position" : ""}">
          <div class="analysis-position">${team.rank}</div>
          <div class="analysis-team">
            <strong title="${escapeAttribute(team.name)}">${escapeHtml(team.name)}</strong>
            <small>Current ${recordText(team)} · ${team.remainingGames} game${team.remainingGames === 1 ? "" : "s"} left${team.rank <= 8 ? " · Playoff position" : ""}</small>
          </div>
          <div class="analysis-value">
            <span>Projected</span>
            <strong>${formatProjectedRecord(team.projectedWins, team.projectedLosses, team.ties)}</strong>
          </div>
        </div>
      `);

      if (analysis.completedWeekCount === 0) {
        expected.innerHTML =
          '<div class="analysis-empty">Import at least one completed week to calculate expected records.</div>';
      } else {
        const expectedRanked = analysis.expectedRecords.map((team, index) => ({
          ...team,
          rank: index + 1
        }));

        expected.innerHTML = renderAnalysisRows(expectedRanked, team => `
          <div class="analysis-row">
            <div class="analysis-position">${team.rank}</div>
            <div class="analysis-team">
              <strong title="${escapeAttribute(team.name)}">${escapeHtml(team.name)}</strong>
              <small>Actual ${recordText(team)} · Own-score EW ${team.offensiveExpectedWins.toFixed(2)} · Points-against EW ${team.defensiveExpectedWins.toFixed(2)} · ${formatExpectedDifference(team.difference)} vs expected</small>
            </div>
            <div class="analysis-value">
              <span>Expected</span>
              <strong>${formatExpectedRecord(team.expectedWins, team.expectedLosses)}</strong>
            </div>
          </div>
        `);
      }

      if (analysis.completedWeekCount === 0) {
        schedule.innerHTML = '<div class="analysis-empty">Import at least one completed week to calculate score-based schedule strength.</div>';
      } else {
        const scheduleRanked = analysis.scheduleStrength.map((team, index) => ({
          ...team,
          rank: index + 1
        }));

        schedule.innerHTML = renderAnalysisRows(scheduleRanked, team => `
          <div class="analysis-row">
            <div class="analysis-position">${team.rank}</div>
            <div class="analysis-team">
              <strong title="${escapeAttribute(team.name)}">${escapeHtml(team.name)}</strong>
              <small>Opponents ${formatAllPlayRecord(team.scheduleFor, team.scheduleAgainst)} all-play · Team ${formatAllPlayRecord(team.allPlayFor, team.allPlayAgainst)}</small>
            </div>
            <div class="analysis-value">
              <span>Difficulty</span>
              <strong>${formatPercent(team.difficulty)}</strong>
            </div>
          </div>
        `);
      }

      const maxRemainingGames = Math.max(
        0,
        ...analysis.remainingSos.map(team => team.remainingGames)
      );
      if (remainingChip) {
        remainingChip.textContent = maxRemainingGames
          ? `${maxRemainingGames} max games left`
          : "Season complete";
      }

      if (!maxRemainingGames) {
        remaining.innerHTML = '<div class="analysis-empty">No remaining regular-season games after this selected week.</div>';
      } else {
        const remainingRanked = analysis.remainingSos.map((team, index) => ({
          ...team,
          rank: index + 1
        }));

        remaining.innerHTML = renderAnalysisRows(remainingRanked, team => `
          <div class="analysis-row">
            <div class="analysis-position">${team.rank}</div>
            <div class="analysis-team">
              <strong title="${escapeAttribute(team.name)}">${escapeHtml(team.name)}</strong>
              <small>${team.remainingGames} game${team.remainingGames === 1 ? "" : "s"} · Avg opponent ELO ${formatRating(team.avgOpponentElo)}</small>
            </div>
            <div class="analysis-value">
              <span>Avg win odds</span>
              <strong>${formatPercent(team.avgWinProbability)}</strong>
            </div>
          </div>
        `);
      }
    }

    function renderRankings() {
      const data = buildRankData(state.currentWeek).slice(0, 16);
      const displayData = orderForTwoColumnDisplay(data);
      const weekLabel = fullWeekLabel(
        state.weeks[state.currentWeek] || "Week 0"
      );

      document.getElementById("heroWeek").textContent = weekLabel;
      renderSummary();

      const rankings = document.getElementById("rankings");
      rankings.innerHTML = displayData
        .map(team => `
          <article class="rank-card ${team.rank === 1 ? "top" : ""}">
            <div class="rank-num">${team.rank}</div>
            <div class="team-block">
              <h3 title="${escapeAttribute(team.name || "Unnamed Team")}">${escapeHtml(team.name || "Unnamed Team")}</h3>
              <div class="team-meta">
                <span class="pill" title="${escapeAttribute(team.manager || "No manager")}">${escapeHtml(team.manager || "No manager")}</span>
                <span class="pill">${escapeHtml(team.displayRecord || "-")}</span>
                <span class="pill">ELO ${formatChange(team.eloChange)}</span>
              </div>
            </div>
            <div class="metric">
              <span>ELO</span>
              <strong>${formatRating(team.currentElo)}</strong>
            </div>
            <div class="movement ${movementClass(team.rankMovement)}">${movementText(team.rankMovement)}</div>
          </article>
        `)
        .join("");

      renderAnalysisCards();
    }

    function renderSummary() {
      const strip = document.getElementById("summaryStrip");
      const awards = getAwardsForWeek(state.currentWeek);

      strip.innerHTML = awards
        .slice(0, 4)
        .map(award => `
          <div class="summary-card">
            <span>${escapeHtml(award.title || "Award")}</span>
            <strong>${escapeHtml(award.winner || "—")}</strong>
            <small>${escapeHtml(award.detail || "Enter details above")}</small>
          </div>
        `)
        .join("");
    }

    function setFantraxStatus(message, type = "") {
      const status = document.getElementById("fantraxStatus");
      if (!status) return;
      status.textContent = message;
      status.className = `hint fantrax-status ${type}`.trim();
    }

    function validateFantraxData(data) {
      if (!data || typeof data !== "object") {
        throw new Error("The Fantrax data file is empty.");
      }
      if (!Array.isArray(data.teams) || !data.teams.length) {
        throw new Error("No Fantrax teams were found.");
      }
      if (!Array.isArray(data.weeks) || !data.weeks.length) {
        throw new Error("No Fantrax scoring periods were found.");
      }
    }

    function populateFantraxPeriodSelect() {
      const select = document.getElementById("fantraxPeriodSelect");
      const importButton = document.getElementById("fantraxImportButton");
      if (!select || !importButton || !fantraxSeasonData) return;

      select.innerHTML = "";

      fantraxSeasonData.weeks
        .slice()
        .sort((a, b) => Number(a.scoringPeriod) - Number(b.scoringPeriod))
        .forEach(week => {
          const option = document.createElement("option");
          option.value = String(week.scoringPeriod);
          option.textContent = `Week ${week.scoringPeriod} ${week.dateRange || ""}`.trim();
          select.appendChild(option);
        });

      const savedPeriod = Number(state.fantraxMeta?.importedThrough);
      const availablePeriods = fantraxSeasonData.weeks.map(week =>
        Number(week.scoringPeriod)
      );

      select.value = availablePeriods.includes(savedPeriod)
        ? String(savedPeriod)
        : String(availablePeriods[0]);

      select.disabled = false;
      importButton.disabled = false;
    }

    async function loadFantraxSeason(showSuccess = true) {
      const select = document.getElementById("fantraxPeriodSelect");
      const importButton = document.getElementById("fantraxImportButton");

      if (select) select.disabled = true;
      if (importButton) importButton.disabled = true;
      setFantraxStatus("Loading Fantrax season…");

      try {
        const response = await fetch(FANTRAX_DATA_URL, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        validateFantraxData(data);
        fantraxSeasonData = data;
        populateFantraxPeriodSelect();

        const leagueName = data.league?.name || "NiceHL";
        const season = data.league?.season || "";
        setFantraxStatus(
          showSuccess
            ? `${leagueName} ${season} loaded.`
            : `${season} ready.`,
          "success"
        );
        renderAnalysisCards();
      } catch (error) {
        console.error("Could not load Fantrax data.", error);
        if (select) {
          select.innerHTML = "<option>Season unavailable</option>";
          select.disabled = true;
        }
        setFantraxStatus(
          "Could not load the Fantrax JSON file.",
          "error"
        );
        const errorMarkup = '<div class="analysis-empty">Fantrax season data could not be loaded.</div>';
        ["projectedStandings", "scheduleStrength", "remainingSchedule"].forEach(id => {
          const element = document.getElementById(id);
          if (element) element.innerHTML = errorMarkup;
        });
      }
    }

    function getWeeklyScoreEntries(week) {
      const entries = [];

      week.matchups.forEach(matchup => {
        if (matchup?.away?.name) {
          entries.push({
            name: String(matchup.away.name),
            score: Number(matchup.away.score)
          });
        }

        if (matchup?.home?.name) {
          entries.push({
            name: String(matchup.home.name),
            score: Number(matchup.home.score)
          });
        }
      });

      return entries.filter(entry => Number.isFinite(entry.score));
    }

    function calculateScoreRanks(entries) {
      const sorted = entries
        .slice()
        .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));

      const ranks = new Map();
      let index = 0;

      while (index < sorted.length) {
        let end = index;
        while (
          end + 1 < sorted.length &&
          sorted[end + 1].score === sorted[index].score
        ) {
          end++;
        }

        const averageRank = ((index + 1) + (end + 1)) / 2;
        for (let i = index; i <= end; i++) {
          ranks.set(sorted[i].name, averageRank);
        }

        index = end + 1;
      }

      return ranks;
    }

    function recordText(record) {
      if (record.ties > 0) {
        return `${record.wins}-${record.losses}-${record.ties}`;
      }
      return `${record.wins}-${record.losses}`;
    }

    function scoreDetail(team) {
      const score = Math.round(Number(team.score) * 10) / 10;
      return `${score} points`;
    }

    function buildWeekAwards(week, previousRatings) {
      const winners = [];
      const losers = [];
      const decidedMatchups = [];

      week.matchups.forEach(matchup => {
        const awayScore = Number(matchup?.away?.score);
        const homeScore = Number(matchup?.home?.score);
        if (!Number.isFinite(awayScore) || !Number.isFinite(homeScore)) return;
        if (awayScore === homeScore) return;

        const away = {
          name: String(matchup.away.name),
          score: awayScore
        };
        const home = {
          name: String(matchup.home.name),
          score: homeScore
        };

        const winner = awayScore > homeScore ? away : home;
        const loser = awayScore > homeScore ? home : away;
        const margin = Math.abs(awayScore - homeScore);
        const underdogGap =
          Number(previousRatings.get(loser.name) || 1000) -
          Number(previousRatings.get(winner.name) || 1000);

        winners.push(winner);
        losers.push(loser);
        decidedMatchups.push({
          winner,
          loser,
          margin,
          underdogGap
        });
      });

      const mostPointsInLoss = losers.length
        ? losers.slice().sort((a, b) => b.score - a.score)[0]
        : null;

      const leastPointsInWin = winners.length
        ? winners.slice().sort((a, b) => a.score - b.score)[0]
        : null;

      const narrowestWin = decidedMatchups.length
        ? decidedMatchups
            .slice()
            .sort(
              (a, b) =>
                a.margin - b.margin ||
                b.winner.score - a.winner.score
            )[0]
        : null;

      const underdogWins = decidedMatchups
        .filter(matchup => matchup.underdogGap > 0)
        .sort(
          (a, b) =>
            b.underdogGap - a.underdogGap ||
            b.margin - a.margin
        );

      const biggestUnderdogWin = underdogWins[0] || null;

      return [
        {
          title: "Most Points in a Loss",
          winner: mostPointsInLoss?.name || "—",
          detail: mostPointsInLoss ? scoreDetail(mostPointsInLoss) : "No losses"
        },
        {
          title: "Least Points in a Win",
          winner: leastPointsInWin?.name || "—",
          detail: leastPointsInWin ? scoreDetail(leastPointsInWin) : "No wins"
        },
        {
          title: "Narrowest Win",
          winner: narrowestWin?.winner?.name || "—",
          detail: narrowestWin
            ? `Beat ${narrowestWin.loser.name} by ${formatRating(narrowestWin.margin)}`
            : "No decided matchups"
        },
        {
          title: "Biggest Underdog Win",
          winner: biggestUnderdogWin?.winner?.name || "—",
          detail: biggestUnderdogWin
            ? `Beat ${biggestUnderdogWin.loser.name} as a ${formatRating(biggestUnderdogWin.underdogGap)}-point ELO underdog`
            : "No ELO underdog won"
        }
      ];
    }

    function importFantraxThroughWeek() {
      if (!fantraxSeasonData) {
        setFantraxStatus("Load the season first.", "error");
        return;
      }

      updateFromTableSilently();

      const selectedPeriod = Number(
        document.getElementById("fantraxPeriodSelect").value
      );

      const weeksToImport = fantraxSeasonData.weeks
        .filter(week => Number(week.scoringPeriod) <= selectedPeriod)
        .slice()
        .sort(
          (a, b) =>
            Number(a.scoringPeriod) - Number(b.scoringPeriod)
        );

      if (!weeksToImport.length) {
        setFantraxStatus("No scoring periods were selected.", "error");
        return;
      }

      const existingManagers = new Map(
        state.teams.map(team => [team.name, team.manager || ""])
      );

      const teams = fantraxSeasonData.teams.map(team => ({
        name: String(team.name),
        manager: existingManagers.get(String(team.name)) || "",
        record: "0-0",
        recordHistory: ["0-0"],
        elo: [1000],
        fantraxTeamId: String(team.fantraxTeamId || ""),
        teamLogoUrl: String(team.logoUrl || "")
      }));

      const teamMap = new Map(teams.map(team => [team.name, team]));
      const records = new Map(
        teams.map(team => [
          team.name,
          { wins: 0, losses: 0, ties: 0 }
        ])
      );

      const existingAwardsByWeek = Array.isArray(state.awardsByWeek)
        ? structuredCloneSafe(state.awardsByWeek)
        : [];

      const weeks = ["Week 0"];
      const awardsByWeek = [
        normalizeAwards(existingAwardsByWeek[0] || DEFAULT_AWARDS)
      ];

      weeksToImport.forEach(week => {
        const period = Number(week.scoringPeriod);
        weeks.push(`Week ${period}`);

        const scoreEntries = getWeeklyScoreEntries(week);
        const scoreRanks = calculateScoreRanks(scoreEntries);
        const teamCount = scoreEntries.length;

        const previousRatings = new Map(
          teams.map(team => [
            team.name,
            Number(team.elo[team.elo.length - 1] ?? 1000)
          ])
        );

        const weeklyChanges = new Map(
          teams.map(team => [team.name, 0])
        );

        scoreEntries.forEach(entry => {
          const rank = Number(scoreRanks.get(entry.name));
          const scoreRankPoints = Number.isFinite(rank)
            ? teamCount - rank
            : 0;

          weeklyChanges.set(
            entry.name,
            Number(weeklyChanges.get(entry.name) || 0) +
              scoreRankPoints
          );
        });

        week.matchups.forEach(matchup => {
          const awayName = String(matchup?.away?.name || "");
          const homeName = String(matchup?.home?.name || "");
          const awayScore = Number(matchup?.away?.score);
          const homeScore = Number(matchup?.home?.score);

          if (
            !teamMap.has(awayName) ||
            !teamMap.has(homeName) ||
            !Number.isFinite(awayScore) ||
            !Number.isFinite(homeScore)
          ) {
            return;
          }

          const awayRank = Number(scoreRanks.get(awayName));
          const homeRank = Number(scoreRanks.get(homeName));

          if (awayScore > homeScore) {
            const winPoints = teamCount + 1 - homeRank;
            const lossPoints = -awayRank;

            weeklyChanges.set(
              awayName,
              Number(weeklyChanges.get(awayName) || 0) + winPoints
            );
            weeklyChanges.set(
              homeName,
              Number(weeklyChanges.get(homeName) || 0) + lossPoints
            );

            records.get(awayName).wins++;
            records.get(homeName).losses++;
          } else if (homeScore > awayScore) {
            const winPoints = teamCount + 1 - awayRank;
            const lossPoints = -homeRank;

            weeklyChanges.set(
              homeName,
              Number(weeklyChanges.get(homeName) || 0) + winPoints
            );
            weeklyChanges.set(
              awayName,
              Number(weeklyChanges.get(awayName) || 0) + lossPoints
            );

            records.get(homeName).wins++;
            records.get(awayName).losses++;
          } else {
            records.get(awayName).ties++;
            records.get(homeName).ties++;
          }
        });

        teams.forEach(team => {
          const previous = Number(
            team.elo[team.elo.length - 1] ?? 1000
          );
          const change = Number(weeklyChanges.get(team.name) || 0);
          const updated = Math.round((previous + change) * 10) / 10;
          team.elo.push(updated);

          const record = records.get(team.name);
          const currentRecord = recordText(record);
          team.recordHistory.push(currentRecord);
          team.record = currentRecord;
        });

        awardsByWeek.push(
          normalizeAwards(
            existingAwardsByWeek[period] || DEFAULT_AWARDS
          )
        );
      });

      const importedWeekIndex = weeks.length - 1;

      state = cleanState({
        currentWeek: importedWeekIndex,
        weeks,
        teams,
        awardsByWeek,
        awards: awardsByWeek[importedWeekIndex],
        logoDataUrl: state.logoDataUrl,
        fantraxMeta: {
          leagueId: String(fantraxSeasonData.league?.leagueId || ""),
          leagueName: String(fantraxSeasonData.league?.name || ""),
          season: String(fantraxSeasonData.league?.season || ""),
          importedThrough: selectedPeriod,
          importedAt: new Date().toISOString(),
          formula:
            "weekly score rank points plus opponent score-rank result points",
          awardsMode: "manual"
        }
      });

      saveState();
      renderAll();
      populateFantraxPeriodSelect();

      setFantraxStatus(
        `Imported Weeks 1–${selectedPeriod}.`,
        "success"
      );
    }

    function toggleScreenshotMode() {
      updateFromTable();
      document.body.classList.toggle("screenshot-mode");
      document
        .getElementById("captureArea")
        .scrollIntoView({ block: "start", behavior: "smooth" });
    }

    function downloadData() {
      updateFromTableSilently();
      const clean = cleanState(state);
      const blob = new Blob(
        [JSON.stringify(clean, null, 2)],
        { type: "application/json" }
      );
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "nicehl-power-rankings-data.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = e => {
        try {
          const imported = JSON.parse(e.target.result);
          if (
            !Array.isArray(imported.weeks) ||
            !Array.isArray(imported.teams)
          ) {
            throw new Error("Invalid data file");
          }

          state = cleanState(imported);
          saveState();
          renderAll();

          if (fantraxSeasonData) {
            populateFantraxPeriodSelect();
          }
        } catch (error) {
          alert(
            "That file does not match the fantasy power rankings format."
          );
        }
      };

      reader.readAsText(file);
      event.target.value = "";
    }

    function resetSample() {
      localStorage.removeItem(STORAGE_KEY);
      state = structuredCloneSafe(defaultState);
      saveState();
      renderAll();

      if (fantraxSeasonData) {
        populateFantraxPeriodSelect();
      }
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g, "&#096;");
    }

    function renderAll() {
      state = cleanState(state);
      renderWeekSelect();
      renderInputTable();
      renderAwardsEditor();
      renderLogo();
      renderRankings();
    }

    loadState();
    renderAll();
    loadFantraxSeason(false);
  </script>
